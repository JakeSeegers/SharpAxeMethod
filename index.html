
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sharp Axe Method</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ─── DESIGN TOKENS ─────────────────────────────────────────────── */
  :root {
    --bg:          #f1f4f6;
    --surface:     #ffffff;
    --surface-2:   #f7f9fa;
    --ink:         #111820;
    --ink-mid:     #46515d;
    --ink-muted:   #7a8592;
    --ink-faint:   #b3bcc6;
    --line:        #e1e6ea;
    --line-strong: #cbd3da;

    --accent:        #e2550f;
    --accent-strong: #b8420a;
    --accent-soft:   #fff1e9;
    --accent-ink:    #8f3309;
    --steel:         #1d3550;
    --steel-soft:    #e7eef5;
    --good:          #2b8a3e;
    --good-soft:     #e8f6ec;

    --q1:    #e03131;
    --q2:    #1c7ed6;
    --quick: #7048e8;
    --q4:    #868e96;

    --shadow: 0 1px 2px rgba(17, 24, 32, 0.05), 0 4px 14px rgba(17, 24, 32, 0.05);
    --head: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
    --sans: 'Figtree', ui-sans-serif, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:          #0e1217;
      --surface:     #161c23;
      --surface-2:   #1c232b;
      --ink:         #e9eef3;
      --ink-mid:     #b4bfca;
      --ink-muted:   #828e9b;
      --ink-faint:   #4f5a66;
      --line:        #252d36;
      --line-strong: #343e49;

      --accent:        #ff7a3d;
      --accent-strong: #ff9a66;
      --accent-soft:   #2b1a11;
      --accent-ink:    #ffb48f;
      --steel:         #c7d5e3;
      --steel-soft:    #1b2734;
      --good:          #51cf66;
      --good-soft:     #142a1b;

      --q1:    #ff6b6b;
      --q2:    #4dabf7;
      --quick: #9775fa;
      --q4:    #868e96;

      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.25);
    }
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  ::selection { background: var(--accent-soft); color: var(--accent-ink); }
  button { font-family: var(--sans); }

  /* ─── HEADER ────────────────────────────────────────────────────── */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 50;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    color: var(--ink);
    font-family: var(--head);
    font-weight: 800;
    font-size: 17px;
    letter-spacing: -0.01em;
  }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 8px;
    background: var(--accent); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .topbar-right { display: flex; align-items: center; gap: 14px; }
  .pips { display: flex; gap: 5px; align-items: center; }
  .pip {
    width: 8px; height: 8px; border-radius: 4px; padding: 0;
    background: var(--line-strong); border: none; cursor: pointer;
    transition: all 0.25s ease;
  }
  .pip:hover { background: var(--ink-faint); }
  .pip.done    { background: var(--steel); opacity: 0.55; }
  .pip.current { background: var(--accent); width: 24px; opacity: 1; }

  /* ─── MENU BUTTON + DROPDOWN ────────────────────────────────────── */
  .menu-wrap { position: relative; }
  .menu-btn {
    width: 36px; height: 36px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink-mid);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .menu-btn:hover, .menu-btn.open { border-color: var(--line-strong); color: var(--ink); background: var(--surface-2); }
  .menu-dropdown {
    position: absolute; top: calc(100% + 8px); right: 0;
    min-width: 230px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.16);
    padding: 6px;
    z-index: 100;
    display: none;
    animation: menuIn 0.15s ease;
  }
  .menu-dropdown.open { display: block; }
  @keyframes menuIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: none; }
  }
  .menu-item {
    display: flex; align-items: center; gap: 12px;
    width: 100%; padding: 10px 12px;
    background: transparent; border: none;
    border-radius: 7px;
    color: var(--ink);
    font-size: 14px; font-weight: 600;
    text-align: left; cursor: pointer;
  }
  .menu-item:hover { background: var(--surface-2); }
  .menu-item svg { color: var(--ink-muted); flex-shrink: 0; }
  .menu-item:hover svg { color: var(--accent); }
  .menu-item-sub {
    font-size: 12px; color: var(--ink-muted);
    display: block; margin-top: 1px; font-weight: 400;
  }
  .menu-divider { height: 1px; background: var(--line); margin: 4px 8px; }

  /* ─── MAIN ──────────────────────────────────────────────────────── */
  main {
    max-width: 740px; margin: 0 auto;
    padding: 40px 24px 80px;
  }
  .phase-header { margin-bottom: 30px; }
  .phase-num {
    display: inline-block;
    font-size: 12px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--accent);
    margin-bottom: 10px;
  }
  .phase-title {
    font-family: var(--head);
    font-size: 38px; font-weight: 800; line-height: 1.08;
    color: var(--ink); letter-spacing: -0.025em; margin-bottom: 8px;
  }
  .phase-sub { font-size: 16px; color: var(--ink-mid); }

  .section-label {
    font-size: 12px; font-weight: 700; color: var(--ink-muted);
    letter-spacing: 0.07em; text-transform: uppercase;
    margin-bottom: 10px; display: block;
  }
  .section { margin-top: 28px; }
  .hint { font-size: 13px; color: var(--ink-muted); margin-bottom: 12px; }

  /* ─── BUTTONS ───────────────────────────────────────────────────── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 18px;
    border-radius: 8px;
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--ink);
    font-size: 14px; font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    user-select: none;
    text-decoration: none;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--ink-faint); background: var(--surface-2); }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--accent); color: #fff; border-color: transparent; }
  .btn-primary:hover { background: var(--accent-strong); color: #fff; }
  .btn-dark { background: var(--steel); color: var(--bg); border-color: transparent; }
  .btn-dark:hover { background: var(--ink); color: var(--bg); }
  .btn-good { background: var(--good); color: #fff; border-color: transparent; }
  .btn-good:hover { filter: brightness(1.08); background: var(--good); }
  .btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 7px; }
  .btn-lg { padding: 14px 24px; font-size: 16px; }
  .btn-icon { padding: 12px; min-width: 46px; }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--ink-mid); }
  .btn-ghost:hover { background: var(--surface-2); color: var(--ink); border-color: transparent; }

  .icon-btn {
    background: none; border: none; cursor: pointer;
    color: var(--ink-faint);
    padding: 5px; border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center;
    transition: color 0.15s ease, background 0.15s ease;
  }
  .icon-btn:hover { color: var(--ink); background: var(--surface-2); }
  .icon-btn.danger:hover { color: var(--q1); }
  .icon-btn.on { color: var(--quick); }

  /* ─── INPUTS ────────────────────────────────────────────────────── */
  input[type="text"], textarea {
    width: 100%;
    background: var(--surface);
    border: 1.5px solid var(--line);
    color: var(--ink);
    border-radius: 9px;
    padding: 12px 15px;
    outline: none;
    font-family: var(--sans); font-size: 15px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input[type="text"]:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  input::placeholder, textarea::placeholder { color: var(--ink-faint); }
  textarea { resize: vertical; min-height: 120px; line-height: 1.6; }
  input[type="time"], input[type="date"], select {
    padding: 7px 10px; font-size: 13px; font-family: var(--sans);
    background: var(--surface-2); color: var(--ink);
    border: 1.5px solid var(--line); border-radius: 7px;
    outline: none; cursor: pointer;
  }
  input[type="time"]:focus, input[type="date"]:focus, select:focus { border-color: var(--accent); }
  @media (prefers-color-scheme: dark) {
    input[type="time"], input[type="date"] { color-scheme: dark; }
  }

  .input-row { display: flex; gap: 10px; margin-bottom: 18px; }
  .input-row input { flex: 1; }

  /* ─── SEGMENTED CONTROL ─────────────────────────────────────────── */
  .seg {
    display: inline-flex; gap: 4px; padding: 4px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; margin-bottom: 12px;
  }
  .seg button {
    border: none; background: transparent; cursor: pointer;
    padding: 7px 14px; border-radius: 7px;
    font-size: 13px; font-weight: 600; color: var(--ink-mid);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .seg button.active { background: var(--steel); color: var(--bg); }
  .seg button.active.quick { background: var(--quick); color: #fff; }

  /* ─── CHECKLIST CARDS ───────────────────────────────────────────── */
  .checklist { display: flex; flex-direction: column; gap: 12px; }
  .check-card {
    display: flex; align-items: center; gap: 16px;
    padding: 17px 20px;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 11px;
    cursor: pointer; text-align: left;
    transition: border-color 0.2s ease, background 0.2s ease;
    width: 100%;
    color: var(--ink);
  }
  .check-card:hover { border-color: var(--line-strong); }
  .check-card.checked { background: var(--good-soft); border-color: color-mix(in srgb, var(--good) 40%, transparent); }
  .check-circle {
    width: 24px; height: 24px; border-radius: 7px; flex-shrink: 0;
    border: 2px solid var(--ink-faint);
    background: transparent;
    display: inline-flex; align-items: center; justify-content: center;
    color: transparent;
    transition: all 0.2s ease;
  }
  .check-circle.large { width: 26px; height: 26px; }
  .check-card.checked .check-circle { background: var(--good); border-color: var(--good); color: #fff; }
  .check-text { font-size: 15px; color: var(--ink); line-height: 1.4; }
  .check-card.checked .check-text { color: var(--ink-muted); text-decoration: line-through; }
  .check-counter { font-size: 13px; color: var(--ink-muted); text-align: right; margin-top: 4px; }

  .extra-panel {
    margin-top: -4px;
    padding: 20px;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 11px;
  }

  /* ─── BOX BREATHING ─────────────────────────────────────────────── */
  .breath { display: flex; align-items: center; gap: 28px; }
  .breath svg { flex-shrink: 0; width: 180px; height: 180px; }
  .breath-track { fill: none; stroke: var(--line-strong); stroke-width: 3; }
  .breath-fill { fill: color-mix(in srgb, var(--q2) 18%, transparent); stroke: none; }
  .breath-dot { fill: var(--accent); }
  .breath-count { font-family: var(--head); font-weight: 800; font-size: 40px; fill: var(--ink); }
  .breath-side { stroke: var(--accent); stroke-width: 4; stroke-linecap: round; fill: none; opacity: 0; transition: opacity 0.2s; }
  .breath-side.on { opacity: 1; }
  .breath-body { flex: 1; }
  .breath-step {
    font-family: var(--head); font-weight: 800; font-size: 26px;
    color: var(--ink); line-height: 1.1; margin-bottom: 4px;
  }
  .breath-help { font-size: 14px; color: var(--ink-mid); margin-bottom: 14px; }
  .breath-cycles { font-size: 13px; color: var(--ink-muted); margin-top: 10px; }

  /* ─── TASK LISTS ────────────────────────────────────────────────── */
  .task-list { display: flex; flex-direction: column; gap: 8px; }
  .task-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px 10px 14px;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 9px;
  }
  .task-row.quick { border-left: 4px solid var(--quick); }
  .task-index { color: var(--ink-faint); font-size: 12px; min-width: 18px; text-align: right; }
  .task-row input.task-text {
    flex: 1; font-size: 15px; color: var(--ink); line-height: 1.4;
    background: transparent; border: none; outline: none; box-shadow: none;
    padding: 2px 0; border-radius: 0;
    font-family: var(--sans); min-width: 0;
  }
  .empty {
    text-align: center; color: var(--ink-muted);
    font-size: 15px; padding: 32px 0;
    border: 1.5px dashed var(--line-strong); border-radius: 11px;
  }
  .empty.small { padding: 16px; font-size: 14px; }

  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.02em;
    padding: 2px 8px; border-radius: 99px;
    background: color-mix(in srgb, var(--c, var(--ink-muted)) 14%, transparent);
    color: var(--c, var(--ink-muted));
    white-space: nowrap;
  }

  /* ─── SORT MATRIX ───────────────────────────────────────────────── */
  .unassigned-wrap { margin-bottom: 22px; }
  .chip-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 7px 12px;
    background: var(--surface);
    border: 1.5px dashed var(--ink-faint);
    border-radius: 8px;
    font-size: 14px; color: var(--ink);
    cursor: grab; user-select: none;
    transition: border-color 0.15s, transform 0.05s, box-shadow 0.15s;
  }
  .chip:hover { border-color: var(--accent); }
  .chip:active { cursor: grabbing; transform: scale(0.98); }
  .chip.picked, .q-task.picked { border: 1.5px solid var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .matrix { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .quadrant {
    --c: var(--ink-muted);
    min-height: 150px;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-top: 4px solid var(--c);
    border-radius: 11px;
    padding: 14px;
    transition: background 0.15s, box-shadow 0.15s;
  }
  .quadrant.drag-over, .quadrant.target { background: color-mix(in srgb, var(--c) 7%, var(--surface)); }
  .quadrant.target { cursor: pointer; box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 40%, transparent); }
  .quadrant.q1 { --c: var(--q1); }
  .quadrant.q2 { --c: var(--q2); }
  .quadrant.quick { --c: var(--quick); }
  .quadrant.q4 { --c: var(--q4); }
  .q-label { font-family: var(--head); font-size: 16px; font-weight: 800; color: var(--c); }
  .q-sub { font-size: 12px; color: var(--ink-muted); margin-bottom: 10px; }
  .q-tasks { display: flex; flex-direction: column; gap: 6px; }
  .q-task {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    padding: 6px 8px; border-radius: 7px; font-size: 13px;
    color: var(--ink); cursor: grab;
    border: 1.5px solid transparent;
    background: color-mix(in srgb, var(--c) 9%, var(--surface));
  }
  .q-task:active { cursor: grabbing; }
  .q-task-text { flex: 1; line-height: 1.3; }
  .q-empty { font-size: 12px; color: var(--ink-faint); font-style: italic; }

  .key-question {
    margin-top: 20px; padding: 16px 20px;
    background: var(--steel-soft);
    border-radius: 11px;
    border-left: 4px solid var(--steel);
  }
  .key-question-label {
    font-size: 12px; font-weight: 700; color: var(--steel);
    text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 4px;
  }
  .key-question-text { font-size: 15px; color: var(--ink); line-height: 1.5; }

  /* ─── SCHEDULE ──────────────────────────────────────────────────── */
  .rules {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .rule {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 11px 13px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 9px;
    font-size: 13.5px; color: var(--ink-mid); line-height: 1.45;
  }
  .rule strong { color: var(--ink); font-weight: 700; }
  .rule-num {
    flex-shrink: 0; width: 20px; height: 20px; border-radius: 6px;
    background: var(--accent-soft); color: var(--accent-ink);
    font-size: 11px; font-weight: 800;
    display: inline-flex; align-items: center; justify-content: center;
    margin-top: 1px;
  }
  .schedule-task {
    padding: 13px 15px;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    margin-bottom: 8px;
  }
  .schedule-task-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .schedule-task-num { color: var(--ink-faint); font-size: 12px; min-width: 16px; text-align: right; }
  .schedule-task-text { flex: 1; font-size: 15px; color: var(--ink); }
  .schedule-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-left: 26px; }
  .gcal-btn { margin-left: auto; }

  /* ─── COMMUNICATE ───────────────────────────────────────────────── */
  .ref-list { display: flex; flex-direction: column; gap: 6px; }
  .ref-row {
    display: flex; justify-content: space-between; gap: 12px;
    font-size: 14px; padding: 8px 12px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  }
  .ref-when { color: var(--ink-muted); white-space: nowrap; font-size: 13px; }
  .row-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

  /* ─── PROGRESS ──────────────────────────────────────────────────── */
  .progress-wrap { margin-bottom: 24px; }
  .progress-meta {
    display: flex; justify-content: space-between; gap: 12px;
    font-size: 14px; color: var(--ink-mid); margin-bottom: 8px;
  }
  .progress-meta strong { color: var(--ink); font-weight: 700; white-space: nowrap; }
  .progress-track { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .progress-fill {
    height: 100%; border-radius: 99px;
    background: linear-gradient(90deg, var(--accent), var(--good));
    transition: width 0.5s ease;
  }

  /* ─── TRIAGE ────────────────────────────────────────────────────── */
  .focus-card {
    padding: 24px;
    background: var(--surface);
    border: 2px solid var(--accent);
    border-radius: 14px;
    box-shadow: var(--shadow);
  }
  .focus-label {
    font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 6px;
    display: flex; align-items: center; gap: 8px;
  }
  .focus-label::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.3; } }
  .focus-text {
    font-family: var(--head); font-size: 26px; font-weight: 800; line-height: 1.2;
    letter-spacing: -0.015em; color: var(--ink); margin-bottom: 8px;
    word-break: break-word;
  }
  .focus-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .focus-grid { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
  .focus-steps { flex: 1; min-width: 220px; }
  .focus-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; }

  .steps { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .step {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 8px;
    background: var(--surface-2); font-size: 14px;
  }
  .step.next { background: var(--accent-soft); font-weight: 600; }
  .step.done span.step-text { text-decoration: line-through; color: var(--ink-muted); }
  .step .check-circle { width: 20px; height: 20px; border-radius: 6px; cursor: pointer; }
  .step.done .check-circle { background: var(--good); border-color: var(--good); color: #fff; }
  .step-text { flex: 1; }
  .step-input { font-size: 14px !important; padding: 9px 12px !important; }

  .timer { width: 150px; text-align: center; }
  .timer svg { width: 120px; height: 120px; display: block; margin: 0 auto 6px; }
  .timer-track { fill: none; stroke: var(--line); stroke-width: 8; }
  .timer-ring {
    fill: none; stroke: var(--accent); stroke-width: 8; stroke-linecap: round;
    transform: rotate(-90deg); transform-origin: 60px 60px;
    transition: stroke-dashoffset 0.25s linear;
  }
  .timer-text { font-family: var(--head); font-weight: 800; font-size: 24px; fill: var(--ink); }
  .timer-presets { display: flex; gap: 4px; justify-content: center; margin-bottom: 6px; }
  .timer-presets button {
    border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-mid);
    font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; cursor: pointer;
  }
  .timer-presets button.active { background: var(--steel); color: var(--bg); border-color: var(--steel); }
  .timer-controls { display: flex; gap: 4px; justify-content: center; }

  .stuck-row {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    margin-top: 14px; font-size: 13px; color: var(--ink-muted);
  }

  .up-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px 9px 12px;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 9px;
  }
  .up-row .check-circle { cursor: pointer; width: 22px; height: 22px; border-radius: 6px; }
  .up-row .check-circle:hover { border-color: var(--good); }
  .up-row.done .check-circle { background: var(--good); border-color: var(--good); color: #fff; }
  .up-row.done .up-text { text-decoration: line-through; color: var(--ink-muted); }
  .up-num { font-size: 12px; color: var(--ink-faint); min-width: 16px; text-align: right; }
  .up-text { flex: 1; font-size: 14.5px; min-width: 0; word-break: break-word; }
  .up-tools { display: flex; gap: 2px; }

  .all-done {
    text-align: center; padding: 36px 20px;
    background: var(--good-soft); border-radius: 14px;
  }
  .all-done-title { font-family: var(--head); font-size: 28px; font-weight: 800; color: var(--good); }
  .all-done-sub { color: var(--ink-mid); margin-top: 4px; }

  .note-line {
    margin-top: 18px; font-size: 13px; color: var(--ink-muted); text-align: center;
  }

  /* ─── CONFETTI ──────────────────────────────────────────────────── */
  .confetti {
    position: fixed; width: 8px; height: 8px; border-radius: 2px;
    pointer-events: none; z-index: 300;
    animation: confetti 0.9s cubic-bezier(.2,.7,.4,1) forwards;
  }
  @keyframes confetti {
    to { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); opacity: 0; }
  }

  /* ─── REFLECT ───────────────────────────────────────────────────── */
  .question-card {
    padding: 18px 20px;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 11px;
    margin-bottom: 12px;
  }
  .question-text { font-size: 15px; color: var(--ink); margin-bottom: 12px; line-height: 1.5; font-weight: 600; }
  .rating-row { display: flex; gap: 8px; }
  .rating-btn {
    flex: 1; padding: 8px 10px;
    background: var(--surface-2); color: var(--ink-mid);
    border: 1.5px solid var(--line);
    border-radius: 8px; cursor: pointer;
    font-size: 13px; font-weight: 600;
    transition: all 0.15s ease;
  }
  .rating-btn:hover { border-color: var(--line-strong); }
  .rating-btn.active { background: var(--steel); color: var(--bg); border-color: var(--steel); }
  .stats-banner {
    margin-top: 20px; padding: 18px 20px;
    background: var(--surface); border: 1.5px solid var(--line);
    border-radius: 11px;
    display: flex; gap: 24px; justify-content: space-around;
  }
  .stat { text-align: center; }
  .stat-value { font-family: var(--head); font-size: 30px; font-weight: 800; color: var(--ink); line-height: 1; }
  .stat-label { font-size: 11px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 6px; }

  .save-card {
    margin-top: 20px; padding: 20px 22px;
    background: var(--steel-soft);
    border-radius: 11px;
    display: flex; align-items: center; gap: 16px;
  }
  .save-card-body { flex: 1; }
  .save-card-title { font-family: var(--head); font-size: 18px; font-weight: 800; color: var(--ink); margin-bottom: 2px; }
  .save-card-sub { font-size: 13px; color: var(--ink-mid); line-height: 1.4; }
  .save-card .btn { flex-shrink: 0; }

  /* ─── TIP CALLOUT ───────────────────────────────────────────────── */
  .tip {
    margin-top: 28px; padding: 14px 18px;
    background: var(--accent-soft);
    border-radius: 10px;
    border-left: 4px solid var(--accent);
    font-size: 14px; color: var(--accent-ink);
    line-height: 1.6;
  }

  /* ─── NAV ───────────────────────────────────────────────────────── */
  .nav {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 44px; padding-top: 22px;
    border-top: 1px solid var(--line);
  }
  .nav-back-hidden { visibility: hidden; }

  /* ─── QUOTE ─────────────────────────────────────────────────────── */
  .quote {
    margin-top: 32px; text-align: center;
    color: var(--ink-muted); font-size: 13px;
    font-style: italic; line-height: 1.7;
  }
  .quote-attr {
    margin-top: 6px; font-style: normal; font-weight: 700;
    font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
  }

  /* ─── TOAST ─────────────────────────────────────────────────────── */
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--bg);
    padding: 12px 20px; border-radius: 10px;
    font-size: 14px; font-weight: 600;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 200; max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: #a32020; color: #fff; }

  /* ─── PHASE TRANSITIONS ─────────────────────────────────────────── */
  .phase-content.enter { animation: fadeIn 0.3s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .phase-content.enter, .focus-label::before { animation: none; }
  }

  @media (max-width: 600px) {
    .topbar { padding: 12px 16px; }
    .brand-name { display: none; }
    .topbar-right { gap: 10px; }
    main { padding: 28px 16px 60px; }
    .phase-title { font-size: 30px; }
    .matrix, .rules { grid-template-columns: 1fr; }
    .stats-banner { gap: 12px; }
    .save-card { flex-direction: column; align-items: flex-start; }
    .breath { flex-direction: column; text-align: center; gap: 16px; }
    .schedule-controls { padding-left: 0; }
    .gcal-btn { margin-left: 0; }
    .focus-card { padding: 18px; }
    .focus-text { font-size: 22px; }
    .timer { width: 100%; }
  }
</style>
</head>
<body>

<main id="main">

      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">

    </button>
