<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sharp Axe Method</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ─── DESIGN TOKENS ─────────────────────────────────────────────── */
  :root {
    --bg:          #f1f4f6;
    --surface:     #ffffff;
    --surface-2:   #f7f9fa;
    --ink:         #111820;
    --ink-mid:     #46515d;
    --ink-muted:   #7a8592;
    --ink-faint:   #b3bcc6;
    --line:        #e1e6ea;
    --line-strong: #cbd3da;

    --accent:        #e2550f;
    --accent-strong: #b8420a;
    --accent-soft:   #fff1e9;
    --accent-ink:    #8f3309;
    --steel:         #1d3550;
    --steel-soft:    #e7eef5;
    --good:          #2b8a3e;
    --good-soft:     #e8f6ec;

    --q1:    #e03131;
    --q2:    #1c7ed6;
    --quick: #7048e8;
    --q4:    #868e96;
    --amber:  #d9900b;
    --bucket: #0c8599;

    --shadow: 0 1px 2px rgba(17, 24, 32, 0.05), 0 4px 14px rgba(17, 24, 32, 0.05);
    --head: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
    --sans: 'Figtree', ui-sans-serif, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:          #0e1217;
      --surface:     #161c23;
      --surface-2:   #1c232b;
      --ink:         #e9eef3;
      --ink-mid:     #b4bfca;
      --ink-muted:   #828e9b;
      --ink-faint:   #4f5a66;
      --line:        #252d36;
      --line-strong: #343e49;

      --accent:        #ff7a3d;
      --accent-strong: #ff9a66;
      --accent-soft:   #2b1a11;
      --accent-ink:    #ffb48f;
      --steel:         #c7d5e3;
      --steel-soft:    #1b2734;
      --good:          #51cf66;
      --good-soft:     #142a1b;

      --q1:    #ff6b6b;
      --q2:    #4dabf7;
      --quick: #9775fa;
      --q4:    #868e96;
      --amber:  #fcc419;
      --bucket: #3bc9db;

      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.25);
    }
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  ::selection { background: var(--accent-soft); color: var(--accent-ink); }
  button { font-family: var(--sans); }

  /* ─── HEADER ────────────────────────────────────────────────────── */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 50;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    color: var(--ink);
    font-family: var(--head);
    font-weight: 800;
    font-size: 17px;
    letter-spacing: -0.01em;
  }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 8px;
    background: var(--accent); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .topbar-right { display: flex; align-items: center; gap: 14px; }
  .pips { display: flex; gap: 5px; align-items: center; }
  .pip {
    width: 8px; height: 8px; border-radius: 4px; padding: 0;
    background: var(--line-strong); border: none; cursor: pointer;
    transition: all 0.25s ease;
  }
  .pip:hover { background: var(--ink-faint); }
  .pip.done    { background: var(--steel); opacity: 0.55; }
  .pip.current { background: var(--accent); width: 24px; opacity: 1; }
  .pips.on-home .pip.current { width: 8px; background: var(--steel); opacity: 0.55; }

  /* ─── MENU BUTTON + DROPDOWN ────────────────────────────────────── */
  .menu-wrap { position: relative; }
  .menu-btn {
    width: 36px; height: 36px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink-mid);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .menu-btn:hover, .menu-btn.open { border-color: var(--line-strong); color: var(--ink); background: var(--surface-2); }
  .menu-dropdown {
    position: absolute; top: calc(100% + 8px); right: 0;
    min-width: 230px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.16);
    padding: 6px;
    z-index: 100;
    display: none;
    animation: menuIn 0.15s ease;
  }
  .menu-dropdown.open { display: block; }
  @keyframes menuIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: none; }
  }
  .menu-item {
    display: flex; align-items: center; gap: 12px;
    width: 100%; padding: 10px 12px;
    background: transparent; border: none;
    border-radius: 7px;
    color: var(--ink);
    font-size: 14px; font-weight: 600;
    text-align: left; cursor: pointer;
  }
  .menu-item:hover { background: var(--surface-2); }
  .menu-item svg { color: var(--ink-muted); flex-shrink: 0; }
  .menu-item:hover svg { color: var(--accent); }
  .menu-item-sub {
    font-size: 12px; color: var(--ink-muted);
    display: block; margin-top: 1px; font-weight: 400;
  }
  .menu-divider { height: 1px; background: var(--line); margin: 4px 8px; }

  /* ─── MAIN ──────────────────────────────────────────────────────── */
  main {
    max-width: 740px; margin: 0 auto;
    padding: 40px 24px 80px;
  }
  .phase-header { margin-bottom: 30px; }
  .phase-num {
    display: inline-block;
    font-size: 12px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--accent);
    margin-bottom: 10px;
  }
  .phase-title {
    font-family: var(--head);
    font-size: 38px; font-weight: 800; line-height: 1.08;
    color: var(--ink); letter-spacing: -0.025em; margin-bottom: 8px;
  }
  .phase-sub { font-size: 16px; color: var(--ink-mid); }

  .section-label {
    font-size: 12px; font-weight: 700; color: var(--ink-muted);
    letter-spacing: 0.07em; text-transform: uppercase;
    margin-bottom: 10px; display: block;
  }
  .section { margin-top: 28px; }
  .hint { font-size: 13px; color: var(--ink-muted); margin-bottom: 12px; }

  /* ─── BUTTONS ───────────────────────────────────────────────────── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 18px;
    border-radius: 8px;
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--ink);
    font-size: 14px; font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    user-select: none;
    text-decoration: none;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--ink-faint); background: var(--surface-2); }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--accent); color: #fff; border-color: transparent; }
  .btn-primary:hover { background: var(--accent-strong); color: #fff; }
  .btn-dark { background: var(--steel); color: var(--bg); border-color: transparent; }
  .btn-dark:hover { background: var(--ink); color: var(--bg); }
  .btn-good { background: var(--good); color: #fff; border-color: transparent; }
  .btn-good:hover { filter: brightness(1.08); background: var(--good); }
  .btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 7px; }
  .btn-lg { padding: 14px 24px; font-size: 16px; }
  .btn-icon { padding: 12px; min-width: 46px; }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--ink-mid); }
  .btn-ghost:hover { background: var(--surface-2); color: var(--ink); border-color: transparent; }

  .icon-btn {
    background: none; border: none; cursor: pointer;
    color: var(--ink-faint);
    padding: 5px; border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center;
    transition: color 0.15s ease, background 0.15s ease;
  }
  .icon-btn:hover { color: var(--ink); background: var(--surface-2); }
  .icon-btn.danger:hover { color: var(--q1); }
  .icon-btn.on { color: var(--quick); }

  /* ─── INPUTS ────────────────────────────────────────────────────── */
  input[type="text"], textarea {
    width: 100%;
    background: var(--surface);
    border: 1.5px solid var(--line);
    color: var(--ink);
    border-radius: 9px;
    padding: 12px 15px;
    outline: none;
    font-family: var(--sans); font-size: 15px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input[type="text"]:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  input::placeholder, textarea::placeholder { color: var(--ink-faint); }
  textarea { resize: vertical; min-height: 120px; line-height: 1.6; }
  input[type="time"], input[type="date"], select {
    padding: 7px 10px; font-size: 13px; font-family: var(--sans);
    background: var(--surface-2); color: var(--ink);
    border: 1.5px solid var(--line); border-radius: 7px;
    outline: none; cursor: pointer;
  }
  input[type="time"]:focus, input[type="date"]:focus, select:focus { border-color: var(--accent); }
  @media (prefers-color-scheme: dark) {
    input[type="time"], input[type="date"] { color-scheme: dark; }
  }

  .input-row { display: flex; gap: 10px; margin-bottom: 18px; }
  .input-row input { flex: 1; }

  /* ─── SEGMENTED CONTROL ─────────────────────────────────────────── */
  .seg {
    display: inline-flex; gap: 4px; padding: 4px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; margin-bottom: 12px;
  }
  .seg button {
    border: none; background: transparent; cursor: pointer;
    padding: 7px 14px; border-radius: 7px;
    font-size: 13px; font-weight: 600; color: var(--ink-mid);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .seg button.active { background: var(--steel); color: var(--bg); }
  .seg button.active.quick { background: var(--quick); color: #fff; }

  /* ─── CHECKLIST CARDS ───────────────────────────────────────────── */
  .checklist { display: flex; flex-direction: column; gap: 12px; }
  .check-card {
    display: flex; align-items: center; gap: 16px;
    padding: 17px 20px;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 11px;
    cursor: pointer; text-align: left;
    transition: border-color 0.2s ease, background 0.2s ease;
    width: 100%;
    color: var(--ink);
  }
  .check-card:hover { border-color: var(--line-strong); }
  .check-card.checked { background: var(--good-soft); border-color: color-mix(in srgb, var(--good) 40%, transparent); }
  .check-circle {
    width: 24px; height: 24px; border-radius: 7px; flex-shrink: 0;
    border: 2px solid var(--ink-faint);
    background: transparent;
    display: inline-flex; align-items: center; justify-content: center;
    color: transparent;
    transition: all 0.2s ease;
  }
  .check-circle.large { width: 26px; height: 26px; }
  .check-card.checked .check-circle { background: var(--good); border-color: var(--good); color: #fff; }
  .check-text { font-size: 15px; color: var(--ink); line-height: 1.4; }
  .check-card.checked .check-text { color: var(--ink-muted); text-decoration: line-through; }
  .check-counter { font-size: 13px; color: var(--ink-muted); text-align: right; margin-top: 4px; }

  .extra-panel {
    margin-top: -4px;
    padding: 20px;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 11px;
  }

  /* ─── BOX BREATHING ─────────────────────────────────────────────── */
  .breath { display: flex; align-items: center; gap: 28px; }
  .breath svg { flex-shrink: 0; width: 180px; height: 180px; }
  .breath-track { fill: none; stroke: var(--line-strong); stroke-width: 3; }
  .breath-fill { fill: color-mix(in srgb, var(--q2) 18%, transparent); stroke: none; }
  .breath-dot { fill: var(--accent); }
  .breath-count { font-family: var(--head); font-weight: 800; font-size: 40px; fill: var(--ink); }
  .breath-side { stroke: var(--accent); stroke-width: 4; stroke-linecap: round; fill: none; opacity: 0; transition: opacity 0.2s; }
  .breath-side.on { opacity: 1; }
  .breath-body { flex: 1; }
  .breath-step {
    font-family: var(--head); font-weight: 800; font-size: 26px;
    color: var(--ink); line-height: 1.1; margin-bottom: 4px;
  }
  .breath-help { font-size: 14px; color: var(--ink-mid); margin-bottom: 14px; }
  .breath-cycles { font-size: 13px; color: var(--ink-muted); margin-top: 10px; }

  /* ─── TASK LISTS ────────────────────────────────────────────────── */
  .task-list { display: flex; flex-direction: column; gap: 8px; }
  .task-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px 10px 14px;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 9px;
  }
  .task-row.quick { border-left: 4px solid var(--quick); }
  .task-index { color: var(--ink-faint); font-size: 12px; min-width: 18px; text-align: right; }
  .task-row input.task-text {
    flex: 1; font-size: 15px; color: var(--ink); line-height: 1.4;
    background: transparent; border: none; outline: none; box-shadow: none;
    padding: 2px 0; border-radius: 0;
    font-family: var(--sans); min-width: 0;
  }
  .empty {
    text-align: center; color: var(--ink-muted);
    font-size: 15px; padding: 32px 0;
    border: 1.5px dashed var(--line-strong); border-radius: 11px;
  }
  .empty.small { padding: 16px; font-size: 14px; }

  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.02em;
    padding: 2px 8px; border-radius: 99px;
    background: color-mix(in srgb, var(--c, var(--ink-muted)) 14%, transparent);
    color: var(--c, var(--ink-muted));
    white-space: nowrap;
  }

  /* ─── SORT MATRIX ───────────────────────────────────────────────── */
  .unassigned-wrap { margin-bottom: 22px; }
  .chip-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 7px 12px;
    background: var(--surface);
    border: 1.5px dashed var(--ink-faint);
    border-radius: 8px;
    font-size: 14px; color: var(--ink);
    cursor: grab; user-select: none;
    transition: border-color 0.15s, transform 0.05s, box-shadow 0.15s;
  }
  .chip:hover { border-color: var(--accent); }
  .chip:active { cursor: grabbing; transform: scale(0.98); }
  .chip.picked, .q-task.picked { border: 1.5px solid var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .matrix { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .quadrant {
    --c: var(--ink-muted);
    min-height: 150px;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-top: 4px solid var(--c);
    border-radius: 11px;
    padding: 14px;
    transition: background 0.15s, box-shadow 0.15s;
  }
  .quadrant.drag-over, .quadrant.target { background: color-mix(in srgb, var(--c) 7%, var(--surface)); }
  .quadrant.target { cursor: pointer; box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 40%, transparent); }
  .quadrant.q1 { --c: var(--q1); }
  .quadrant.q2 { --c: var(--q2); }
  .quadrant.quick { --c: var(--quick); }
  .quadrant.q4 { --c: var(--q4); }
  .q-label { font-family: var(--head); font-size: 16px; font-weight: 800; color: var(--c); }
  .q-sub { font-size: 12px; color: var(--ink-muted); margin-bottom: 10px; }
  .q-tasks { display: flex; flex-direction: column; gap: 6px; }
  .q-task {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    padding: 6px 8px; border-radius: 7px; font-size: 13px;
    color: var(--ink); cursor: grab;
    border: 1.5px solid transparent;
    background: color-mix(in srgb, var(--c) 9%, var(--surface));
  }
  .q-task:active { cursor: grabbing; }
  .q-task-text { flex: 1; line-height: 1.3; }
  .q-empty { font-size: 12px; color: var(--ink-faint); font-style: italic; }

  .key-question {
    margin-top: 20px; padding: 16px 20px;
    background: var(--steel-soft);
    border-radius: 11px;
    border-left: 4px solid var(--steel);
  }
  .key-question-label {
    font-size: 12px; font-weight: 700; color: var(--steel);
    text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 4px;
  }
  .key-question-text { font-size: 15px; color: var(--ink); line-height: 1.5; }

  /* ─── SCHEDULE ──────────────────────────────────────────────────── */
  .rules {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .rule {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 11px 13px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 9px;
    font-size: 13.5px; color: var(--ink-mid); line-height: 1.45;
  }
  .rule strong { color: var(--ink); font-weight: 700; }
  .rule-num {
    flex-shrink: 0; width: 20px; height: 20px; border-radius: 6px;
    background: var(--accent-soft); color: var(--accent-ink);
    font-size: 11px; font-weight: 800;
    display: inline-flex; align-items: center; justify-content: center;
    margin-top: 1px;
  }
  .schedule-task {
    padding: 13px 15px;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    margin-bottom: 8px;
  }
  .schedule-task-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .schedule-task-num { color: var(--ink-faint); font-size: 12px; min-width: 16px; text-align: right; }
  .schedule-task-text { flex: 1; font-size: 15px; color: var(--ink); }
  .schedule-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-left: 26px; }
  .gcal-btn { margin-left: auto; }

  /* ─── COMMUNICATE ───────────────────────────────────────────────── */
  .ref-list { display: flex; flex-direction: column; gap: 6px; }
  .ref-row {
    display: flex; justify-content: space-between; gap: 12px;
    font-size: 14px; padding: 8px 12px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  }
  .ref-when { color: var(--ink-muted); white-space: nowrap; font-size: 13px; }
  .row-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

  /* ─── PROGRESS ──────────────────────────────────────────────────── */
  .progress-wrap { margin-bottom: 24px; }
  .progress-meta {
    display: flex; justify-content: space-between; gap: 12px;
    font-size: 14px; color: var(--ink-mid); margin-bottom: 8px;
  }
  .progress-meta strong { color: var(--ink); font-weight: 700; white-space: nowrap; }
  .progress-track { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .progress-fill {
    height: 100%; border-radius: 99px;
    background: linear-gradient(90deg, var(--accent), var(--good));
    transition: width 0.5s ease;
  }

  /* ─── TRIAGE ────────────────────────────────────────────────────── */
  .focus-card {
    padding: 24px;
    background: var(--surface);
    border: 2px solid var(--accent);
    border-radius: 14px;
    box-shadow: var(--shadow);
  }
  .focus-label {
    font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 6px;
    display: flex; align-items: center; gap: 8px;
  }
  .focus-label::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.3; } }
  .focus-text {
    font-family: var(--head); font-size: 26px; font-weight: 800; line-height: 1.2;
    letter-spacing: -0.015em; color: var(--ink); margin-bottom: 8px;
    word-break: break-word;
  }
  .focus-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .focus-grid { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
  .focus-steps { flex: 1; min-width: 220px; }
  .focus-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; }

  .steps { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .step {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 8px;
    background: var(--surface-2); font-size: 14px;
  }
  .step.next { background: var(--accent-soft); font-weight: 600; }
  .step.done span.step-text { text-decoration: line-through; color: var(--ink-muted); }
  .step .check-circle { width: 20px; height: 20px; border-radius: 6px; cursor: pointer; }
  .step.done .check-circle { background: var(--good); border-color: var(--good); color: #fff; }
  .step-text { flex: 1; }
  .step-input { font-size: 14px !important; padding: 9px 12px !important; }

  .timer { width: 150px; text-align: center; }
  .timer svg { width: 120px; height: 120px; display: block; margin: 0 auto 6px; }
  .timer-track { fill: none; stroke: var(--line); stroke-width: 8; }
  .timer-ring {
    fill: none; stroke: var(--accent); stroke-width: 8; stroke-linecap: round;
    transform: rotate(-90deg); transform-origin: 60px 60px;
    transition: stroke-dashoffset 0.25s linear;
  }
  .timer-text { font-family: var(--head); font-weight: 800; font-size: 24px; fill: var(--ink); }
  .timer-presets { display: flex; gap: 4px; justify-content: center; margin-bottom: 6px; }
  .timer-presets button {
    border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-mid);
    font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; cursor: pointer;
  }
  .timer-presets button.active { background: var(--steel); color: var(--bg); border-color: var(--steel); }
  .timer-controls { display: flex; gap: 4px; justify-content: center; }

  .stuck-row {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    margin-top: 14px; font-size: 13px; color: var(--ink-muted);
  }

  .up-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px 9px 12px;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 9px;
  }
  .up-row .check-circle { cursor: pointer; width: 22px; height: 22px; border-radius: 6px; }
  .up-row .check-circle:hover { border-color: var(--good); }
  .up-row.done .check-circle { background: var(--good); border-color: var(--good); color: #fff; }
  .up-row.done .up-text { text-decoration: line-through; color: var(--ink-muted); }
  .up-num { font-size: 12px; color: var(--ink-faint); min-width: 16px; text-align: right; }
  .up-text { flex: 1; font-size: 14.5px; min-width: 0; word-break: break-word; }
  .up-tools { display: flex; gap: 2px; }

  .all-done {
    text-align: center; padding: 36px 20px;
    background: var(--good-soft); border-radius: 14px;
  }
  .all-done-title { font-family: var(--head); font-size: 28px; font-weight: 800; color: var(--good); }
  .all-done-sub { color: var(--ink-mid); margin-top: 4px; }

  .note-line {
    margin-top: 18px; font-size: 13px; color: var(--ink-muted); text-align: center;
  }

  /* ─── CONFETTI ──────────────────────────────────────────────────── */
  .confetti {
    position: fixed; width: 8px; height: 8px; border-radius: 2px;
    pointer-events: none; z-index: 300;
    animation: confetti 0.9s cubic-bezier(.2,.7,.4,1) forwards;
  }
  @keyframes confetti {
    to { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); opacity: 0; }
  }

  /* ─── REFLECT ───────────────────────────────────────────────────── */
  .question-card {
    padding: 18px 20px;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 11px;
    margin-bottom: 12px;
  }
  .question-text { font-size: 15px; color: var(--ink); margin-bottom: 12px; line-height: 1.5; font-weight: 600; }
  .rating-row { display: flex; gap: 8px; }
  .rating-btn {
    flex: 1; padding: 8px 10px;
    background: var(--surface-2); color: var(--ink-mid);
    border: 1.5px solid var(--line);
    border-radius: 8px; cursor: pointer;
    font-size: 13px; font-weight: 600;
    transition: all 0.15s ease;
  }
  .rating-btn:hover { border-color: var(--line-strong); }
  .rating-btn.active { background: var(--steel); color: var(--bg); border-color: var(--steel); }
  .stats-banner {
    margin-top: 20px; padding: 18px 20px;
    background: var(--surface); border: 1.5px solid var(--line);
    border-radius: 11px;
    display: flex; gap: 24px; justify-content: space-around;
  }
  .stat { text-align: center; }
  .stat-value { font-family: var(--head); font-size: 30px; font-weight: 800; color: var(--ink); line-height: 1; }
  .stat-label { font-size: 11px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 6px; }

  .save-card {
    margin-top: 20px; padding: 20px 22px;
    background: var(--steel-soft);
    border-radius: 11px;
    display: flex; align-items: center; gap: 16px;
  }
  .save-card-body { flex: 1; }
  .save-card-title { font-family: var(--head); font-size: 18px; font-weight: 800; color: var(--ink); margin-bottom: 2px; }
  .save-card-sub { font-size: 13px; color: var(--ink-mid); line-height: 1.4; }
  .save-card .btn { flex-shrink: 0; }

  /* ─── BLOCKED TIME + BUCKETS ────────────────────────────────────── */
  .block-list { display: flex; flex-direction: column; gap: 8px; }
  .block-row {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 12px;
    background: var(--surface);
    border: 1.5px solid var(--line); border-left: 4px solid var(--ink-faint);
    border-radius: 9px;
  }
  .block-row.busy { background: repeating-linear-gradient(135deg, var(--surface) 0 8px, var(--surface-2) 8px 16px); }
  .block-row.bucket { border-left-color: var(--bucket); }
  .block-main { flex: 1; min-width: 180px; }
  .block-name { font-size: 14.5px; font-weight: 700; color: var(--ink); }
  .block-when { font-size: 13px; color: var(--ink-muted); }
  .fill-meter { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-mid); margin-top: 4px; }
  .fill-track { width: 70px; height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .fill-track div { height: 100%; background: var(--bucket); border-radius: 99px; }
  .block-form {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    margin-top: 10px; padding: 12px;
    border: 1.5px dashed var(--line-strong); border-radius: 9px;
  }
  .block-form .seg { margin: 0; }
  .block-form input[type="text"] { width: auto; flex: 1; min-width: 140px; padding: 7px 10px; font-size: 13px; }
  .check-line { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-mid); cursor: pointer; }
  .check-line input { accent-color: var(--accent); width: 15px; height: 15px; }
  .clash { font-size: 12.5px; color: var(--ink-mid); padding: 8px 0 0 26px; }
  .clash strong { color: var(--ink); }
  .badge.bucket-tag { --c: var(--bucket); }
  .badge.lock { --c: var(--ink-muted); }
  input[type="text"].tags-input { width: auto; flex: 1; min-width: 160px; padding: 7px 10px; font-size: 13px; }

  /* ─── GENTLE COUNTDOWNS ─────────────────────────────────────────── */
  .badge.calm  { --c: var(--steel); }
  .badge.soon  { --c: var(--amber); }
  .badge.near  { --c: var(--accent); }
  .badge.past  { --c: var(--ink-muted); }
  .now-strip {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-bottom: 14px; padding: 10px 14px;
    background: var(--surface); border: 1.5px solid var(--line); border-left: 4px solid var(--c, var(--bucket));
    border-radius: 9px; font-size: 14px; color: var(--ink-mid);
  }
  .now-strip strong { color: var(--ink); }
  .time-passed {
    margin-top: 16px; padding: 14px 16px;
    background: var(--surface-2); border-radius: 10px;
  }
  .time-passed-title { font-weight: 700; color: var(--ink); margin-bottom: 2px; }
  .time-passed .hint { margin-bottom: 10px; }

  /* ─── HOME: MY TO-DOS ───────────────────────────────────────────── */
  .brand { cursor: pointer; }
  .home-input input[type="text"] { font-size: 17px; padding: 15px 17px; }
  .home-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .home-bar .seg { margin: 0; }
  .home-list { display: flex; flex-direction: column; gap: 8px; }
  .home-row {
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-left: 4px solid var(--c, var(--line));
    border-radius: 10px;
  }
  .home-row.open { box-shadow: var(--shadow); }
  .home-row-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 11px 12px; }
  .home-row-top .check-circle { cursor: pointer; width: 22px; height: 22px; border-radius: 6px; }
  .home-row-top .check-circle:hover { border-color: var(--good); }
  .home-row-top .up-text { min-width: 140px; }
  .home-editor {
    display: flex; flex-direction: column; gap: 12px;
    padding: 4px 14px 14px 44px;
  }
  .home-editor .seg { margin: 0; flex-wrap: wrap; }
  .home-editor .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .session-card {
    margin-top: 28px; padding: 18px 20px;
    background: var(--steel-soft); border-radius: 11px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .session-card-body { flex: 1; min-width: 200px; }
  .session-card-title { font-family: var(--head); font-size: 18px; font-weight: 800; color: var(--ink); }
  .session-card-sub { font-size: 13px; color: var(--ink-mid); }

  /* ─── TO-DO JAR ─────────────────────────────────────────────────── */
  .jar {
    position: relative;
    height: clamp(380px, 68vh, 720px);
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow);
    user-select: none; -webkit-user-select: none;
  }
  .jar canvas { display: block; width: 100%; height: 100%; }
  .jar-tip {
    position: absolute; z-index: 5; pointer-events: none; opacity: 0;
    max-width: 250px; padding: 8px 10px; border-radius: 8px;
    background: var(--ink); color: var(--bg); font-size: 12.5px; line-height: 1.4;
    transition: opacity 0.12s ease;
  }
  .jar-tip strong { display: block; font-size: 13.5px; }
  .jar-tip .tip-due { font-weight: 700; font-variant-numeric: tabular-nums; margin: 2px 0; }
  .jar-tip .tip-dim { opacity: 0.7; }
  .jar-menu {
    position: absolute; z-index: 6; display: none; min-width: 160px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.18); padding: 5px;
  }
  .jar-menu.open { display: block; }
  .jar-menu button {
    display: block; width: 100%; text-align: left; padding: 8px 10px;
    border: none; background: transparent; border-radius: 7px;
    font-size: 14px; font-weight: 600; color: var(--ink); cursor: pointer;
  }
  .jar-menu button:hover, .jar-menu button:focus-visible { background: var(--surface-2); outline: none; }
  .jar-menu button.danger { color: var(--q1); }
  .jar-editor { margin-top: 12px; }
  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: -2px 0 12px; }
  .tag-chip {
    padding: 4px 10px; border-radius: 99px; cursor: pointer;
    border: 1.5px solid var(--line); background: var(--surface);
    font-size: 12.5px; font-weight: 700; color: var(--ink-mid);
  }
  .tag-chip.active { background: var(--bucket); border-color: var(--bucket); color: #fff; }
  .link-hint { margin: -4px 0 10px; color: var(--accent-ink); font-weight: 600; }
  .home-row.blocked .up-text { color: var(--ink-muted); }
  .badge-x { border: none; background: none; color: inherit; cursor: pointer; padding: 0 0 0 2px; display: inline-flex; vertical-align: middle; }
  .badge-x svg { width: 11px; height: 11px; }

  /* ─── EDITOR: DUE, DETAILS, SUB-BUBBLES, HISTORY ────────────────── */
  .due-grid { display: flex; gap: 18px; flex-wrap: wrap; }
  .due-line { margin-top: -4px; }
  .details-box { min-height: 90px; font-size: 14px; }
  .mini-label { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); }
  .subs { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .sub-row { background: var(--surface-2); border-radius: 9px; padding: 7px 9px; }
  .sub-top { display: flex; align-items: center; gap: 8px; }
  .sub-top .check-circle { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; }
  .sub-row.done .check-circle { background: var(--good); border-color: var(--good); color: #fff; }
  .sub-row.done .sub-text { text-decoration: line-through; color: var(--ink-muted); }
  .sub-row.locked { opacity: 0.6; }
  .sub-row.next { box-shadow: inset 3px 0 0 var(--accent); }
  .sub-num { min-width: 20px; text-align: center; font-size: 12px; font-weight: 800; color: var(--ink-muted); }
  .sub-row.next .sub-num { color: var(--accent); }
  .icon-btn:disabled { opacity: 0.3; cursor: default; }
  .seg.imp-scale button { min-width: 36px; justify-content: center; }
  .seg.imp-scale button.active { background: var(--c); color: #fff; }
  .seg.imp-scale button.not-set.active { background: var(--steel); color: var(--bg); }
  input[type="text"].sub-text { flex: 1; min-width: 0; border: none; background: transparent; padding: 3px 0; font-size: 14px; box-shadow: none; }
  .sub-more { display: flex; flex-direction: column; gap: 8px; padding: 8px 0 2px 28px; }
  .sub-details { min-height: 60px; font-size: 13px; }
  .history summary { cursor: pointer; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); }
  .history-list { list-style: none; margin-top: 8px; display: flex; flex-direction: column; gap: 4px; max-height: 220px; overflow: auto; }
  .history-list li { display: flex; gap: 10px; font-size: 13px; color: var(--ink-mid); }
  .history-when { flex: 0 0 120px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }

  /* ─── GARDEN ───────────────────────────────────────────────────── */
  .garden-jar { height: clamp(400px, 64vh, 680px); }
  .garden-stats { flex-wrap: wrap; }
  .day-bars { display: grid; grid-template-columns: repeat(14, 1fr); gap: 6px; height: 120px; align-items: end; }
  .day-bar { height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; font-size: 11px; color: var(--ink-muted); }
  .day-bar-fill { width: 100%; min-height: 3px; background: var(--good); border-radius: 5px 5px 2px 2px; opacity: 0.8; }
  .tree-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag-bar { display: grid; grid-template-columns: 110px 1fr 30px; gap: 10px; align-items: center; font-size: 13px; margin-bottom: 6px; }
  .tag-bar .fill-track div { background: var(--bucket); }
  .slice-row { background: var(--surface); border: 1.5px solid var(--line); border-radius: 9px; padding: 9px 12px; }
  .slice-row summary { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; cursor: pointer; }
  .slice-more { padding: 10px 0 2px; font-size: 14px; color: var(--ink-mid); display: flex; flex-direction: column; gap: 8px; }
  .garden-link {
    width: 100%; margin-top: 18px; display: flex; align-items: center; gap: 14px; text-align: left;
    padding: 14px 18px; border-radius: 11px; cursor: pointer;
    background: var(--good-soft); border: 1.5px solid color-mix(in srgb, var(--good) 30%, transparent); color: var(--ink);
  }
  .garden-link strong { font-family: var(--head); font-size: 17px; }
  .garden-link > span:nth-child(2) { flex: 1; }
  .garden-link-icon { font-size: 26px; }

  /* ─── TIP CALLOUT ───────────────────────────────────────────────── */
  .tip {
    margin-top: 28px; padding: 14px 18px;
    background: var(--accent-soft);
    border-radius: 10px;
    border-left: 4px solid var(--accent);
    font-size: 14px; color: var(--accent-ink);
    line-height: 1.6;
  }

  /* ─── NAV ───────────────────────────────────────────────────────── */
  .nav {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 44px; padding-top: 22px;
    border-top: 1px solid var(--line);
  }
  .nav-back-hidden { visibility: hidden; }

  /* ─── QUOTE ─────────────────────────────────────────────────────── */
  .quote {
    margin-top: 32px; text-align: center;
    color: var(--ink-muted); font-size: 13px;
    font-style: italic; line-height: 1.7;
  }
  .quote-attr {
    margin-top: 6px; font-style: normal; font-weight: 700;
    font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
  }

  /* ─── TOAST ─────────────────────────────────────────────────────── */
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--bg);
    padding: 12px 20px; border-radius: 10px;
    font-size: 14px; font-weight: 600;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 200; max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: #a32020; color: #fff; }

  /* ─── PHASE TRANSITIONS ─────────────────────────────────────────── */
  .phase-content.enter { animation: fadeIn 0.3s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .phase-content.enter, .focus-label::before { animation: none; }
  }

  @media (max-width: 600px) {
    .topbar { padding: 12px 16px; }
    .brand-name { display: none; }
    .topbar-right { gap: 10px; }
    main { padding: 28px 16px 60px; }
    .phase-title { font-size: 30px; }
    .matrix, .rules { grid-template-columns: 1fr; }
    .stats-banner { gap: 12px; }
    .save-card { flex-direction: column; align-items: flex-start; }
    .breath { flex-direction: column; text-align: center; gap: 16px; }
    .schedule-controls { padding-left: 0; }
    .gcal-btn { margin-left: 0; }
    .clash { padding-left: 0; }
    .home-editor { padding-left: 14px; }
    .jar { height: clamp(360px, 62vh, 560px); }
    .focus-card { padding: 18px; }
    .focus-text { font-size: 22px; }
    .timer { width: 100%; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand" id="brand" role="button" tabindex="0" title="My to-dos">
    <span class="brand-mark">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14 12L5 21"/>
        <path d="M5.5 4.5l4 4"/>
        <path d="M10 5c1-1 6-2 8 0s1 7 0 8-6 2-8 0"/>
        <path d="M7 7c-1 1-2 6 0 8"/>
      </svg>
    </span>
    <span class="brand-name">Sharp Axe Method</span>
  </div>
  <div class="topbar-right">
    <div class="pips" id="pips" aria-label="Progress"></div>
    <div class="menu-wrap">
      <button class="menu-btn" id="menuBtn" aria-label="Menu" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
          <circle cx="5" cy="12" r="1.7"/>
          <circle cx="12" cy="12" r="1.7"/>
          <circle cx="19" cy="12" r="1.7"/>
        </svg>
      </button>
      <div class="menu-dropdown" id="menuDropdown" role="menu">
        <button class="menu-item" id="miImport" role="menuitem">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17,8 12,3 7,8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <span>
            Import Todos
            <span class="menu-item-sub">Load tasks from a .json file</span>
          </span>
        </button>
        <button class="menu-item" id="miExport" role="menuitem">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7,10 12,15 17,10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span>
            Export Todos
            <span class="menu-item-sub">Save tasks as .json</span>
          </span>
        </button>
        <div class="menu-divider"></div>
        <button class="menu-item" id="miSaveAll" role="menuitem">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
            <polyline points="17,21 17,13 7,13 7,21"/>
            <polyline points="7,3 7,8 15,8"/>
          </svg>
          <span>
            Save Full Session
            <span class="menu-item-sub">Download everything as .txt</span>
          </span>
        </button>
        <div class="menu-divider"></div>
        <button class="menu-item" id="miGarden" role="menuitem">
          <span style="width:18px;text-align:center">🌱</span>
          <span>
            Garden
            <span class="menu-item-sub">Your sliced to-dos and progress</span>
          </span>
        </button>
        <div class="menu-divider"></div>
        <button class="menu-item" id="miDrive" role="menuitem">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3h8l6 10-4 7H6l-4-7z"/>
            <path d="M8 3l6 10h8"/>
            <path d="M2 13h12l-4 7"/>
          </svg>
          <span>
            <span id="driveTitle">Google Drive</span>
            <span class="menu-item-sub" id="driveSub">Save your data to Drive</span>

  return `${b.weekly ? `Every ${r[0].toLocaleDateString(undefined, { weekday: "long" })} · next ${day}` : day} · ${b.start}–${b.end}`;
}
const sameBucket = (a, b) => a && b && a.toLowerCase() === b.toLowerCase();
const hasTag = (t, name) => (t.tags || []).some(x => sameBucket(x, name));
// Every tag in use: bucket block names first, then task tags.
function tagNames() {
  const names = new Map();
  state.blocks.filter(b => b.kind === "bucket" && b.name).forEach(b => names.set(b.name.toLowerCase(), b.name));
  state.tasks.forEach(t => (t.tags || []).forEach(x => { if (!names.has(x.toLowerCase())) names.set(x.toLowerCase(), x); }));
  return [...names.values()];
}
const tagBadges = (t) => (t.tags || []).map(x => el("span", { class: "badge bucket-tag", text: `#${x}` }));

/* ─── LINKS: "must finish first" ────────────────────────────── */
const taskById = (id) => state.tasks.find(t => t.id === id);
const waitingOn = (t) => (t.after || []).map(taskById).filter(p => p && !p.done);
const isBlocked = (t) => waitingOn(t).length > 0;
function blockedBadge(t) {
  const w = waitingOn(t);
  return w.length ? el("span", { class: "badge lock", title: `Finish first: ${w.map(p => p.text).join(", ")}`, text: `🔒 after ${w[0].text}${w.length > 1 ? ` +${w.length - 1}` : ""}` }) : null;
}
// Would "b waits for a" make a loop? (a already waits for b, directly or not.)
function dependsOn(a, b, seen = new Set()) {
  if (a.id === b.id) return true;
  if (seen.has(a.id)) return false;
  seen.add(a.id);
  return (a.after || []).some(id => { const p = taskById(id); return p && dependsOn(p, b, seen); });
}
// "first" must be finished before "then".
function addLink(first, then) {
  if (!first || !then || first.id === then.id) return false;
  if ((then.after || []).includes(first.id)) { toast("Those are already linked"); return false; }
  if (dependsOn(first, then)) { toast(`That would make a loop: “${first.text}” already waits for “${then.text}”.`, "error"); return false; }
  then.after = [...(then.after || []), first.id];
  logEvent(then, "linked", `waits for ${first.text}`);
  saveState();
  toast(`“${then.text}” now waits for “${first.text}”.`);
  return true;
}
function removeLink(first, then) {
  then.after = (then.after || []).filter(id => id !== first.id);
  saveState();
}
function deleteTask(t) {
  state.tasks = state.tasks.filter(x => x.id !== t.id);
  state.tasks.forEach(x => { if (x.after?.includes(t.id)) x.after = x.after.filter(id => id !== t.id); });
}
// Tasks that sit inside one occurrence of a block.
function tasksIn(range) {
  return state.tasks.filter(t => {
    const s = taskStart(t);
    return s && !t.done && t.quadrant !== "q4" && s >= range[0] && s < range[1];
  });
}
// A blocked-off time that a task's slot runs into, if any.
function clashFor(task) {
  const s = taskStart(task), e = taskEnd(task);
  if (!s) return null;
  for (const b of state.blocks) {
    if (b.kind !== "busy") continue;
    for (const d of [isoOf(addDays(s, -1)), isoOf(s)]) {
      if (!blockOccursOn(b, d)) continue;
      const [bs, be] = blockRange(b, d);
      if (s < be && e > bs) return b;
    }
  }
  return null;
}

// Put tasks from this bucket into the next free gaps of the block.
function fillBucket(b) {
  const range = nextOccurrence(b);
  if (!range) { toast("This block is already over", "error"); return; }
  const now = new Date();
  const taken = [];
  state.tasks.forEach(t => {
    const s = taskStart(t);
    if (s && !t.done) taken.push([s, taskEnd(t)]);
  });
  state.blocks.filter(x => x.kind === "busy").forEach(x => {
    for (const d of [isoOf(addDays(range[0], -1)), isoOf(range[0])]) if (blockOccursOn(x, d)) taken.push(blockRange(x, d));
  });
  taken.sort((p, q) => p[0] - q[0]);
  const step = 15 * 60000;
  const startFrom = new Date(Math.max(range[0], Math.ceil(now / step) * step));
  const todo = schedulableTasks().filter(t => !t.done && !t.scheduledTime && hasTag(t, b.name));
  if (!todo.length) { toast(`No unplanned ${b.name} tasks. Tag a task with #${b.name.toLowerCase().replace(/\s+/g, "")} first.`, "error"); return; }
  let placed = 0;
  for (const t of todo) {
    const len = (t.duration || 30) * 60000;
    let cur = startFrom;
    for (const [ts, te] of taken) {
      if (te <= cur) continue;
      if (ts - cur >= len) break;
      if (te > cur) cur = te;
    }
    if (range[1] - cur < len) continue;
    t.date = isoOf(cur); t.scheduledTime = hm(cur);
    taken.push([cur, new Date(cur.getTime() + len)]);
    taken.sort((p, q) => p[0] - q[0]);
    placed++;
  }
  saveState(); render();
  const left = todo.length - placed;
  toast(placed
    ? `Put ${plural(placed, "task")} in ${b.name} time.${left ? ` ${left} did not fit. That's okay.` : ""}`
    : "Nothing fit in this block. Try a shorter length or a longer block.");
}

/* ─── GENTLE COUNTDOWNS ─────────────────────────────────────── */
// Calm colours that warm up as a time gets close. Never an alarm.
function softTime(task, now = Date.now()) {
  const s = taskStart(task);
  if (!s) return null;
  const until = s - now;
  if (until > 0) {
    const cls = until <= 15 * 60000 ? "near" : until <= 60 * 60000 ? "soon" : "calm";
    const txt = until < 60000 ? "Starts now" : until > 36 * 3600000 ? `Starts ${whenText(task)}` : `Starts in ${minutesText(until / 60000)}`;
    return { cls, txt, passed: false };
  }
  if (taskEnd(task) > now) return { cls: "near", txt: `Happening now · ${minutesText((taskEnd(task) - now) / 60000)} left`, passed: false };
  return { cls: "past", txt: "Time passed", passed: true };
}
function timeBadge(task) {
  const t = softTime(task);
  return t ? el("span", { class: `badge ${t.cls}`, "data-countdown": String(task.id), text: t.txt }) : null;
}
function updateCountdowns() {
  document.querySelectorAll("[data-countdown]").forEach(n => {
    const task = state.tasks.find(t => String(t.id) === n.dataset.countdown);
    const t = task && softTime(task);
    if (!t) return;
    n.textContent = t.txt;
    n.className = `badge ${t.cls}`;
  });
  document.querySelectorAll("[data-due]").forEach(n => {
    const task = state.tasks.find(t => String(t.id) === n.dataset.due);
    const i = task && dueInfo(task);
    if (!i) return;
    n.textContent = n.dataset.long ? i.long : i.short;
    n.className = `badge ${i.cls}`;
  });
  document.querySelectorAll("[data-left]").forEach(n => {
    n.textContent = minutesText((Number(n.dataset.left) - Date.now()) / 60000);
  });
}

let _toastTimer = null;

/* ─── CONFETTI ──────────────────────────────────────────────── */
function celebrate(fromEl) {
  if (reduceMotion()) return;
  const r = fromEl?.getBoundingClientRect?.() || { left: innerWidth / 2, top: innerHeight / 2, width: 0, height: 0 };
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const colors = ["#e2550f", "#2b8a3e", "#1c7ed6", "#7048e8", "#f59f00", "#e03131"];
  for (let i = 0; i < 22; i++) {
    const a = Math.random() * Math.PI * 2;
    const dist = 60 + Math.random() * 90;
    const p = el("span", { class: "confetti" });
    p.style.left = cx + "px";
    p.style.top = cy + "px";
    p.style.background = colors[i % colors.length];
    p.style.setProperty("--dx", Math.cos(a) * dist + "px");
    p.style.setProperty("--dy", Math.sin(a) * dist - 40 + "px");
    p.style.setProperty("--r", (Math.random() * 540 - 270) + "deg");
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 950);
  }
}

/* ─── SHARED: ADD-TASK INPUT ────────────────────────────────── */
function addTask(text, quadrant = null) {
  let clean = String(text || "").trim();
  // Every "#tag" becomes a tag (it matches an existing tag name if there is one).
  const tags = [];
  clean = clean.replace(/(^|\s)#([\p{L}\p{N}_-]+)/gu, (m, sp, tag) => {
    tags.push(tagNames().find(n => n.toLowerCase().replace(/\s+/g, "") === tag.toLowerCase())
          || tag.charAt(0).toUpperCase() + tag.slice(1));
    return " ";
  }).replace(/\s+/g, " ").trim();
  // "!6" sets importance (1–7).
  let importance = null;
  clean = clean.replace(/(^|\s)!([1-7])(?=\s|$)/, (m, sp, n) => { importance = Number(n); return " "; }).replace(/\s+/g, " ").trim();
  if (!clean) return null;
  const task = normalizeTask({ text: clean, quadrant, tags, importance });
  logEvent(task, "created", tags.length ? tags.map(x => `#${x}`).join(" ") : "");
  state.tasks.push(task);
  return task;
}

/* ─── BOX BREATHING ─────────────────────────────────────────── */
// Runs on its own clock and finds its elements by id each frame, so a
// re-render (for example ticking a checklist card) does not stop it.
const BREATH_SIDE_MS = 4000;
const BREATH_STEPS = [
  { name: "Breathe in",  help: "Slowly through your nose." },
  { name: "Hold",        help: "Keep the air in. Stay relaxed." },
  { name: "Breathe out", help: "Slowly through your mouth." },
  { name: "Hold",        help: "Stay empty. Stay relaxed." },
];
const breath = { running: false, start: 0, raf: 0 };
// Square corners: bottom-left, top-left, top-right, bottom-right.
const BOX = { x0: 20, y0: 20, x1: 160, y1: 160 };
const BOX_CORNERS = [[BOX.x0, BOX.y1], [BOX.x0, BOX.y0], [BOX.x1, BOX.y0], [BOX.x1, BOX.y1]];

function breathingPanel() {
  const sides = BOX_CORNERS.map((c, i) => {
    const n = BOX_CORNERS[(i + 1) % 4];
    return `<line id="breathSide${i}" class="breath-side" x1="${c[0]}" y1="${c[1]}" x2="${n[0]}" y2="${n[1]}"/>`;
  }).join("");
  const svg = `<svg viewBox="0 0 180 180" aria-hidden="true">
    <rect id="breathFill" class="breath-fill" x="20" y="20" width="140" height="140" rx="6"/>
    <rect class="breath-track" x="20" y="20" width="140" height="140" rx="6"/>
    ${sides}
    <text id="breathCount" class="breath-count" x="90" y="104" text-anchor="middle"></text>
    <circle id="breathDot" class="breath-dot" cx="20" cy="160" r="9"/>
  </svg>`;
  const panel = el("div", { class: "extra-panel" }, [
    el("div", { class: "breath" }, [
      el("div", { html: svg }),
      el("div", { class: "breath-body" }, [
        el("div", { class: "breath-step", id: "breathStep", text: "Ready?" }),
        el("div", { class: "breath-help", id: "breathHelp", text: "Follow the dot around the square. 4 seconds per side." }),
        el("button", {
          class: `btn ${breath.running ? "" : "btn-dark"}`,
          id: "breathBtn",
          type: "button",
          text: breath.running ? "Stop" : "Start breathing",
          onclick: () => breath.running ? stopBreathing() : startBreathing(),
        }),
        el("div", { class: "breath-cycles", id: "breathCycles", text: "" }),
      ]),
    ]),
  ]);
  if (breath.running) requestAnimationFrame(breathFrame);
  else setTimeout(drawBreathIdle, 0);
  return panel;
}

function startBreathing() {
  breath.running = true;
  breath.start = performance.now();
  const btn = $("#breathBtn");
  if (btn) { btn.textContent = "Stop"; btn.classList.remove("btn-dark"); }
  cancelAnimationFrame(breath.raf);
  breath.raf = requestAnimationFrame(breathFrame);
}

function stopBreathing() {
  const rounds = Math.floor((performance.now() - breath.start) / (BREATH_SIDE_MS * 4));
  breath.running = false;
  cancelAnimationFrame(breath.raf);
  const btn = $("#breathBtn");
  if (btn) { btn.textContent = "Start breathing"; btn.classList.add("btn-dark"); }
  drawBreathIdle();
  if (rounds >= 3) {
    const items = state.checklistItems.mental;
    if (items && !items[0]) { items[0] = true; saveState(); render(); toast(`Nice. ${plural(rounds, "round")} of box breathing.`); }
  }
}

function drawBreathIdle() {
  const dot = $("#breathDot"), fill = $("#breathFill");
  if (!dot) return;
  dot.setAttribute("cx", BOX.x0); dot.setAttribute("cy", BOX.y1);
  setBreathFill(fill, 0.35);
  $("#breathCount").textContent = "";
  for (let i = 0; i < 4; i++) $(`#breathSide${i}`)?.classList.remove("on");
  $("#breathStep").textContent = "Ready?";
  $("#breathHelp").textContent = "Follow the dot around the square. 4 seconds per side.";
  $("#breathCycles").textContent = "";
}

function setBreathFill(fill, scale) {
  if (!fill) return;
  const size = 140 * scale;
  const off = 20 + (140 - size) / 2;
  fill.setAttribute("x", off); fill.setAttribute("y", off);
  fill.setAttribute("width", size); fill.setAttribute("height", size);
}

function breathFrame(now) {
  if (!breath.running) return;
  breath.raf = requestAnimationFrame(breathFrame);
  const dot = $("#breathDot");
  if (!dot) return; // left the phase; keep the clock going
  const elapsed = now - breath.start;
  const side = Math.floor(elapsed / BREATH_SIDE_MS) % 4;
  const t = (elapsed % BREATH_SIDE_MS) / BREATH_SIDE_MS;
  const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const a = BOX_CORNERS[side], b = BOX_CORNERS[(side + 1) % 4];
  dot.setAttribute("cx", a[0] + (b[0] - a[0]) * t);
  dot.setAttribute("cy", a[1] + (b[1] - a[1]) * t);
  const MIN = 0.35;
  const scale = side === 0 ? MIN + (1 - MIN) * ease
              : side === 1 ? 1
              : side === 2 ? 1 - (1 - MIN) * ease
              : MIN;
  setBreathFill($("#breathFill"), scale);
  for (let i = 0; i < 4; i++) $(`#breathSide${i}`)?.classList.toggle("on", i === side);
  $("#breathCount").textContent = String(4 - Math.floor(t * 4));
  $("#breathStep").textContent = BREATH_STEPS[side].name;
  $("#breathHelp").textContent = BREATH_STEPS[side].help;
  const rounds = Math.floor(elapsed / (BREATH_SIDE_MS * 4));
  $("#breathCycles").textContent = rounds > 0 ? `${plural(rounds, "round")} done. 3 or 4 rounds is a good start.` : "Round 1";
}

  }
  setTimeout(() => { if (!document.activeElement || document.activeElement === document.body) $("#list-input")?.focus(); }, 0);
  return wrap;
}

/* ─── PHASE: SORT (MATRIX) ──────────────────────────────────── */
let _dragId = null;
let _pickId = null; // tap a task, then tap a box (works on touch screens)

function assignTask(id, quadrant) {
  const task = state.tasks.find(t => t.id === id);
  if (task) task.quadrant = quadrant;
  _pickId = null;
  saveState(); render();
}

function draggable(task, extra) {
  return {
    draggable: "true",
    ondragstart: (e) => { _dragId = task.id; e.dataTransfer?.setData("text/plain", String(task.id)); },
    ondragend: () => { _dragId = null; },
    onclick: (e) => {
      if (e.target.closest(".icon-btn")) return;
      e.stopPropagation();
      _pickId = _pickId === task.id ? null : task.id;
      render();
    },
    ...extra,
  };
}

function renderMatrix(p) {
  const wrap = el("div", {}, [phaseHeader(p)]);

  wrap.appendChild(taskInput("sort-input", "Thought of another to-do? Add it here...", (text) => addTask(text)));

  if (state.tasks.length === 0) {
    wrap.appendChild(el("div", { class: "empty", text: "No to-dos yet. Add one above, or go back a step." }));
    return wrap;
  }

  wrap.appendChild(el("div", { class: "hint", text: "Drag a task into a box. Or tap a task, then tap a box." }));

  const unassigned = state.tasks.filter(t => !t.quadrant);
  if (unassigned.length > 0) {
    const u = el("div", { class: "unassigned-wrap" }, [
      el("span", { class: "section-label", text: `Not sorted yet (${unassigned.length})` }),
    ]);
    const list = el("div", { class: "chip-list" });

      list.appendChild(el("div", draggable(task, {
        class: `chip ${_pickId === task.id ? "picked" : ""}`,
        text: task.text,
      })));
    });
    u.appendChild(list);
    wrap.appendChild(u);
  }

  const matrix = el("div", { class: "matrix" });
  QUADRANTS.forEach(q => {
    const qTasks = state.tasks.filter(t => t.quadrant === q.id);
    const quadrant = el("div", {
      class: `quadrant ${q.id} ${_pickId ? "target" : ""}`,
      ondragover: (e) => { e.preventDefault(); quadrant.classList.add("drag-over"); },
      ondragleave: () => quadrant.classList.remove("drag-over"),
      ondrop: (e) => {
        e.preventDefault();
        const id = Number(e.dataTransfer?.getData("text/plain") || _dragId);
        assignTask(id, q.id);
      },
      onclick: () => { if (_pickId) assignTask(_pickId, q.id); },
    }, [
      el("div", { class: "q-label", text: q.label }),
      el("div", { class: "q-sub",   text: q.sub }),
    ]);
    const tlist = el("div", { class: "q-tasks" });
    qTasks.forEach(task => {
      tlist.appendChild(el("div", draggable(task, {
        class: `q-task ${_pickId === task.id ? "picked" : ""}`,
      }), [
        el("span", { class: "q-task-text", text: task.text }),
        el("button", {
          class: "icon-btn",
          type: "button",
          "aria-label": "Take out of this box",
          title: "Take out of this box",
          html: SVG.x,
          onclick: (e) => { e.stopPropagation(); assignTask(task.id, null); },
        }),
      ]));
    });
    if (qTasks.length === 0) tlist.appendChild(el("div", { class: "q-empty", text: "Drop tasks here" }));
    quadrant.appendChild(tlist);
    matrix.appendChild(quadrant);
  });
  wrap.appendChild(matrix);

  wrap.appendChild(el("div", { class: "key-question" }, [
    el("div", { class: "key-question-label", text: "Key question" }),
    el("div", { class: "key-question-text",
      html: `What <em>one thing</em>, if done, would make everything else on this list easier or not needed?` }),
  ]));

  return wrap;
}

/* ─── PRIORITY ORDER ────────────────────────────────────────── */
const PRIORITY_RANK = { q1: 0, quick: 1, q2: 2 };
function priorityCompare(a, b) {
  const ra = PRIORITY_RANK[a.quadrant] ?? 3, rb = PRIORITY_RANK[b.quadrant] ?? 3;
  if (ra !== rb) return ra - rb;
  const wa = (a.date || "9999") + (a.scheduledTime || "99:99");
  const wb = (b.date || "9999") + (b.scheduledTime || "99:99");
  if (wa !== wb) return wa < wb ? -1 : 1;
  return state.tasks.indexOf(a) - state.tasks.indexOf(b);
}

// Tasks you schedule: everything except "Eliminate" and the under-3-minute ones.
function schedulableTasks() {
  return state.tasks.filter(t => t.quadrant !== "q4" && t.quadrant !== "quick").slice().sort(priorityCompare);
}

/* ─── PHASE: SCHEDULE ───────────────────────────────────────── */
function gcalUrl(task) {
  const date = task.date || todayISO();
  const compact = s => s.replace(/[-:]/g, "");
  let dates;
  if (task.scheduledTime) {
    const start = new Date(`${date}T${task.scheduledTime}`);
    const end = new Date(start.getTime() + (task.duration || 30) * 60000);
    const fmt = d => {
      const pad = n => String(n).padStart(2, "0");
      return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
    };
    dates = `${fmt(start)}/${fmt(end)}`;
  } else {
    const next = new Date(date + "T00:00");
    next.setDate(next.getDate() + 1);
    const pad = n => String(n).padStart(2, "0");
    dates = `${compact(date)}/${next.getFullYear()}${pad(next.getMonth() + 1)}${pad(next.getDate())}`;
  }
  const details = ["Planned with the Sharp Axe Method."];
  if (task.steps?.length) details.push("", "Steps:", ...task.steps.map(s => `- ${s.text}`));
  const params = new URLSearchParams({ action: "TEMPLATE", text: task.text, dates, details: details.join("\n") });
  if (task.weekly) params.set("recur", "RRULE:FREQ=WEEKLY");
  try { params.set("ctz", Intl.DateTimeFormat().resolvedOptions().timeZone); } catch {}
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}

const DURATIONS = [15, 30, 45, 60, 90, 120, 180, 240];
const durLabel = m => m < 60 ? `${m} min` : `${m / 60} hr${m > 60 ? "s" : ""}`;

function renderSchedule(p) {

  if (tasks.length) {
    tWrap.appendChild(el("div", { class: "hint", style: { marginTop: "6px" }, text: "Tip: pick the length after you double your guess. No date means today. No time means an all-day event." }));

  const quickCount = state.tasks.filter(t => t.quadrant === "quick" && !t.done).length;
  if (quickCount) {
    wrap.appendChild(el("div", { class: "note-line", text: `${plural(quickCount, "under-3-minute task")} not listed here. You will do those in Triage.` }));
  }
  return wrap;
}

/* ─── PHASE: COMMUNICATE ────────────────────────────────────── */

/* ─── PHASE: TRIAGE ─────────────────────────────────────────── */
// ADHD-friendly: one big "right now" task, a visual focus timer, tiny steps,
// "not now" without guilt, a "pick for me" button, short lists, and a small
// celebration for every finished task.
let _stepsOpenFor = null;
let _showAllUpNext = false;
let _showDone = false;

const PRAISE = [
  "Done! Nice work.", "One less thing. Keep going.", "That's momentum.",
  "Look at you go.", "Checked off. Take a breath.", "Boom. Next one.",
];

const timer = { total: 15 * 60, left: 15 * 60, running: false, endAt: 0, iv: 0 };

function triageList() {
  const remaining = state.tasks.filter(t => !t.done && t.quadrant !== "q4");
  const ids = new Set(remaining.map(t => t.id));
  const order = state.triageOrder.filter(id => ids.has(id));
  const seen = new Set(order);
  remaining.filter(t => !seen.has(t.id)).sort(priorityCompare).forEach(t => order.push(t.id));
  state.triageOrder = order;
  const byId = new Map(remaining.map(t => [t.id, t]));
  return order.map(id => byId.get(id));
}

function moveInOrder(id, toIndex) {
  const order = state.triageOrder.filter(x => x !== id);
  order.splice(Math.max(0, Math.min(order.length, toIndex)), 0, id);
  state.triageOrder = order;
  saveState(); render();
}

function completeTask(task, fromEl) {
  const w = waitingOn(task);
  if (w.length) { toast(`Finish “${w[0].text}” first. Then this one opens up.`, "error"); return false; }
  const waiting = state.tasks.filter(t => !t.done && t.after?.includes(task.id));
  task.done = true;
  task.doneAt = Date.now();
  logEvent(task, "sliced", (() => { const i = dueInfo(task); return i ? (i.past ? "after the due date" : "before the due date") : ""; })());
  recordSlice(task);
  celebrate(fromEl);
  const unlocked = waiting.filter(t => !isBlocked(t));
  toast(unlocked.length ? `Done! Unlocked: ${unlocked.map(t => t.text).join(", ")}` : PRAISE[Math.floor(Math.random() * PRAISE.length)]);
  if (_stepsOpenFor === task.id) _stepsOpenFor = null;
  resetTimer();
  saveState(); render();
  return true;
}

function fmtTime(sec) {
  const s = Math.max(0, Math.ceil(sec));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

function timerTick() {
  if (timer.running) {
    // Focus minutes go to the to-do in the "Right now" card.
    const now = Date.now();
    timer.acc = (timer.acc || 0) + (timer.last ? now - timer.last : 0);
    timer.last = now;
    while (timer.acc >= 60000) {
      timer.acc -= 60000;
      const t = triageList()[0];
      if (t) { t.focusMin = (t.focusMin || 0) + 1; saveState(); }
    }
    timer.left = (timer.endAt - Date.now()) / 1000;
    if (timer.left <= 0) {
      timer.left = 0; timer.running = false; clearInterval(timer.iv);
      chime();
      toast("Time's up! Stand up, stretch, then keep going or take a break.");
    }
  }
  const text = $("#timerText"), ring = $("#timerRing"), btn = $("#timerToggle");
  if (!text) return;
  text.textContent = fmtTime(timer.left);
  const C = 2 * Math.PI * 52;
  ring.style.strokeDasharray = C;
  ring.style.strokeDashoffset = C * (1 - timer.left / timer.total);
  btn.textContent = timer.running ? "Pause" : (timer.left < timer.total && timer.left > 0 ? "Resume" : "Start");
}

function toggleTimer() {
  if (timer.running) {
    timer.running = false; clearInterval(timer.iv); timer.last = 0;
  } else {
    if (timer.left <= 0) timer.left = timer.total;
    timer.running = true;
    timer.endAt = Date.now() + timer.left * 1000;
    clearInterval(timer.iv);
    timer.iv = setInterval(timerTick, 250);
  }
  timerTick();
}

function resetTimer(minutes) {
  if (minutes) timer.total = minutes * 60;
  timer.running = false; clearInterval(timer.iv); timer.last = 0;
  timer.left = timer.total;
  timerTick();
}

function chime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [660, 880, 990].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = f; o.type = "sine";
      g.gain.setValueAtTime(0.0001, ctx.currentTime + i * 0.18);
      g.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + i * 0.18 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i * 0.18 + 0.5);
      o.connect(g).connect(ctx.destination);
      o.start(ctx.currentTime + i * 0.18); o.stop(ctx.currentTime + i * 0.18 + 0.55);
    });
  } catch {}
}

function timerBlock() {
  const svg = `<svg viewBox="0 0 120 120" aria-hidden="true">
    <circle class="timer-track" cx="60" cy="60" r="52"/>
    <circle id="timerRing" class="timer-ring" cx="60" cy="60" r="52"/>
    <text id="timerText" class="timer-text" x="60" y="69" text-anchor="middle"></text>
  </svg>`;
  const presets = el("div", { class: "timer-presets" }, [5, 15, 25].map(m => el("button", {
    type: "button",
    class: timer.total === m * 60 ? "active" : "",
    text: `${m}m`,
    title: `${m} minute focus`,
    onclick: () => { resetTimer(m); render(); },
  })));
  const block = el("div", { class: "timer" }, [
    el("div", { html: svg }),
    presets,
    el("div", { class: "timer-controls" }, [
      el("button", { class: "btn btn-sm btn-dark", id: "timerToggle", type: "button", text: "Start", onclick: toggleTimer }),
      el("button", { class: "btn btn-sm btn-ghost", type: "button", text: "Reset", onclick: () => resetTimer() }),
    ]),
  ]);
  setTimeout(timerTick, 0);
  return block;
}

function stepsBlock(task) {
  const steps = task.steps || (task.steps = []);
  const open = _stepsOpenFor === task.id || steps.length > 0;
  if (!open) return null;
  const nextIdx = steps.findIndex(s => !s.done);
  const list = el("div", { class: "steps" });
  steps.forEach((s, i) => {
    list.appendChild(el("div", { class: `step ${s.done ? "done" : ""} ${i === nextIdx ? "next" : ""}` }, [
      el("span", {
        class: "check-circle", role: "checkbox", "aria-checked": String(s.done), tabindex: "0",
        html: s.done ? SVG.check : "",
        onclick: () => { setSubDone(task, s, !s.done); saveState(); render(); },
        onkeydown: (e) => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); setSubDone(task, s, !s.done); saveState(); render(); } },
      }),
      el("span", { class: "step-text", text: `${subLocked(task, s) ? "🔒 " : ""}${i + 1}. ${i === nextIdx ? "Next: " : ""}${s.text}` }),
      el("button", {
        class: "icon-btn danger", type: "button", "aria-label": "Remove step", html: SVG.x,
        onclick: () => { task.steps = steps.filter(x => x.id !== s.id); saveState(); render(); },
      }),
    ]));
  });
  const inputId = "step-input";
  const add = () => {
    const v = ($(`#${inputId}`)?.value || "").trim();
    if (!v) return;
    steps.push(normalizeStep({ text: v }));
    logEvent(task, "sub added", v);
    saveState(); render();
    setTimeout(() => $(`#${inputId}`)?.focus(), 0);
  };
  return el("div", {}, [
    el("span", { class: "section-label", text: "Sub-bubbles (small parts)" }),
    list,
    el("input", {
      type: "text", id: inputId, class: "step-input",
      placeholder: steps.length ? "Add another step..." : "What is the very first tiny step? (for example: open the file)",
      onkeydown: (e) => { if (e.key === "Enter") add(); },
    }),
  ]);
}

// What block are you in right now, or which one starts soon?
function nowStrip() {
  const now = new Date();
  let cur = null, next = null;
  for (const b of state.blocks) {
    const r = nextOccurrence(b, now);
    if (!r) continue;
    if (r[0] <= now) { if (!cur || b.kind === "bucket") cur = { b, r }; }
    else if (r[0] - now <= 60 * 60000 && (!next || r[0] < next.r[0])) next = { b, r };
  }
  if (cur) {
    const isBucket = cur.b.kind === "bucket";
    const name = cur.b.name || (isBucket ? "Bucket" : "Blocked-off");
    return el("div", { class: "now-strip", style: { "--c": isBucket ? "var(--bucket)" : "var(--ink-faint)" } }, [
      el("strong", { text: isBucket ? `${name} time` : `${name} (blocked off)` }),
      el("span", {}, [el("span", { "data-left": String(cur.r[1].getTime()), text: minutesText((cur.r[1] - now) / 60000) }), " left"]),
      isBucket ? el("span", { text: `· ${plural(tasksIn(cur.r).filter(t => hasTag(t, cur.b.name)).length, "task")} planned` }) : null,
    ]);
  }
  if (next) {
    return el("div", { class: "now-strip", style: { "--c": "var(--amber)" } }, [
      el("strong", { text: next.b.kind === "bucket" ? `${next.b.name} time` : (next.b.name || "Blocked-off time") }),
      el("span", { text: `starts at ${next.b.start}` }),
    ]);
  }
  return null;
}

/* ─── HOME: MY TO-DOS ───────────────────────────────────────── */
// The front page: add a to-do, see what matters most and what is soonest.
let _view = "home";          // "home" or "steps"
let _homeSort = "importance"; // or "soonest"
let _openFor = null;
let _homeShowDone = false;

// Importance 1 (low) … 7 (very important). With no number set, the box from
// the Sort step gives a guess; with neither, it counts as 4 (the middle).
const QUAD_IMPORTANCE = { q1: 7, q2: 5, quick: 4, q4: 1 };
const importanceOf = (t) => t.importance ?? QUAD_IMPORTANCE[t.quadrant] ?? 4;
const IMPORTANCE_COLORS = ["#8a94a3", "#6b8cae", "#3f8fd2", "#2fa39a", "#9b6be0", "#e0a028", "#e0443a"];
const importanceColor = (n) => IMPORTANCE_COLORS[Math.max(1, Math.min(7, Math.round(n))) - 1];
function importanceBadge(t) {
  const n = importanceOf(t);
  return el("span", {
    class: "badge", style: { "--c": importanceColor(n) },
    title: t.importance ? `Importance ${n} of 7` : `Importance not set (counts as ${n})`,
    text: t.importance ? `★ ${n}` : `★ ${n}?`,
  });
}
function dueMs(t) {
  const d = dueAt(t) || (t.steps || []).filter(s => !s.done).map(dueAt).filter(Boolean).sort((a, b) => a - b)[0];
  if (d) return d.getTime();
  const s = taskStart(t);
  if (s) return s.getTime();
  return t.date ? at(t.date, "23:59").getTime() : Infinity;
}
const cmp = (x, y) => x < y ? -1 : x > y ? 1 : 0;
function homeCompare(a, b) {
  const imp = cmp(importanceOf(b), importanceOf(a)); // 7 first
  const urg = cmp(dueMs(a), dueMs(b));
  return (_homeSort === "soonest" ? (urg || imp) : (imp || urg)) || state.tasks.indexOf(a) - state.tasks.indexOf(b);
}

/* ─── TO-DO JAR (Matter.js physics) ─────────────────────────── */
// Every open to-do is a blob in a jar of "liquid". The liquid gets denser
// toward the bottom (like real water layers), so each blob sinks until the
// liquid around it is as dense as the blob. Heavier to-dos (less important,
// less time-sensitive, longer) settle lower. Size shows time to complete.
// Long titles make pill shapes. Sub-bubbles float in a pocket inside their
// parent, in a small physics world of their own that sloshes when the parent
// moves. "Must finish first" links are springs. A tag group pulls itself
// together (matter-attractors). Hold down on a blob to slice it.
const HAS_PHYSICS = !!window.Matter;
if (HAS_PHYSICS && window.MatterAttractors) Matter.use(MatterAttractors);
const HOME_MODE_KEY = "sharp-axe-home-mode";
let _homeMode = (() => { try { return localStorage.getItem(HOME_MODE_KEY); } catch { return null; } })()
  || (reduceMotion() ? "list" : "bubbles");
let _tool = "move";    // "move" (drag) or "link" (connect)
let _groupTag = "";    // tag to cluster and highlight
let _linkFrom = null;  // Link tool: first task tapped, waiting for the second

const FLUID = 0.001;   // liquid density at the very top of the jar
// Collision groups: blobs bump blobs and walls; slice pieces only hit walls.
const CAT_BLOB = 0x0001, CAT_PIECE = 0x0002, CAT_WALL = 0x0004;
const CHARGE_MS = 800;

// 0 = light (floats up) … 1 = heavy (sinks).
function weightParts(t, now = Date.now()) {
  const imp = (7 - importanceOf(t)) / 6; // 7 → 0 (light), 1 → 1 (heavy)
  const until = dueMs(t) - now;
  const urg = until === Infinity ? 1 : until <= 3600e3 ? 0 : until <= 86400e3 ? 0.3 : until <= 7 * 86400e3 ? 0.6 : 1;
  const mins = Math.min(240, Math.max(15, t.duration || 30));
  const len = Math.log(mins / 15) / Math.log(16);
  return { imp, urg, len, w: 0.45 * imp + 0.35 * urg + 0.2 * len };
}
const blobDensity = (w) => FLUID * (0.6 + w);
const fluidAt = (y) => FLUID * (0.6 + Math.max(0, Math.min(1, y / (jar.h || 1))));

function weightReasons(t) {
  const { w } = weightParts(t);
  return [
    w < 0.35 ? "Floats up" : w < 0.65 ? "Floats in the middle" : "Sinks",
    t.importance ? `importance ${t.importance}/7` : `importance not set (${importanceOf(t)})`,
    `takes about ${durLabel(t.duration || 30)}`,
  ].join(" · ");
}

const jar = {
  engine: null, wrap: null, canvas: null, ctx: null, tip: null, menu: null,
  w: 0, h: 0, dpr: 1, scale: 1,
  bodies: new Map(),   // task id → body
  links: new Map(),    // "firstId>thenId" → spring
  walls: [], drag: null, down: null, linkLine: null,
  pops: [], fizz: [], drops: [], pieces: [], flashes: [], sparks: [],
  hover: null, charge: null, slicing: new Set(),
  raf: 0, placed: false, colors: {},
};

function ensureJar() {
  if (jar.engine || !HAS_PHYSICS) return;
  const { Engine, Events, Body } = Matter;
  jar.engine = Engine.create({ gravity: { x: 0, y: 1, scale: 0.001 } });
  // Buoyancy: push each blob up by the weight of the liquid it moves aside.
  Events.on(jar.engine, "beforeUpdate", () => {
    const g = jar.engine.gravity;
    for (const b of jar.bodies.values()) {
      Body.applyForce(b, b.position, { x: 0, y: -fluidAt(b.position.y) * b.area * g.y * g.scale });
    }
  });
  // Jelly: a bump makes both blobs wobble.
  Events.on(jar.engine, "collisionStart", (ev) => {
    for (const { bodyA, bodyB } of ev.pairs) {
      const rel = Math.hypot(bodyA.velocity.x - bodyB.velocity.x, bodyA.velocity.y - bodyB.velocity.y);
      for (const b of [bodyA, bodyB]) if (b.plugin.jelly) b.plugin.jelly.vs += Math.min(0.12, rel * 0.02);
    }
  });

  jar.canvas = el("canvas", { role: "img", "aria-label": "Your to-dos as floating blobs. Lighter ones float to the top. Switch to List for a plain list." });
  jar.tip = el("div", { class: "jar-tip" });
  jar.menu = el("div", { class: "jar-menu", role: "menu" });
  jar.wrap = el("div", { class: "jar" }, [jar.canvas, jar.tip, jar.menu]);
  jar.ctx = jar.canvas.getContext("2d");

  new ResizeObserver(() => jarResize()).observe(jar.wrap);
  window.matchMedia?.("(prefers-color-scheme: dark)").addEventListener?.("change", readJarColors);

  const c = jar.canvas;
  c.addEventListener("pointerdown", jarPointerDown);
  c.addEventListener("pointermove", jarPointerMove);
  c.addEventListener("pointerup", jarPointerUp);
  c.addEventListener("pointercancel", jarPointerUp);
  c.addEventListener("pointerleave", () => { if (!jar.down) { jar.hover = null; jar.tip.style.opacity = "0"; } });
  // The right button is handled in pointerdown/up (short = menu, hold = slice).
  c.addEventListener("contextmenu", (e) => e.preventDefault());
  // On touch screens, only stop the page from scrolling when a blob is touched.
  c.addEventListener("touchstart", (e) => {
    const r = c.getBoundingClientRect(), t = e.touches[0];
    if (hitAt({ x: t.clientX - r.left, y: t.clientY - r.top })) e.preventDefault();
  }, { passive: false });
  setInterval(updateJarTip, 250);
}

function jarResize() {
  const r = jar.wrap.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const { Bodies, Composite, Body } = Matter;
  jar.w = r.width; jar.h = r.height;
  jar.dpr = window.devicePixelRatio || 1;
  jar.canvas.width = Math.round(jar.w * jar.dpr);
  jar.canvas.height = Math.round(jar.h * jar.dpr);
  jar.scale = Math.max(0.62, Math.min(1, jar.w / 700));
  Composite.remove(jar.engine.world, jar.walls);
  const T = 80, opts = { isStatic: true, friction: 0.1, collisionFilter: { category: CAT_WALL } };
  jar.walls = [
    Bodies.rectangle(jar.w / 2, jar.h + T / 2, jar.w + 2 * T, T, opts),
    Bodies.rectangle(jar.w / 2, -T / 2, jar.w + 2 * T, T, opts),
    Bodies.rectangle(-T / 2, jar.h / 2, T, jar.h + 2 * T, opts),
    Bodies.rectangle(jar.w + T / 2, jar.h / 2, T, jar.h + 2 * T, opts),
  ];
  Composite.add(jar.engine.world, jar.walls);
  for (const b of jar.bodies.values()) {
    const { w, h } = b.plugin.shape;
    Body.setPosition(b, {

/* ---- shapes ---- */

  const k = jar.scale * crowd;

  const r = (26 + 38 * weightParts(t).len) * k;
  const subs = openSubs(t);
  if (subs.length) {
    const pocket = subs.reduce((n, s) => n + Math.PI * (subRadius(s) * crowd) ** 2, 0) * 2.4;
    const band = 44 * k;

    { len: Math.PI * r / 2, at: (f) => { const a = -Math.PI / 2 + f * Math.PI / 2; return { x: sx + Math.cos(a) * r, y: -sy + Math.sin(a) * r, nx: Math.cos(a), ny: Math.sin(a) }; } },
    { len: 2 * sy, at: (f) => ({ x: w / 2, y: -sy + 2 * sy * f, nx: 1, ny: 0 }) },
    { len: Math.PI * r / 2, at: (f) => { const a = f * Math.PI / 2; return { x: sx + Math.cos(a) * r, y: sy + Math.sin(a) * r, nx: Math.cos(a), ny: Math.sin(a) }; } },
    { len: 2 * sx, at: (f) => ({ x: sx - 2 * sx * f, y: h / 2, nx: 0, ny: 1 }) },
    { len: Math.PI * r / 2, at: (f) => { const a = Math.PI / 2 + f * Math.PI / 2; return { x: -sx + Math.cos(a) * r, y: sy + Math.sin(a) * r, nx: Math.cos(a), ny: Math.sin(a) }; } },
    { len: 2 * sy, at: (f) => ({ x: -w / 2, y: sy - 2 * sy * f, nx: -1, ny: 0 }) },
    { len: Math.PI * r / 2, at: (f) => { const a = Math.PI + f * Math.PI / 2; return { x: -sx + Math.cos(a) * r, y: -sy + Math.sin(a) * r, nx: Math.cos(a), ny: Math.sin(a) }; } },

/* ---- sub-bubble pockets: a little world inside the parent ---- */

    Bodies.rectangle(cx, pr.y0 - T / 2, w + 2 * T, T, o),
    Bodies.rectangle(pr.x0 - T / 2, cy, T, h + 2 * T, o),
    Bodies.rectangle(pr.x1 + T / 2, cy, T, h + 2 * T, o),
  ]);
