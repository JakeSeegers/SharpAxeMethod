/* ---- keep the physics world in step with the list ---- */
function syncJar() {
  if (!jar.engine || !jar.w) return;
  const { Body, Composite, Constraint } = Matter;
  const world = jar.engine.world;
  const tasks = state.tasks.filter(t => !t.done);
  const ids = new Set(tasks.map(t => t.id));

  for (const [id, b] of jar.bodies) {
    if (ids.has(id)) continue;
    const t = taskById(id);
    if (t?.done && !jar.slicing.has(id)) jar.pops.push({ x: b.position.x, y: b.position.y, r: b.plugin.shape.h / 2, t0: performance.now(), c: blobColor(t) });
    jar.slicing.delete(id);
    Composite.remove(world, b);
    jar.bodies.delete(id);
  }

  // Shrink everything a little when the blobs would fill more than half the jar.
  const want = tasks.map(t => blobShape(t));
  const area = want.reduce((n, s) => n + shapeArea(s), 0);
  const crowd = Math.min(1, Math.sqrt((0.5 * jar.w * jar.h) / (area || 1)));

  tasks.forEach((t) => {
    const shape = crowd < 1 ? blobShape(t, crowd) : want[tasks.indexOf(t)];
    const { w } = weightParts(t);
    let b = jar.bodies.get(t.id);
    const old = b?.plugin.shape;
    if (b && (old.kind !== shape.kind || Math.abs(old.w - shape.w) > 2 || Math.abs(old.h - shape.h) > 2)) {
      // Shape changed: swap in a new body at the same place and speed.
      const nb = makeBlob(b.position.x, b.position.y, shape, w);
      Body.setVelocity(nb, b.velocity);
      nb.plugin.jelly.vs = 0.12;
      Composite.remove(world, b);
      b = nb;
      jar.bodies.set(t.id, b);
      Composite.add(world, b);
    } else if (!b) {
      const x = shape.w / 2 + Math.random() * Math.max(1, jar.w - shape.w);
      // First time: start near where it will settle. New to-dos drop in from the top.
      const y = jar.placed ? shape.h / 2 + 2 : Math.max(shape.h / 2, Math.min(jar.h - shape.h / 2, w * jar.h));
      b = makeBlob(x, y, shape, w);
      jar.bodies.set(t.id, b);
      Composite.add(world, b);
      if (jar.placed) splash(x, y - shape.h / 2, blobColor(t));
    } else if (Math.abs(b.density - blobDensity(w)) > 1e-7) {
      Body.setDensity(b, blobDensity(w));
      Body.setInertia(b, Infinity);

    syncPocket(b, t, crowd);

  const wanted = new Map();

    const a = jar.bodies.get(p.id), b = jar.bodies.get(t.id);

    const pair = wanted.get(key);

  }
  for (const [key, [a, b]] of wanted) {
    if (jar.links.has(key)) continue;
    const c = Constraint.create({ bodyA: a, bodyB: b, length: (a.plugin.shape.w + b.plugin.shape.w) / 2 + 70, stiffness: 0.0015, damping: 0.02 });
    jar.links.set(key, c);
    Composite.add(world, c);
  }
}

}

    el("strong", { text: x.text }),
    h.sub ? el("div", { class: "tip-dim", text: `Part of “${t.text}”` }) : null,
    el("div", { class: `tip-due ${i ? i.cls : ""}`, text: i ? i.long : "No due date" }),
    h.sub ? null : el("div", { text: weightReasons(t) }),

    !h.sub && (t.tags || []).length ? el("div", { text: t.tags.map(x => `#${x}`).join(" ") }) : null,
    !h.sub && waitingOn(t).length ? el("div", { text: `🔒 Finish first: ${waitingOn(t).map(x => x.text).join(", ")}` }) : null,
    x.details ? el("div", { class: "tip-dim", text: x.details.length > 90 ? x.details.slice(0, 90) + "…" : x.details }) : null,

    item("Edit", () => { _openFor = t.id; _subDetailsOpen = s.id; render(); setTimeout(() => $(".jar-editor")?.scrollIntoView({ block: "nearest" }), 0); }),
  ] : [
    item(isBlocked(t) ? "🔒 Slice (done)" : "⚔ Slice (done)", () => doSlice(hit, -0.3)),
    item("Edit", () => { _openFor = t.id; _stepsOpenFor = t.id; render(); setTimeout(() => $(".jar-editor")?.scrollIntoView({ block: "nearest" }), 0); }),
    item("Link from here", () => { _tool = "link"; _linkFrom = t.id; render(); toast(`Now tap the to-do that waits for “${t.text}”.`); }),
    item("Delete", () => { deleteTask(t); if (_openFor === t.id) _openFor = null; saveState(); render(); }, "danger"),
  ]));
  jar.menu.style.left = `${Math.min(p.x, jar.w - 180)}px`;
  jar.menu.style.top = `${Math.min(p.y, jar.h - 180)}px`;
  jar.menu.classList.add("open");
  jar.menu.querySelector("button")?.focus();
}
function closeJarMenu() { jar.menu?.classList.remove("open"); }

/* ---- charge and slice ---- */
function startCharge(hit) {
  if (!jar.down) return;
  jar.hover = null;
  jar.tip.style.opacity = "0";
  jar.charge = {
    hit, t0: performance.now(),
    angle: -0.45 + Math.random() * 0.3,
    blocked: hit.sub ? subLocked(hit.task, hit.sub) : isBlocked(hit.task),
    p0: jar.down ? { ...jar.down.last } : null,
    broken: false,
  };
}

// Cut a convex outline in two along a line through its centre.
function splitPolygon(pts, c, angle) {
  const n = { x: -Math.sin(angle), y: Math.cos(angle) };
  const side = (p) => (p.x - c.x) * n.x + (p.y - c.y) * n.y;
  const halves = [[], []];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    const sa = side(a), sb = side(b);
    (sa >= 0 ? halves[0] : halves[1]).push({ x: a.x, y: a.y });
    if ((sa >= 0) !== (sb >= 0)) {
      const k = sa / (sa - sb);
      const q = { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k };
      halves[0].push(q); halves[1].push({ ...q });
    }
  }
  return { halves: halves.filter(h => h.length >= 3), n };
}

// The slice: blade flash, two halves fly apart and fall, then the to-do is done.
function doSlice(hit, angle) {
  const t = hit.task, s = hit.sub;
  if (!s && isBlocked(t)) { completeTask(t, null); return; } // shows "finish X first"
  if (s && subLocked(t, s)) { toast(lockedSubMsg(t, s), "error"); return; }
  const { Bodies, Body, Composite } = Matter;
  let center, pts, color = blobColor(t), r;
  if (s) {
    const sb = hit.subBody, pb = hit.body;
    center = { x: pb.position.x + sb.position.x, y: pb.position.y + sb.position.y };
    r = sb.circleRadius;
    pts = sb.plugin.pts.map(q => ({ x: center.x + q.x, y: center.y + q.y }));
  } else {
    const b = hit.body;
    center = { ...b.position };
    r = b.plugin.shape.w / 2;
    pts = b.plugin.pts.map(q => ({ x: center.x + q.x, y: center.y + q.y }));
  }
  const { halves, n } = splitPolygon(pts, center, angle);
  halves.forEach((h, i) => {
    const cx = h.reduce((a, p) => a + p.x, 0) / h.length, cy = h.reduce((a, p) => a + p.y, 0) / h.length;
    const piece = Bodies.fromVertices(cx, cy, [h], {
      frictionAir: 0.02, restitution: 0.3,
      collisionFilter: { category: CAT_PIECE, mask: CAT_WALL },
    });
    if (!piece) return;
    const dir = i === 0 ? 1 : -1;
    Body.setVelocity(piece, { x: n.x * 5 * dir, y: n.y * 5 * dir - 3 });
    Body.setAngularVelocity(piece, 0.08 * dir);
    piece.plugin.color = color;
    piece.plugin.t0 = performance.now();
    jar.pieces.push(piece);
    Composite.add(jar.engine.world, piece);
  });
  jar.flashes.push({ x: center.x, y: center.y, a: angle, len: r * 2.6, t0: performance.now(), c: color });
  for (let i = 0; i < 14; i++) {
    const a = Math.random() * Math.PI * 2, v = 2 + Math.random() * 4;
    jar.drops.push({ x: center.x, y: center.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, r: 1.5 + Math.random() * 2.5, t0: performance.now(), c: color });
  }
  const fakeEl = { getBoundingClientRect: () => {
    const cr = jar.canvas.getBoundingClientRect();
    return { left: cr.left + center.x, top: cr.top + center.y, width: 0, height: 0 };
  } };
  if (s) {
    const pk = hit.body.plugin.pocket;
    if (pk) { Composite.remove(pk.engine.world, hit.subBody); pk.subs.delete(s.id); }
    setSubDone(t, s, true);
    celebrate(fakeEl);
    toast(`Sliced: ${s.text}`);
    saveState(); syncJar(); render();
  } else {
    Composite.remove(jar.engine.world, hit.body);
    jar.bodies.delete(t.id);
    jar.slicing.add(t.id);
    if (_openFor === t.id) _openFor = null;
    completeTask(t, fakeEl);
  }
}

// From buttons (editor, list): play the slice when the blob is on screen.
function sliceTask(t, fromEl) {
  const b = jar.bodies.get(t.id);
  if (b && jar.wrap?.isConnected && !isBlocked(t)) { doSlice({ body: b, task: t }, -0.3); return; }
  if (completeTask(t, fromEl) && _openFor === t.id) { _openFor = null; render(); }
}
function sliceSub(t, s, fromEl) {
  const pk = jar.bodies.get(t.id)?.plugin.pocket;
  const sb = pk?.subs.get(s.id);
  if (subLocked(t, s)) { toast(lockedSubMsg(t, s), "error"); return; }
  if (sb && jar.wrap?.isConnected) { doSlice({ body: jar.bodies.get(t.id), subBody: sb, task: t, sub: s }, -0.3); return; }
  if (!setSubDone(t, s, true)) return;
  celebrate(fromEl);
  saveState(); render();
}

/* ---- little effects ---- */
function splash(x, y, color) {
  if (reduceMotion()) return;
  const now = performance.now();
  jar.pops.push({ x, y, r: 6, t0: now, c: color });
  for (let i = 0; i < 9; i++) {
    const a = -Math.PI * (0.15 + 0.7 * Math.random()), v = 2 + Math.random() * 3;
    jar.drops.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: 1.5 + Math.random() * 2, t0: now, c: color });
  }
}
function stepEffects(ts) {
  // Rising bubbles in the liquid.
  if (!reduceMotion() && jar.fizz.length < 26 && Math.random() < 0.06) {
    jar.fizz.push({ x: Math.random() * jar.w, y: jar.h + 4, r: 1.2 + Math.random() * 3, v: 0.25 + Math.random() * 0.6, s: Math.random() * 6 });
  }
  jar.fizz.forEach(f => { f.y -= f.v; f.x += Math.sin(ts / 500 + f.s) * 0.25; });
  jar.fizz = jar.fizz.filter(f => f.y > -6);
  jar.drops.forEach(d => { d.x += d.vx; d.y += d.vy; d.vy += 0.18; d.vx *= 0.98; });
  jar.drops = jar.drops.filter(d => ts - d.t0 < 700);
  // Slice pieces fade, then leave.
  jar.pieces = jar.pieces.filter(p => {
    if (ts - p.plugin.t0 < 1600) return true;
    Matter.Composite.remove(jar.engine.world, p);
    return false;
  });
  // Jelly: each blob is a small spring that squashes on bumps and settles.
  for (const b of jar.bodies.values()) jellyStep(b);
  for (const b of jar.bodies.values()) {
    const pk = b.plugin.pocket;
    if (pk) for (const sb of pk.subs.values()) jellyStep(sb);
  }
}
function jellyStep(b) {
  const j = b.plugin.jelly;
  if (!j) return;
  const dvx = b.velocity.x - j.last.x, dvy = b.velocity.y - j.last.y;
  const kick = Math.hypot(dvx, dvy);
  if (kick > 0.35) { j.vs += Math.min(0.08, kick * 0.03); j.ang = Math.atan2(dvy, dvx); }
  j.last = { ...b.velocity };
  j.vs += -0.22 * j.s;
  j.vs *= 0.86;
  j.s = Math.max(-0.22, Math.min(0.22, j.s + j.vs));
}

/* ---- drawing ---- */
function blobColor(t) {
  if (!t || (!t.importance && !t.quadrant)) return jar.colors.muted;
  return importanceColor(importanceOf(t));
}

function wrapLines(ctx, text, maxW, maxLines) {
  const words = text.split(/\s+/);
  const lines = [];
  let cur = "";
  for (const w of words) {
    const test = cur ? `${cur} ${w}` : w;
    if (ctx.measureText(test).width <= maxW || !cur) cur = test;
    else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  if (lines.length > maxLines) {
    lines.length = maxLines;
    let last = lines[maxLines - 1];
    while (last.length > 1 && ctx.measureText(last + "…").width > maxW) last = last.slice(0, -1);
    lines[maxLines - 1] = last + "…";
  }
  return lines;
}

// A soft, wobbly outline that breathes, and squashes along its last bump.
function jellyPath(ctx, b, ts, extra = 0) {
  const pts = b.plugin.pts, s = b.plugin.seed, j = b.plugin.jelly || { s: 0, ang: 0 };
  const calm = reduceMotion();
  const speed = Math.min(1, Math.hypot(b.velocity.x, b.velocity.y) / 3);
  const size = b.plugin.shape ? Math.min(b.plugin.shape.w, b.plugin.shape.h) / 2 : b.circleRadius;
  const amp = calm ? 0 : size * (0.022 + 0.045 * speed) + extra;
  const breathe = calm ? 1 : 1 + 0.018 * Math.sin(ts / 850 + s);
  const sq = calm ? 0 : j.s, ca = Math.cos(j.ang), sa = Math.sin(j.ang);
  const N = pts.length, out = [];
  for (let i = 0; i < N; i++) {
    const p = pts[i], a = p.u * Math.PI * 2;
    const k = amp * Math.sin(3 * a + ts / 650 + s) + amp * 0.5 * Math.sin(5 * a - ts / 900 + 2 * s);
    let x = (p.x + p.nx * k) * breathe, y = (p.y + p.ny * k) * breathe;
    // Squash and stretch along the bump direction.
    const along = x * ca + y * sa, across = -x * sa + y * ca;
    const a2 = along * (1 + sq), c2 = across * (1 - sq);
    out.push([b.position.x + a2 * ca - c2 * sa, b.position.y + a2 * sa + c2 * ca]);
  }
  ctx.beginPath();
  const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
  const m = mid(out[N - 1], out[0]);
  ctx.moveTo(m[0], m[1]);
  for (let i = 0; i < N; i++) {
    const p = out[i], q = mid(p, out[(i + 1) % N]);
    ctx.quadraticCurveTo(p[0], p[1], q[0], q[1]);
  }
  ctx.closePath();
}

function arrow(ctx, a, b, color, dashed) {
  const dx = b.position.x - a.position.x, dy = b.position.y - a.position.y;
  const d = Math.hypot(dx, dy) || 1, nx = dx / d, ny = dy / d;
  const edge = (body, dir) => {
    const { w, h } = body.plugin.shape;
    return Math.min(Math.abs(w / 2 / (dir.x || 1e-6)), Math.abs(h / 2 / (dir.y || 1e-6)), Math.hypot(w, h) / 2);
  };
  const ra = edge(a, { x: nx, y: ny }), rb = edge(b, { x: nx, y: ny });
  const sx = a.position.x + nx * ra, sy = a.position.y + ny * ra;
  const ex = b.position.x - nx * (rb + 3), ey = b.position.y - ny * (rb + 3);
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2;
  ctx.setLineDash(dashed ? [6, 5] : []);
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
  ctx.setLineDash([]);
  const ang = Math.atan2(dy, dx), L = 9;
  ctx.beginPath();
  ctx.moveTo(ex, ey);
  ctx.lineTo(ex - L * Math.cos(ang - 0.45), ey - L * Math.sin(ang - 0.45));
  ctx.lineTo(ex - L * Math.cos(ang + 0.45), ey - L * Math.sin(ang + 0.45));
  ctx.closePath(); ctx.fill();
}

const RING = (c, cls) => ({ calm: c.steel, soon: c.amber, near: c.accent, past: c.muted })[cls];

function drawJar(ts) {
  const ctx = jar.ctx, c = jar.colors, W = jar.w, H = jar.h;
  ctx.setTransform(jar.dpr, 0, 0, jar.dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  // Liquid: clear at the top, deeper toward the bottom, with rising bubbles.
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, rgba(c.bucket, 0.02));
  g.addColorStop(1, rgba(c.steel, 0.14));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = rgba(c.bucket, 0.35); ctx.lineWidth = 1;
  for (const f of jar.fizz) { ctx.globalAlpha = Math.min(1, f.y / H + 0.2); ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.stroke(); }
  ctx.globalAlpha = 1;
  ctx.font = `700 11px ${c.sans}`;
  ctx.fillStyle = c.muted;
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillText("↑ LIGHTER · DO SOONER", 12, 20);
  ctx.fillText("↓ HEAVIER · LATER", 12, H - 12);

  const bodies = [...jar.bodies.values()];

  // Group outline around the picked tag.
  if (_groupTag) {
    const mem = bodies.filter(b => hasTag(b.plugin.task, _groupTag));
    if (mem.length) {
      const cx = mem.reduce((n, b) => n + b.position.x, 0) / mem.length;
      const cy = mem.reduce((n, b) => n + b.position.y, 0) / mem.length;
      const R = Math.max(...mem.map(b => Math.hypot(b.position.x - cx, b.position.y - cy) + b.plugin.shape.w / 2)) + 12;
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2);
      ctx.fillStyle = rgba(c.bucket, 0.07); ctx.fill();
      ctx.setLineDash([7, 6]); ctx.strokeStyle = rgba(c.bucket, 0.7); ctx.lineWidth = 1.5; ctx.stroke(); ctx.setLineDash([]);
      ctx.font = `800 13px ${c.head}`; ctx.fillStyle = c.bucket; ctx.textAlign = "center";
      ctx.fillText(`#${_groupTag}`, cx, Math.max(16, cy - R - 6));
    }
  }

  // Links: arrow from the to-do to finish first, to the one that waits.
  for (const con of jar.links.values()) arrow(ctx, con.bodyA, con.bodyB, rgba(c.muted, 0.8), true);
  if (jar.linkLine) {
    const f = jar.linkLine.from;
    ctx.strokeStyle = c.accent; ctx.lineWidth = 2.5; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(f.position.x, f.position.y); ctx.lineTo(jar.linkLine.p.x, jar.linkLine.p.y); ctx.stroke();
    ctx.setLineDash([]);
  }

  const ch = jar.charge;
  const chargeK = ch ? Math.min(1, (performance.now() - ch.t0) / CHARGE_MS) : 0;
  if (ch && ch.blocked && chargeK >= 1 && !ch.broken) {
    ch.broken = true;
    if (ch.hit.sub) toast(lockedSubMsg(ch.hit.task, ch.hit.sub), "error");
    else toast(`Finish “${waitingOn(ch.hit.task)[0]?.text}” first. Then this one opens up.`, "error");
  }

  for (const b of bodies) {
    const t = b.plugin.task;
    const col = blobColor(t);
    const blocked = isBlocked(t);
    const due = dueInfo(t);
    const charging = ch && ch.hit.body === b && !ch.hit.sub;
    ctx.save();
    if (charging && !reduceMotion()) ctx.translate((Math.random() - 0.5) * 4 * chargeK, (Math.random() - 0.5) * 4 * chargeK);
    ctx.globalAlpha = _groupTag && !hasTag(t, _groupTag) ? 0.3 : blocked ? 0.62 : 1;
    jellyPath(ctx, b, ts, charging ? 2 * chargeK : 0);
    ctx.fillStyle = c.surface; ctx.fill();
    ctx.fillStyle = rgba(col, t.importance || t.quadrant ? 0.2 : 0.1); ctx.fill();
    ctx.strokeStyle = due ? RING(c, due.cls) : rgba(col, 0.75);
    ctx.lineWidth = due ? 3 : 2;
    ctx.stroke();
    if (_openFor === t.id || _linkFrom === t.id) {
      jellyPath(ctx, b, ts, 6);
      ctx.strokeStyle = rgba(c.accent, 0.8); ctx.lineWidth = 2; ctx.stroke();
    }

    // Words inside the blob (a box keeps them in its top band).
    const shape = b.plugin.shape;
    const fs = Math.max(10.5, Math.min(14, shape.h / 6.8, shape.kind === "box" ? 13.5 : 14));
    ctx.font = `600 ${fs}px ${c.sans}`;
    ctx.fillStyle = c.ink; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const maxW = shape.kind === "circle" ? shape.cr * 1.55 : shape.w - shape.cr * (shape.kind === "pill" ? 0.9 : 0.5) - 8;
    const lines = wrapLines(ctx, t.text, maxW, shape.kind === "box" ? 2 : shape.h > 68 ? 3 : 2);
    const sub = due && shape.h > 56 ? due.short : "";
    const lh = fs * 1.2;
    const cy = shape.kind === "box" ? b.position.y - shape.h / 2 + shape.band / 2 + 2 : b.position.y;
    let y = cy - ((lines.length - 1) * lh + (sub && shape.kind !== "box" ? lh : 0)) / 2;
    if (blocked) ctx.fillText("🔒", b.position.x, y - lh);
    for (const line of lines) { ctx.fillText(line, b.position.x, y); y += lh; }
    if (sub && shape.kind !== "box") { ctx.font = `700 ${fs - 2}px ${c.sans}`; ctx.fillStyle = RING(c, due.cls); ctx.fillText(sub, b.position.x, y); }

    // The pocket and its sub-bubbles.
    const pk = b.plugin.pocket;
    if (pk) {
      const pr = pk.pr, ox = b.position.x, oy = b.position.y;
      ctx.fillStyle = rgba(col, 0.08);
      ctx.beginPath();
      ctx.roundRect?.(ox + pr.x0, oy + pr.y0, pr.x1 - pr.x0, pr.y1 - pr.y0, pr.r);
      ctx.fill();
      // The string between the beads.
      ctx.strokeStyle = rgba(col, 0.55); ctx.lineWidth = 1.5; ctx.setLineDash([3, 3]);
      for (const con of pk.chain) {
        ctx.beginPath();
        ctx.moveTo(ox + con.bodyA.position.x, oy + con.bodyA.position.y);
        ctx.lineTo(ox + con.bodyB.position.x, oy + con.bodyB.position.y);
        ctx.stroke();
      }
      ctx.setLineDash([]);
      for (const sb of pk.subs.values()) {
        const s = sb.plugin.sub;
        const locked = subLocked(t, s), isNext = t.inOrder && nextSub(t) === s;
        ctx.save();
        if (locked) ctx.globalAlpha *= 0.5;
        const view = { ...sb, position: { x: ox + sb.position.x, y: oy + sb.position.y }, plugin: sb.plugin, velocity: sb.velocity, circleRadius: sb.circleRadius };
        const subCharging = ch && ch.hit.subBody === sb;
        if (subCharging && !reduceMotion()) { ctx.save(); ctx.translate((Math.random() - 0.5) * 3 * chargeK, (Math.random() - 0.5) * 3 * chargeK); }
        jellyPath(ctx, view, ts, subCharging ? 1.5 * chargeK : 0);
        ctx.fillStyle = c.surface; ctx.fill();
        ctx.fillStyle = rgba(col, 0.16); ctx.fill();
        const sd = dueInfo(s);
        ctx.strokeStyle = isNext ? c.accent : sd ? RING(c, sd.cls) : rgba(col, 0.6);
        ctx.lineWidth = isNext ? 2.5 : sd ? 2 : 1.3; ctx.stroke();
        const sfs = Math.max(8.5, Math.min(11, sb.circleRadius / 2.4));
        // Its place in the order, at the top of the bead.
        ctx.font = `800 ${sfs}px ${c.sans}`; ctx.fillStyle = isNext ? c.accent : c.mid;
        ctx.fillText(locked ? `🔒${subNumber(t, s)}` : String(subNumber(t, s)), view.position.x, view.position.y - sb.circleRadius + sfs * 0.95);
        ctx.font = `600 ${sfs}px ${c.sans}`; ctx.fillStyle = c.ink;
        const sl = wrapLines(ctx, s.text, sb.circleRadius * 1.6, 2);
        let sy = view.position.y + sfs * 0.35 - (sl.length - 1) * sfs * 0.6;
        for (const line of sl) { ctx.fillText(line, view.position.x, sy); sy += sfs * 1.2; }
        if (subCharging) ctx.restore();
        ctx.restore();
      }
    }
    ctx.restore();
  }

  // The charge line: it grows across the blob, then glows when ready.
  if (ch) {
    const b = ch.hit.body;
    const cx = b.position.x + (ch.hit.subBody ? ch.hit.subBody.position.x : 0);
    const cy = b.position.y + (ch.hit.subBody ? ch.hit.subBody.position.y : 0);
    const half = (ch.hit.subBody ? ch.hit.subBody.circleRadius : b.plugin.shape.w / 2) * 1.25;
    const dx = Math.cos(ch.angle), dy = Math.sin(ch.angle);
    const sx = cx - dx * half, sy = cy - dy * half;
    const full = chargeK >= 1;
    const flicker = ch.blocked && Math.random() < 0.35;
    ctx.save();
    ctx.lineCap = "round";
    ctx.shadowColor = ch.blocked ? c.muted : c.accent;
    ctx.shadowBlur = full ? 18 + 6 * Math.sin(ts / 60) : 10 * chargeK;
    ctx.strokeStyle = ch.blocked ? rgba(c.muted, flicker ? 0.2 : 0.9) : (full ? "#fff" : c.accent);
    ctx.lineWidth = full ? 4 : 2 + 2 * chargeK;
    if (ch.broken) ctx.setLineDash([6, 8]);
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + dx * 2 * half * chargeK, sy + dy * 2 * half * chargeK); ctx.stroke();
    ctx.restore();
    // Sparks pulled toward the line.
    if (!reduceMotion() && !ch.blocked && Math.random() < 0.7) {
      const a = Math.random() * Math.PI * 2, d = half * (0.8 + Math.random() * 0.6);
      jar.sparks.push({ x: cx + Math.cos(a) * d, y: cy + Math.sin(a) * d, tx: sx + dx * 2 * half * Math.random() * chargeK, ty: sy + dy * 2 * half * Math.random() * chargeK, t0: ts });
    }
  }
  jar.sparks = jar.sparks.filter(s => ts - s.t0 < 380);
  ctx.fillStyle = c.accent;
  for (const s of jar.sparks) {
    const k = (ts - s.t0) / 380;
    ctx.globalAlpha = 1 - k;
    ctx.beginPath(); ctx.arc(s.x + (s.tx - s.x) * k, s.y + (s.ty - s.y) * k, 1.8, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Slice pieces fall and fade; the blade leaves a bright streak.
  for (const p of jar.pieces) {
    const k = Math.min(1, (performance.now() - p.plugin.t0) / 1600);
    ctx.globalAlpha = 1 - k;
    ctx.beginPath();
    p.vertices.forEach((v, i) => i ? ctx.lineTo(v.x, v.y) : ctx.moveTo(v.x, v.y));
    ctx.closePath();
    ctx.fillStyle = c.surface; ctx.fill();
    ctx.fillStyle = rgba(p.plugin.color, 0.35); ctx.fill();
    ctx.strokeStyle = rgba(p.plugin.color, 0.9); ctx.lineWidth = 2; ctx.stroke();
  }
  ctx.globalAlpha = 1;
  jar.flashes = jar.flashes.filter(f => performance.now() - f.t0 < 320);
  for (const f of jar.flashes) {
    const k = (performance.now() - f.t0) / 320;
    const dx = Math.cos(f.a), dy = Math.sin(f.a), L = f.len * (0.6 + k);
    ctx.save();
    ctx.globalAlpha = 1 - k;
    ctx.strokeStyle = "#fff"; ctx.shadowColor = c.accent; ctx.shadowBlur = 20; ctx.lineWidth = 5 * (1 - k) + 1; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(f.x - dx * L / 2, f.y - dy * L / 2); ctx.lineTo(f.x + dx * L / 2, f.y + dy * L / 2); ctx.stroke();
    ctx.restore();
  }
  for (const d of jar.drops) {
    ctx.globalAlpha = 1 - (performance.now() - d.t0) / 700;
    ctx.fillStyle = rgba(d.c, 0.8);
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Finished to-dos (done from the list) pop.
  jar.pops = jar.pops.filter(p => ts - p.t0 < 500);
  for (const p of jar.pops) {
    const k = (ts - p.t0) / 500;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 + k * 0.8), 0, Math.PI * 2);
    ctx.strokeStyle = rgba(p.c, 1 - k); ctx.lineWidth = 3 * (1 - k) + 1; ctx.stroke();
  }

  if (!bodies.length) {
    ctx.font = `600 15px ${c.sans}`; ctx.fillStyle = c.muted; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(state.tasks.length ? "Nothing open. Enjoy it." : "Add your first to-do above. It will drop in here.", W / 2, H / 2);
  }
}

function jarLoop(ts) {
  if (!jar.wrap?.isConnected) { jar.raf = 0; return; } // paused while you are in the steps
  jar.raf = requestAnimationFrame(jarLoop);
  if (document.hidden || !jar.w) return;
  for (const b of jar.bodies.values()) stepPocket(b);
  Matter.Engine.update(jar.engine, 1000 / 60);
  stepEffects(ts);
  drawJar(ts);
}
function startJar() {
  if (!jar.raf) jar.raf = requestAnimationFrame(jarLoop);
}
// Time sensitivity changes as the clock moves, so weights are refreshed now and then.
setInterval(() => { if (jar.wrap?.isConnected) syncJar(); }, 30000);

/* ─── THE GARDEN ────────────────────────────────────────────── */
// Every sliced to-do lands here as two pieces. They pile up into a living
// floor (Matter.js), and four trees grow out of it. Each slice feeds one tree.
const GARDEN_SEEN_KEY = "sharp-axe-garden-seen";
const GARDEN_MAX_SLICES = 75; // 150 pieces; older slices become soil
const garden = {
  engine: null, wrap: null, canvas: null, ctx: null, tip: null,
  w: 0, h: 0, dpr: 1, pieces: [], queue: [], walls: [], soil: 0,
  roots: {}, grow: {}, raf: 0, built: false, hover: null,
};

function seeded(seed) {
  let s = seed >>> 0 || 1;
  return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
}

function ensureGarden() {
  if (garden.engine || !HAS_PHYSICS) return;
  if (!jar.colors.ink) readJarColors();
  // Settled pieces sleep, so a still pile costs almost nothing.
  garden.engine = Matter.Engine.create({ gravity: { x: 0, y: 1, scale: 0.001 }, enableSleeping: true });
  garden.canvas = el("canvas", { role: "img", "aria-label": "Your garden: pieces of every finished to-do, with four trees growing from them." });
  garden.tip = el("div", { class: "jar-tip" });
  garden.wrap = el("div", { class: "jar garden-jar" }, [garden.canvas, garden.tip]);
  garden.ctx = garden.canvas.getContext("2d");
  new ResizeObserver(() => gardenResize()).observe(garden.wrap);
  garden.canvas.addEventListener("pointermove", (e) => {
    const r = garden.canvas.getBoundingClientRect(), p = { x: e.clientX - r.left, y: e.clientY - r.top };
    const hit = Matter.Query.point(garden.pieces, p)[0];
    garden.hover = hit ? { piece: hit, p } : null;
    if (!hit) { garden.tip.style.opacity = "0"; return; }
    const g = hit.plugin.slice;
    garden.tip.replaceChildren(
      el("strong", { text: g.text }),
      el("div", { text: `Sliced ${new Date(g.slicedAt).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" })}` }),
      el("div", { class: "tip-dim", text: `Fed the ${g.tree} tree${g.isSub ? " · a sub-bubble" : ""}` }),
    );
    garden.tip.style.left = `${Math.min(p.x + 14, garden.w - 250)}px`;
    garden.tip.style.top = `${Math.max(4, p.y - 70)}px`;
    garden.tip.style.opacity = "1";
  });
  garden.canvas.addEventListener("pointerleave", () => { garden.tip.style.opacity = "0"; });
  // Poke a piece to make it hop.
  garden.canvas.addEventListener("pointerdown", (e) => {
    const r = garden.canvas.getBoundingClientRect(), p = { x: e.clientX - r.left, y: e.clientY - r.top };
    const hit = Matter.Query.point(garden.pieces, p)[0];
    if (hit) { Matter.Sleeping.set(hit, false); Matter.Body.setVelocity(hit, { x: (Math.random() - 0.5) * 4, y: -7 }); }
  });
}

function gardenResize() {
  const r = garden.wrap.getBoundingClientRect();
  if (!r.width || !r.height) return;
  garden.w = r.width; garden.h = r.height;
  garden.dpr = window.devicePixelRatio || 1;
  garden.canvas.width = Math.round(garden.w * garden.dpr);
  garden.canvas.height = Math.round(garden.h * garden.dpr);
  buildGarden(true);
}

// Make the pieces from the garden list. Older slices become a soil band.
function buildGarden(force = false) {
  if (!garden.engine || !garden.w) return;
  const { Bodies, Composite } = Matter;
  const slices = state.garden;
  const key = `${slices.length}:${slices[slices.length - 1]?.id}:${garden.w}:${garden.h}`;
  if (!force && garden.built === key) return;
  garden.built = key;
  Composite.clear(garden.engine.world, false);
  garden.pieces = []; garden.queue = [];
  const older = Math.max(0, slices.length - GARDEN_MAX_SLICES);
  garden.soil = older ? Math.min(90, 10 + Math.sqrt(older) * 5) : 6;
  const W = garden.w, H = garden.h, T = 80, o = { isStatic: true, friction: 0.6 };
  garden.walls = [
    Bodies.rectangle(W / 2, H - garden.soil + T / 2, W + 2 * T, T, o),
    Bodies.rectangle(-T / 2, H / 2, T, H * 3, o),
    Bodies.rectangle(W + T / 2, H / 2, T, H * 3, o),
  ];
  Composite.add(garden.engine.world, garden.walls);
  const k = Math.max(0.6, Math.min(1, W / 700));
  slices.slice(-GARDEN_MAX_SLICES).forEach((g, i) => {
    const rnd = seeded(hashStr(String(g.id)));
    const r = (g.isSub ? 9 : 13 + 11 * lenOf(g.duration || 30)) * k;
    const N = 12;
    const pts = Array.from({ length: N }, (_, j) => {
      const a = (j / N) * Math.PI * 2;
      const rr = r * (0.85 + rnd() * 0.25);
      return { x: Math.cos(a) * rr, y: Math.sin(a) * rr };
    });
    const { halves } = splitPolygon(pts, { x: 0, y: 0 }, rnd() * Math.PI);
    const x = 30 + rnd() * (W - 60);
    halves.forEach((h, j) => garden.queue.push({ h, x: x + (j ? 6 : -6), slice: g }));
  });
}

function spawnGardenPieces() {
  const { Bodies, Composite } = Matter;
  for (let n = 0; n < 4 && garden.queue.length; n++) {
    const q = garden.queue.shift();
    const cx = q.h.reduce((a, p) => a + p.x, 0) / q.h.length, cy = q.h.reduce((a, p) => a + p.y, 0) / q.h.length;
    const piece = Bodies.fromVertices(q.x + cx, -30 - Math.random() * 60, [q.h.map(p => ({ x: p.x, y: p.y }))], {
      friction: 0.8, restitution: 0.15, frictionAir: 0.01, density: 0.002,
    });
    if (!piece) continue;
    Matter.Body.setAngle(piece, Math.random() * Math.PI * 2);
    piece.plugin.slice = q.slice;
    piece.plugin.seed = Math.random() * 10;
    garden.pieces.push(piece);
    Composite.add(garden.engine.world, piece);
  }
}

// How many slices each tree has. Trees grow from the previous count to the
// new one with a short animation, so you can see what changed since last time.
function treeCounts() {
  const c = Object.fromEntries(TREES.map(t => [t, 0]));
  state.garden.forEach(g => { if (c[g.tree] != null) c[g.tree]++; });
  return c;
}
function startTreeGrowth() {
  let seen = {};
  try { seen = JSON.parse(localStorage.getItem(GARDEN_SEEN_KEY) || "{}"); } catch {}
  const now = performance.now(), counts = treeCounts();
  TREES.forEach(t => { garden.grow[t] = { from: Math.min(seen[t] ?? counts[t], counts[t]), to: counts[t], t0: now + 700 }; });
  try { localStorage.setItem(GARDEN_SEEN_KEY, JSON.stringify(counts)); } catch {}
}
function treeSize(name, ts) {
  const g = garden.grow[name];
  if (!g) return treeCounts()[name];
  const k = Math.max(0, Math.min(1, (ts - g.t0) / 1600));
  const e = 1 - Math.pow(1 - k, 3);
  return g.from + (g.to - g.from) * e;
}

// Height of the pile under x, so trees stand on top of it.
function pileTop(x) {
  let top = garden.h - garden.soil;
  for (const p of garden.pieces) {
    const b = p.bounds;
    if (b.min.x < x + 14 && b.max.x > x - 14 && p.speed < 1.5) top = Math.min(top, b.min.y + 4);
  }
  return top;
}

function drawTree(ctx, name, x, y, n, ts, c) {
  const rnd = seeded(hashStr(name));
  const H = garden.h;
  const trunk = Math.min(H * 0.24, 14 + 9 * Math.sqrt(n));
  const depth = Math.min(6, Math.floor(1 + Math.log2(n + 1) * 1.4));
  const width = Math.min(12, 2 + Math.sqrt(n) * 1.3);
  const spread = 0.35 + rnd() * 0.25;
  const leafColor = c.good;
  const leaves = [];
  const branch = (x0, y0, ang, len, w, d) => {
    const sway = reduceMotion() ? 0 : Math.sin(ts / 1400 + d * 0.7 + x0 * 0.01) * 0.035 * d;
    const a = ang + sway;
    const x1 = x0 + Math.cos(a) * len, y1 = y0 + Math.sin(a) * len;
    ctx.strokeStyle = c.trunk; ctx.lineWidth = Math.max(1, w); ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    if (d >= depth) { leaves.push([x1, y1, d]); return; }
    const kids = d >= 2 && d <= 3 && rnd() < 0.35 ? 3 : 2;
    for (let i = 0; i < kids; i++) {
      const off = (i - (kids - 1) / 2) * spread * 2 + (rnd() - 0.5) * 0.25;
      branch(x1, y1, a + off, len * (0.68 + rnd() * 0.12), w * 0.68, d + 1);
    }
    if (d >= depth - 2) leaves.push([x1, y1, d]);
  };
  branch(x, y, -Math.PI / 2 + (rnd() - 0.5) * 0.1, trunk, width, 1);
  const leafR = Math.min(9, 3 + Math.sqrt(n) * 0.9);
  leaves.forEach(([lx, ly], i) => {
    const bob = reduceMotion() ? 0 : Math.sin(ts / 700 + i) * 1.2;
    ctx.fillStyle = rgba(leafColor, 0.55 + 0.35 * ((i * 37) % 10) / 10);
    ctx.beginPath(); ctx.arc(lx, ly + bob, leafR * (0.8 + ((i * 13) % 5) / 10), 0, Math.PI * 2); ctx.fill();
  });
  if (n === 0) {
    ctx.fillStyle = rgba(leafColor, 0.8);
    ctx.beginPath(); ctx.ellipse(x - 4, y - 8, 4, 2.5, -0.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + 4, y - 9, 4, 2.5, 0.6, 0, Math.PI * 2); ctx.fill();
  }
}

function drawGarden(ts) {
  const ctx = garden.ctx, c = { ...jar.colors }, W = garden.w, H = garden.h;
  c.trunk = "#8a5a3b";
  ctx.setTransform(garden.dpr, 0, 0, garden.dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, rgba(c.q2, 0.08));
  sky.addColorStop(1, rgba(c.good, 0.08));
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  // Soil (older slices pressed down).
  ctx.fillStyle = "rgba(120, 82, 52, 0.55)";
  ctx.fillRect(0, H - garden.soil, W, garden.soil);

  // Trees grow from the top of the pile.
  TREES.forEach((name, i) => {
    const x = W * (0.13 + i * 0.247);
    const target = pileTop(x);
    garden.roots[name] = garden.roots[name] == null ? target : garden.roots[name] + (target - garden.roots[name]) * 0.05;
    drawTree(ctx, name, x, garden.roots[name], treeSize(name, ts), ts, c);
  });

  // Pieces: wobbly, coloured by importance.
  for (const p of garden.pieces) {
    const g = p.plugin.slice, col = g.importance ? importanceColor(g.importance) : ({ q1: c.q1, q2: c.q2, quick: c.quick, q4: c.q4 }[g.quadrant] || c.muted);
    const s = p.plugin.seed, cx = p.position.x, cy = p.position.y;
    ctx.beginPath();
    p.vertices.forEach((v, i) => {
      const k = reduceMotion() ? 1 : 1 + 0.04 * Math.sin(ts / 500 + s + i * 1.7);
      const x = cx + (v.x - cx) * k, y = cy + (v.y - cy) * k;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.closePath();
    ctx.fillStyle = c.surface; ctx.fill();
    ctx.fillStyle = rgba(col, garden.hover?.piece === p ? 0.55 : 0.32); ctx.fill();
    ctx.strokeStyle = rgba(col, 0.85); ctx.lineWidth = 1.5; ctx.stroke();
  }

  // Tree labels sit on the soil.
  ctx.font = `800 12px ${c.head}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const counts = treeCounts();
  TREES.forEach((name, i) => {
    const x = W * (0.13 + i * 0.247), y = H - 14;
    const label = `${name} · ${counts[name]}`;
    const tw = ctx.measureText(label).width + 16;
    ctx.fillStyle = rgba(c.surface, 0.9);
    ctx.beginPath(); ctx.roundRect?.(x - tw / 2, y - 10, tw, 20, 10); ctx.fill();
    ctx.fillStyle = c.ink; ctx.fillText(label, x, y + 1);
  });

  if (!state.garden.length) {
    ctx.font = `600 15px ${c.sans}`; ctx.fillStyle = c.muted;
    ctx.fillText("Slice your first to-do to plant the garden.", W / 2, H * 0.4);
  }
}

function gardenLoop(ts) {
  if (!garden.wrap?.isConnected) { garden.raf = 0; return; }
  garden.raf = requestAnimationFrame(gardenLoop);
  if (document.hidden || !garden.w) return;
  spawnGardenPieces();
  // Still alive: now and then a piece gives a little hop.
  if (!reduceMotion() && garden.pieces.length && Math.random() < 0.03) {
    const p = garden.pieces[Math.floor(Math.random() * garden.pieces.length)];
    Matter.Sleeping.set(p, false);
    Matter.Body.setVelocity(p, { x: (Math.random() - 0.5) * 1.5, y: -1.5 - Math.random() * 2 });
  }
  Matter.Engine.update(garden.engine, 1000 / 60);
  drawGarden(ts);
}

/* ---- progress numbers ---- */
function dayKey(ms) { return isoOf(new Date(ms)); }
function gardenStats() {
  const g = state.garden, now = Date.now();
  const weekAgo = now - 7 * 86400e3;
  const days = new Set(g.map(x => dayKey(x.slicedAt)));
  let streak = 0;
  for (let d = new Date(); ; d = addDays(d, -1)) {
    if (days.has(isoOf(d))) streak++;
    else if (streak || isoOf(d) !== todayISO()) break; // today can still be empty
  }
  const withDue = g.filter(x => x.onTime != null);
  const byDay = Array.from({ length: 14 }, (_, i) => {
    const d = addDays(new Date(), i - 13), k = isoOf(d);
    return { label: d.toLocaleDateString(undefined, { weekday: "narrow" }), date: k, n: g.filter(x => dayKey(x.slicedAt) === k).length };
  });
  const tags = new Map();
  g.forEach(x => (x.tags || []).forEach(t => tags.set(t, (tags.get(t) || 0) + 1)));
  return {
    total: g.length,
    week: g.filter(x => x.slicedAt >= weekAgo).length,
    streak,
    onTime: withDue.filter(x => x.onTime).length, withDue: withDue.length,
    focus: g.reduce((n, x) => n + (x.focusMin || 0), 0),
    byDay, tags: [...tags.entries()].sort((a, b) => b[1] - a[1]).slice(0, 8),
  };
}

function renderGarden() {
  const s = gardenStats();
  const wrap = el("div", {}, [
    el("div", { class: "phase-header" }, [
      el("h1", { class: "phase-title", text: "Your garden" }),
      el("p", { class: "phase-sub", text: "Every to-do you slice falls here. The pieces build the ground, and your trees grow from them." }),
    ]),
  ]);
  if (HAS_PHYSICS) {
    ensureGarden();
    wrap.appendChild(garden.wrap);
    setTimeout(() => {
      if (!garden.w) gardenResize(); else buildGarden();
      startTreeGrowth();
      if (!garden.raf) garden.raf = requestAnimationFrame(gardenLoop);
    }, 0);
  }

  const stat = (v, label) => el("div", { class: "stat" }, [el("div", { class: "stat-value", text: String(v) }), el("div", { class: "stat-label", text: label })]);
  wrap.appendChild(el("div", { class: "stats-banner garden-stats" }, [
    stat(s.week, "Sliced this week"),
    stat(s.streak, s.streak === 1 ? "Day in a row" : "Days in a row"),
    stat(s.withDue ? `${s.onTime}/${s.withDue}` : "–", "Done before due"),
    stat(s.focus ? minutesText(s.focus) : "–", "Focus time"),
    stat(s.total, "All time"),
  ]));

  const max = Math.max(1, ...s.byDay.map(d => d.n));
  wrap.appendChild(el("div", { class: "section" }, [
    el("span", { class: "section-label", text: "Last 14 days" }),
    el("div", { class: "day-bars" }, s.byDay.map(d => el("div", { class: "day-bar", title: `${d.date}: ${plural(d.n, "slice")}` }, [
      el("div", { class: "day-bar-fill", style: { height: `${(d.n / max) * 100}%` } }),
      el("span", { text: d.label }),
    ]))),
  ]));

  const counts = treeCounts();
  wrap.appendChild(el("div", { class: "section" }, [
    el("span", { class: "section-label", text: "Trees" }),
    el("div", { class: "hint", text: "Each slice feeds one tree. For now the tree is picked at random." }),
    el("div", { class: "tree-chips" }, TREES.map(t => el("span", { class: "badge", style: { "--c": "var(--good)" }, text: `🌳 ${t}: ${counts[t]}` }))),
  ]));

  if (s.tags.length) {
    const tmax = s.tags[0][1];
    wrap.appendChild(el("div", { class: "section" }, [
      el("span", { class: "section-label", text: "Slices by tag" }),
      ...s.tags.map(([t, n]) => el("div", { class: "tag-bar" }, [
        el("span", { text: `#${t}` }),
        el("div", { class: "fill-track", style: { width: "100%" } }, [el("div", { style: { width: `${(n / tmax) * 100}%` } })]),
        el("span", { text: String(n) }),
      ])),
    ]));
  }

  const recent = state.garden.slice(-25).reverse();
  wrap.appendChild(el("div", { class: "section" }, [
    el("span", { class: "section-label", text: "Recent slices" }),
    recent.length ? el("div", { class: "task-list" }, recent.map(g => {
      const t = taskById(g.taskId);
      const when = new Date(g.slicedAt).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
      return el("details", { class: "slice-row" }, [
        el("summary", {}, [
          el("span", { class: "up-text", text: g.isSub ? `${g.text} (part of ${t?.text || "a to-do"})` : g.text }),
          g.onTime == null ? null : el("span", { class: `badge ${g.onTime ? "calm" : "past"}`, text: g.onTime ? "Before due" : "After due" }),
          el("span", { class: "badge", style: { "--c": "var(--good)" }, text: g.tree }),
          el("span", { class: "hint", style: { margin: 0 }, text: when }),
        ]),
        el("div", { class: "slice-more" }, [
          g.details || t?.details ? el("p", { text: g.details || t.details }) : el("p", { class: "hint", text: "No details were written." }),
          g.focusMin ? el("p", { text: `Focus time: ${minutesText(g.focusMin)}` }) : null,
          t && !g.isSub ? historyBlock(t) : null,
        ]),
      ]);
    })) : el("div", { class: "empty small", text: "Nothing sliced yet. Go slice something!" }),
  ]));
  return wrap;
}

function openGarden() {
  _view = "garden";
  _openFor = null;
  render(true);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ---- home editor, list rows, and the page ---- */
// "Must finish first": chips you can remove, plus a menu to add one.
function linksEditor(t) {
  const firsts = (t.after || []).map(taskById).filter(Boolean);
  const options = state.tasks.filter(x => !x.done && x.id !== t.id && !(t.after || []).includes(x.id) && !dependsOn(x, t));
  const add = el("select", {
    "aria-label": "Add a to-do that must be finished first",
    onchange: (e) => { const p = taskById(Number(e.target.value)); if (p && addLink(p, t)) render(); },
  }, [el("option", { value: "", text: options.length ? "+ Add one…" : "No other open to-dos" }),
      ...options.map(x => el("option", { value: String(x.id), text: x.text }))]);
  return el("div", {}, [
    el("span", { class: "section-label", text: "Must finish first" }),
    el("div", { class: "controls" }, [
      ...firsts.map(p => el("span", { class: `badge ${p.done ? "" : "lock"}` }, [
        `${p.done ? "✓" : "🔒"} ${p.text} `,
        el("button", { class: "badge-x", type: "button", "aria-label": `Remove link to ${p.text}`, html: SVG.x,
          onclick: () => { removeLink(p, t); render(); } }),
      ])),
      add,
    ]),
  ]);
}

// "Due": the deadline. Date, plus an optional time.
function dueFields(x, owner, label) {
  const change = () => {
    logEvent(owner, "due changed", `${label}${x.dueDate ? `${x.dueDate}${x.dueTime ? " " + x.dueTime : ""}` : "no due date"}`);
    saveState(); render();
  };
  return [
    el("input", { type: "date", "aria-label": "Due date", value: x.dueDate || "", onchange: (e) => { x.dueDate = e.target.value; if (!x.dueDate) x.dueTime = ""; change(); } }),
    el("input", { type: "time", "aria-label": "Due time (optional)", value: x.dueTime || "", onchange: (e) => { x.dueTime = e.target.value; if (x.dueTime && !x.dueDate) x.dueDate = todayISO(); change(); } }),
  ];
}
function durationSelect(x, owner, options = DURATIONS) {
  const sel = el("select", { "aria-label": "Takes about", onchange: (e) => {
    x.duration = Number(e.target.value);
    logEvent(owner, "takes about", `${owner === x ? "" : x.text + ": "}${durLabel(x.duration)}`);
    saveState(); render();
  } }, options.map(m => el("option", { value: String(m), text: durLabel(m) })));
  sel.value = String(x.duration || options[1]);
  return sel;
}
// A live "Overdue in …" line.
function dueLine(x) {
  const i = dueInfo(x);
  return el("div", { class: "due-line" }, i
    ? [el("span", { class: `badge ${i.cls}`, "data-due": String(x.id), "data-long": "1", text: i.long })]
    : [el("span", { class: "hint", style: { margin: 0 }, text: "No due date. Add one to see a countdown." })]);
}

const SUB_DURATIONS = [5, 10, 15, 30, 45, 60, 90, 120];
let _subDetailsOpen = null;
function subBubblesEditor(t) {
  const list = el("div", { class: "subs" });
  t.steps.forEach((s, i) => {
    const open = _subDetailsOpen === s.id;
    const locked = subLocked(t, s);
    list.appendChild(el("div", { class: `sub-row ${s.done ? "done" : ""} ${locked ? "locked" : ""} ${t.inOrder && nextSub(t) === s ? "next" : ""}` }, [
      el("div", { class: "sub-top" }, [
        el("span", { class: "sub-num", text: locked ? "🔒" : String(i + 1), title: locked ? lockedSubMsg(t, s) : `Part ${i + 1}` }),
        el("span", {
          class: "check-circle", role: "checkbox", "aria-checked": String(s.done), tabindex: "0",
          title: s.done ? "Not done after all" : locked ? lockedSubMsg(t, s) : "Slice it (done)", html: s.done ? SVG.check : "",
          onclick: (e) => s.done ? (setSubDone(t, s, false), saveState(), render()) : sliceSub(t, s, e.currentTarget),
          onkeydown: (e) => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); e.currentTarget.click(); } },
        }),
        el("input", { type: "text", class: "sub-text", value: s.text, "aria-label": "Sub-bubble",
          oninput: (e) => { s.text = e.target.value; saveState(); } }),
        dueInfo(s) && !s.done ? el("span", { class: `badge ${dueInfo(s).cls}`, text: dueInfo(s).short }) : null,
        el("button", { class: "icon-btn", type: "button", title: "Move up", "aria-label": `Move part ${i + 1} up`, html: SVG.up,
          disabled: i === 0, onclick: () => moveSub(t, s, -1) }),
        el("button", { class: "icon-btn", type: "button", title: "Move down", "aria-label": `Move part ${i + 1} down`, html: SVG.down,
          disabled: i === t.steps.length - 1, onclick: () => moveSub(t, s, 1) }),
        el("button", { class: `icon-btn ${open ? "on" : ""}`, type: "button", title: "Due, time and details", "aria-label": "More", html: SVG.edit,
          onclick: () => { _subDetailsOpen = open ? null : s.id; render(); } }),
        el("button", { class: "icon-btn danger", type: "button", "aria-label": "Remove sub-bubble", html: SVG.x,
          onclick: () => { t.steps = t.steps.filter(x => x.id !== s.id); logEvent(t, "sub removed", s.text); saveState(); render(); } }),
      ]),
      open ? el("div", { class: "sub-more" }, [
        el("div", { class: "controls" }, [el("span", { class: "mini-label", text: "Due" }), ...dueFields(s, t, `${s.text}: `),
          el("span", { class: "mini-label", text: "Takes about" }), durationSelect(s, t, SUB_DURATIONS)]),
        dueInfo(s) ? dueLine(s) : null,
        el("textarea", { class: "sub-details", placeholder: "Details for this part…", value: s.details || "",
          oninput: (e) => { s.details = e.target.value; saveState(); } }),
      ]) : null,
    ]));
  });
  const inputId = "sub-input";
  const add = () => {
    const v = ($(`#${inputId}`)?.value || "").trim();
    if (!v) return;
    t.steps.push(normalizeStep({ text: v }));
    logEvent(t, "sub added", v);
    saveState(); render();
    setTimeout(() => $(`#${inputId}`)?.focus(), 0);
  };
  return el("div", {}, [
    el("span", { class: "section-label", text: `Sub-bubbles${t.steps.length ? ` (${t.steps.filter(x => x.done).length}/${t.steps.length} done)` : ""}` }),
    el("div", { class: "hint", text: "Break it into smaller parts, in order. They float inside the bubble like a string of beads, and you can slice each one." }),
    t.steps.length > 1 ? el("label", { class: "check-line", style: { marginBottom: "8px" } }, [
      el("input", { type: "checkbox", checked: t.inOrder, onchange: (e) => {
        t.inOrder = e.target.checked;
        logEvent(t, "in order", t.inOrder ? "on" : "off");
        saveState(); render();
      } }),
      "Do these in order (later parts lock until the earlier ones are done)",
    ]) : null,
    list,
    el("div", { class: "input-row", style: { margin: 0 } }, [
      el("input", { type: "text", id: inputId, placeholder: t.steps.length ? "Add another part…" : "First small part? (for example: open the file)",
        onkeydown: (e) => { if (e.key === "Enter") add(); } }),
      el("button", { class: "btn btn-sm", type: "button", html: SVG.plus, "aria-label": "Add sub-bubble", onclick: add }),
    ]),
  ]);
}

const HISTORY_LABEL = {
  created: "Created", "importance": "Importance", "due changed": "Due date", "takes about": "Takes about",
  tags: "Tags", details: "Details edited", "sub added": "Sub-bubble added", "sub removed": "Sub-bubble removed",
  "sub sliced": "Sub-bubble sliced", "sub reopened": "Sub-bubble reopened", "sub moved": "Sub-bubble moved", "in order": "In order", linked: "Linked", sliced: "Sliced (done)",
  reopened: "Reopened", renamed: "Renamed",
};
function historyBlock(t) {

  const when = (ms) => new Date(ms).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  return el("details", { class: "history" }, [
    el("summary", { text: `History (${items.length})${t.focusMin ? ` · ${minutesText(t.focusMin)} focused` : ""}` }),
    el("ol", { class: "history-list" }, items.length
      ? items.map(h => el("li", {}, [
          el("span", { class: "history-when", text: when(h.at) }),
          el("span", {}, [el("strong", { text: HISTORY_LABEL[h.type] || h.type }), h.detail ? ` · ${h.detail}` : ""]),
        ]))
      : [el("li", { class: "hint", text: "Nothing yet." })]),
  ]);
}

  textIn.addEventListener("change", () => { logEvent(t, "renamed", t.text); saveState(); syncJar(); });
  const blocked = waitingOn(t);
  const details = el("textarea", { class: "details-box", placeholder: "Explain this to-do: what done looks like, links, notes to yourself…",
    value: t.details || "", oninput: (e) => { t.details = e.target.value; saveState(); } });
  details.addEventListener("change", () => { logEvent(t, "details", t.details.slice(0, 60)); saveState(); });
  return el("div", { class: "home-editor" }, [
    textIn,
    el("div", {}, [
      el("span", { class: "section-label", text: "How important? 1 = low, 7 = very" }),

function setHomeMode(mode) {
  if (mode === "bubbles" && !HAS_PHYSICS) { toast("The physics library did not load. Showing the list.", "error"); mode = "list"; }
  _homeMode = mode;
  try { localStorage.setItem(HOME_MODE_KEY, mode); } catch {}
  render();
}

function renderHome() {
  const bubbles = _homeMode === "bubbles" && HAS_PHYSICS;
  const wrap = el("div", {}, [
    el("div", { class: "phase-header" }, [
      el("h1", { class: "phase-title", text: "My to-dos" }),
      el("p", { class: "phase-sub", text: bubbles
        ? "Light to-dos float up. Heavy ones sink: less important, less urgent, and longer. Bigger blob = takes longer."
        : "The most important and most urgent things come first." }),
    ]),
  ]);
  const input = taskInput("home-input", "Add a to-do… #friends for a tag, !6 for importance", (text) => addTask(text));
  input.classList.add("home-input");
  wrap.appendChild(input);

  const open = state.tasks.filter(t => !t.done).sort(homeCompare);
  const tags = tagNames().filter(n => open.some(t => hasTag(t, n)));
  if (_groupTag && !tags.some(n => sameBucket(n, _groupTag))) _groupTag = "";

  wrap.appendChild(el("div", { class: "home-bar" }, [
    el("div", { class: "seg", "aria-label": "View" }, [
      el("button", { type: "button", class: bubbles ? "active" : "", text: "Bubbles", onclick: () => setHomeMode("bubbles") }),
      el("button", { type: "button", class: bubbles ? "" : "active", text: "List", onclick: () => setHomeMode("list") }),
    ]),
    bubbles ? el("div", { class: "seg", "aria-label": "Tool" }, [
      el("button", { type: "button", class: _tool === "move" ? "active" : "", text: "Move", title: "Drag blobs. Tap one to edit it.",
        onclick: () => { _tool = "move"; _linkFrom = null; render(); } }),
      el("button", { type: "button", class: _tool === "link" ? "active" : "", text: "Link", title: "Connect a to-do to one that must wait for it",
        onclick: () => { _tool = "link"; render(); } }),
    ]) : el("div", { class: "seg", "aria-label": "Sort" }, [
      el("button", { type: "button", class: _homeSort === "importance" ? "active" : "", text: "Most important", onclick: () => { _homeSort = "importance"; render(); } }),
      el("button", { type: "button", class: _homeSort === "soonest" ? "active" : "", text: "Soonest", onclick: () => { _homeSort = "soonest"; render(); } }),
    ]),
    el("span", { class: "hint", style: { margin: 0 }, text: plural(open.length, "to-do") }),
  ]));

  if (tags.length) {
    wrap.appendChild(el("div", { class: "tag-row" }, [
      el("span", { class: "hint", style: { margin: 0 }, text: bubbles ? "Group:" : "Show:" }),
      el("button", { type: "button", class: `tag-chip ${_groupTag ? "" : "active"}`, text: "All", onclick: () => { _groupTag = ""; render(); } }),
      ...tags.map(n => el("button", {
        type: "button", class: `tag-chip ${sameBucket(n, _groupTag) ? "active" : ""}`, text: `#${n}`,
        onclick: () => { _groupTag = sameBucket(n, _groupTag) ? "" : n; render(); },
      })),
    ]));
  }

  if (bubbles && _tool === "link") {
    wrap.appendChild(el("div", { class: "hint link-hint", text: _linkFrom
      ? `Now tap the to-do that waits for “${taskById(_linkFrom)?.text}”. Tap empty space to cancel.`
      : "Link: drag from the to-do to finish first onto the one that waits. Or tap one, then the other." }));
  }

  const strip = nowStrip();
  if (strip) wrap.appendChild(strip);

  if (bubbles) {
    ensureJar();
    wrap.appendChild(jar.wrap);
    // Wait until the jar is on the page, then match it to the list and run.
    setTimeout(() => { if (!jar.w) jarResize(); else syncJar(); startJar(); }, 0);
    const t = _openFor && taskById(_openFor);
    if (t && !t.done) {
      wrap.appendChild(el("div", { class: "home-row open jar-editor", style: { "--c": importanceColor(importanceOf(t)) } }, [
        el("div", { class: "home-row-top" }, [
          el("span", { class: "up-text", style: { fontWeight: "700" }, text: t.text }),
          el("span", { class: "badge", text: weightReasons(t) }),
        ]),
        homeEditor(t),
      ]));
    }
  } else {
    const shown = _groupTag ? open.filter(t => hasTag(t, _groupTag)) : open;
    if (!shown.length) {
      wrap.appendChild(el("div", { class: "empty", text: state.tasks.length ? "Nothing open. Enjoy it." : "Nothing here yet. Add your first to-do above." }));
    } else {
      const list = el("div", { class: "home-list" });
      shown.forEach(t => list.appendChild(homeRow(t)));
      wrap.appendChild(list);
    }
  }

  const doneTasks = state.tasks.filter(t => t.done);
  if (doneTasks.length) {
    const sec = el("div", { class: "section" }, [
      el("button", { class: "btn btn-sm btn-ghost", type: "button",

        onclick: () => { _homeShowDone = !_homeShowDone; render(); } }),
    ]);
    if (_homeShowDone) {
      const dl = el("div", { class: "task-list", style: { marginTop: "8px" } });
      doneTasks.forEach(t => dl.appendChild(el("div", { class: "up-row done" }, [
        el("span", {
          class: "check-circle", role: "checkbox", "aria-checked": "true", tabindex: "0",
          title: "Not done after all", html: SVG.check,
          onclick: () => { reopenTask(t); saveState(); render(); },
        }),
        el("span", { class: "up-text", text: t.text }),
      ])));
      sec.appendChild(dl);
    }
    wrap.appendChild(sec);
  }

  wrap.appendChild(el("button", { class: "garden-link", type: "button", onclick: openGarden }, [
    el("span", { class: "garden-link-icon", text: "🌱" }),
    el("span", {}, [
      el("strong", { text: "Your garden" }),
      el("span", { class: "hint", style: { margin: 0, display: "block" }, text: state.garden.length
        ? `${plural(state.garden.length, "slice")} so far. See your progress and your trees.`
        : "Slice a to-do (hold down on a bubble) to plant your garden." }),
    ]),
    el("span", { html: ARROW_SVG }),
  ]));

  const started = state.phase > 0;
  wrap.appendChild(el("div", { class: "session-card" }, [
    el("div", { class: "session-card-body" }, [
      el("div", { class: "session-card-title", text: "Feeling overwhelmed?" }),
      el("div", { class: "session-card-sub", text: started
        ? `Your Sharp Axe session is on step ${state.phase + 1}: ${PHASES[state.phase].title}.`
        : "Do a Sharp Axe session: clear your space and mind, sort, schedule, then take one task at a time." }),
    ]),
    el("button", { class: "btn btn-primary", type: "button", html: `<span>${started ? "Continue session" : "Start a session"}</span>${ARROW_SVG}`,
      onclick: () => openSteps() }),
  ]));
  return wrap;
}

function openSteps(i = state.phase) {
  _view = "steps";
  _openFor = null;
  state.phase = Math.max(0, Math.min(PHASES.length - 1, i));
  saveState(); render(true);
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function openHome() {
  if (_view === "home") return;
  _view = "home";
  breath.running && stopBreathing();
  render(true);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ─── ROUTER ────────────────────────────────────────────────── */
function renderPhaseContent() {
  const p = PHASES[state.phase];
  switch (p.type) {
    case "checklist":   return renderChecklist(p);
    case "input-list":  return renderListPhase(p);
    case "matrix":      return renderMatrix(p);
    case "schedule":    return renderSchedule(p);
    case "communicate": return renderCommunicate(p);
    case "triage":      return renderTriage(p);
    case "reflect":     return renderReflect(p);
  }
}

function renderQuote() {
  const slot = $("#quoteSlot");
  slot.innerHTML = "";
  if (state.phase !== PHASES.length - 1) return;
  slot.appendChild(el("div", { class: "quote" }, [
    el("p", { text: `"The mind should not be kept continuously at the same pitch of concentration,` }),
    el("p", { text: `but given amusing diversions. Our minds must relax.` }),
    el("p", { text: `They will rise better, and keener after a rest."` }),
    el("p", { class: "quote-attr", text: "Seneca the Younger" }),
  ]));
}

const ARROW_SVG = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12,5 19,12 12,19"/></svg>`;

function goTo(i) {
  const next = Math.max(0, Math.min(PHASES.length - 1, i));
  if (_view !== "steps") { openSteps(next); return; }
  if (next === state.phase) return;
  state.phase = next;
  _pickId = null;
  saveState(); render(true);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function render(animate = false) {
  renderPips();

  const content = $("#phaseContent");
  content.innerHTML = "";
  content.classList.remove("enter");
  if (animate) { void content.offsetWidth; content.classList.add("enter"); }

  const home = _view === "home" || _view === "garden";
  $("#nav").style.display = home ? "none" : "";
  $("#pips").classList.toggle("on-home", home);
  if (home) {
    content.appendChild(_view === "garden" ? renderGarden() : renderHome());
    $("#quoteSlot").innerHTML = "";
    return;
  }
  content.appendChild(renderPhaseContent());

  const p = PHASES[state.phase];
  if (p.tip) content.appendChild(tipBlock(p.tip));

  const backBtn = $("#backBtn");
  const nextBtn = $("#nextBtn");
  const nextLabel = $("#nextLabel");

  backBtn.lastChild.textContent = state.phase === 0 ? " My to-dos" : " Back";
  backBtn.onclick = () => state.phase === 0 ? openHome() : goTo(state.phase - 1);

  const isLast = state.phase === PHASES.length - 1;
  if (isLast) {
    nextLabel.textContent = "New Session";
    nextBtn.classList.remove("btn-primary");
    nextBtn.classList.add("btn-dark");
    nextBtn.querySelector("svg").outerHTML = SVG.refresh;
    nextBtn.onclick = () => {
      if (confirm("Reset and start a new session? Your current session will be cleared from this browser. (Use Save Session first if you want a copy.)")) {
        state = { ...defaultState(), garden: state.garden };
        saveState(); render(true);
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    };
  } else {
    nextLabel.textContent = state.phase === 0 ? "Begin" : `Next: ${PHASES[state.phase + 1].title}`;
    nextBtn.classList.add("btn-primary");
    nextBtn.classList.remove("btn-dark");
    nextBtn.querySelector("svg").outerHTML = ARROW_SVG;
    nextBtn.onclick = () => goTo(state.phase + 1);
  }

  renderQuote();
}

function downloadBlob(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function timestamp() {
  const d = new Date();
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
}

/* ---- EXPORT TODOS (just the task list, JSON for round-trip) ---- */
function exportTodos() {
  if (state.tasks.length === 0) {
    toast("No todos to export", "error");
    return;
  }
  const payload = {
    type: "sharp-axe-todos",
    version: 2,
    exportedAt: new Date().toISOString(),
    tasks: state.tasks.map(t => ({
      id: t.id,
      text: t.text,
      tags: t.tags || [],
      after: t.after || [],
      quadrant: t.quadrant,
      done: !!t.done,
      scheduledTime: t.scheduledTime || "",
      date: t.date || "",
      duration: t.duration || 30,
      importance: t.importance, inOrder: !!t.inOrder,
      dueDate: t.dueDate || "", dueTime: t.dueTime || "",
      details: t.details || "",
      createdAt: t.createdAt, doneAt: t.doneAt, focusMin: t.focusMin || 0,
      history: t.history || [],
      steps: (t.steps || []).map(({ id, ...rest }) => rest),
    })),
  };
  downloadBlob(
    `sharp-axe-todos_${timestamp()}.json`,
    JSON.stringify(payload, null, 2),
    "application/json"
  );
  toast(`Exported ${plural(state.tasks.length, "todo")}`);
}

/* ---- IMPORT TODOS ---- */
function importTodos() {
  $("#fileInput").click();
}

async function handleFileImport(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    let incoming = [];
    if (Array.isArray(data)) {
      incoming = data;
    } else if (data && Array.isArray(data.tasks)) {
      incoming = data.tasks;
    } else {
      throw new Error("Unrecognized file format");
    }
    // "q3" (the old Delegate box) is no longer used: those tasks come in unsorted.
    // New ids, so links ("must finish first") are moved over to the new ids.
    const valid = incoming.filter(t => t && typeof t.text === "string" && t.text.trim());
    const idMap = new Map();
    const cleaned = valid.map(t => {
      const n = normalizeTask({ ...t, id: null, after: [] });
      if (t.id != null) idMap.set(t.id, n.id);
      return n;
    });
    cleaned.forEach((n, i) => {
      n.after = (Array.isArray(valid[i].after) ? valid[i].after : []).map(id => idMap.get(id)).filter(id => id != null && id !== n.id);
    });
    if (cleaned.length === 0) throw new Error("No tasks found in file");

    let mode = "append";
    if (state.tasks.length > 0) {
      const yes = confirm(
        `Import ${plural(cleaned.length, "todo")}?\n\n` +
        `OK  = Append to your existing ${plural(state.tasks.length, "todo")}\n` +
        `Cancel = Replace all existing todos`
      );
      mode = yes ? "append" : "replace";
    }
    if (mode === "replace") {
      state.tasks = cleaned;
      state.triageOrder = [];
    } else {
      state.tasks = state.tasks.concat(cleaned);
    }
    saveState(); render();
    toast(`Imported ${plural(cleaned.length, "todo")}`);
  } catch (err) {
    toast("Couldn't import: " + (err.message || "invalid file"), "error");
  } finally {
    e.target.value = "";
  }
}

/* ---- SAVE FULL SESSION (readable .txt with everything) ---- */
function downloadFullSession() {
  const lines = [];
  const now = new Date();
  const mark = t => (t.done ? "[x] " : "[ ] ");
  lines.push("==============================================");
  lines.push("           SHARP AXE METHOD: SESSION          ");
  lines.push("==============================================");
  lines.push("");
  lines.push("Saved: " + now.toLocaleString());
  lines.push("");

  ["physical", "mental"].forEach(id => {
    const phase = PHASES.find(p => p.id === id);
    const items = state.checklistItems[id] || [];
    lines.push("--- " + phase.title.toUpperCase() + " ---");
    phase.items.forEach((item, i) => {
      lines.push((items[i] ? "[x] " : "[ ] ") + (typeof item === "string" ? item : item.text));
    });
    lines.push("");
  });

  lines.push("--- BRAIN DUMP ---");
  lines.push((state.mentalDump || "").trim() || "(none)");
  lines.push("");

  lines.push("--- ALL TODOS ---");
  if (state.tasks.length === 0) {
    lines.push("(none captured)");
  } else {
    state.tasks.forEach((t, i) => {
      const extra = [
        ...(t.tags || []).map(x => `#${x}`),
        ...waitingOn(t).map(p => `(after: ${p.text})`),
        t.dueDate ? `(due ${t.dueDate}${t.dueTime ? " " + t.dueTime : ""})` : "",
      ].filter(Boolean).join(" ");
      lines.push(`${i + 1}. ${mark(t)}${t.text}${extra ? `  ${extra}` : ""}`);
      if (t.details) lines.push(`      ${t.details.replace(/\n/g, "\n      ")}`);
      (t.steps || []).forEach(s => lines.push(`      ${s.done ? "[x]" : "[ ]"} ${s.text}`));
    });
  }
  lines.push("");

  lines.push("--- SORTED ---");
  QUADRANTS.forEach(q => {
    const tasks = state.tasks.filter(t => t.quadrant === q.id);
    lines.push(`\n  ${q.label.toUpperCase()} (${q.sub})`);
    if (tasks.length === 0) lines.push("    (none)");
    else tasks.forEach(t => lines.push(`    - ${mark(t)}${t.text}`));
  });
  const unassigned = state.tasks.filter(t => !t.quadrant);
  if (unassigned.length) {
    lines.push("\n  NOT SORTED");
    unassigned.forEach(t => lines.push(`    - ${mark(t)}${t.text}`));
  }
  lines.push("");

  lines.push("--- SCHEDULE ---");
  const scheduled = schedulableTasks();
  if (scheduled.length === 0) {
    lines.push("(no scheduled tasks)");
  } else {
    scheduled.forEach((t, i) => {
      const q = qInfo(t.quadrant);
      const when = whenText(t);
      const tag  = q ? ` [${q.label}]` : "";
      lines.push(`${i + 1}. ${mark(t)}${t.text}${tag}${when ? ` @ ${when}` : ""} (${durLabel(t.duration || 30)})`);
      (t.steps || []).forEach(s => lines.push(`      ${s.done ? "[x]" : "[ ]"} ${s.text}`));
    });
  }
  lines.push("");

  lines.push("--- COMMUNICATE ---");
  lines.push((state.scheduleNotes || "").trim() || "(none)");
  lines.push("");

  const active = state.tasks.filter(t => t.quadrant !== "q4");
  const done = active.filter(t => t.done).length;
  const pct = active.length > 0 ? Math.round((done / active.length) * 100) : 0;
  lines.push("--- TRIAGE ---");
  lines.push(`Completed: ${done} / ${active.length} (${pct}%)`);
  lines.push("");

  lines.push("--- GARDEN ---");
  const gs = gardenStats(), tc = treeCounts();
  lines.push(`Sliced all time: ${gs.total} · this week: ${gs.week} · days in a row: ${gs.streak}`);
  lines.push(`Trees: ${TREES.map(t => `${t} ${tc[t]}`).join(", ")}`);
  lines.push("");

  lines.push("--- REFLECTION ---");
  const refPhase = PHASES.find(p => p.id === "reflect");
  refPhase.questions.forEach(q => {
    lines.push(`Q: ${q}`);
    lines.push(`A: ${state.reflectAnswers[q] || "(not answered)"}`);
    lines.push("");
  });

  lines.push("--- DIG DEEPER: YOUR NOTES ---");
  lines.push((state.reflectNotes || "").trim() || "(none)");
  lines.push("");

  lines.push("==============================================");
  lines.push(`"The mind should not be kept continuously at the same`);
  lines.push(`pitch of concentration, but given amusing diversions.`);
  lines.push(`Our minds must relax. They will rise better, and`);
  lines.push(`keener after a rest."  - Seneca the Younger`);

  downloadBlob(`sharp-axe-session_${timestamp()}.txt`, lines.join("\n"), "text/plain;charset=utf-8");
  toast("Session saved");
}

/* ═══════════════════════════════════════════════════════════════
   GOOGLE DRIVE: one visible file, "Sharp Axe/sharp-axe-data.json"
   ═══════════════════════════════════════════════════════════════ */
const DRIVE_KEY = "sharp-axe-drive";
const DRIVE_API = "https://www.googleapis.com/drive/v3";
const DRIVE_UPLOAD = "https://www.googleapis.com/upload/drive/v3";
const DRIVE_FILE = "sharp-axe-data.json";
const DRIVE_FOLDER = "Sharp Axe";
// Only files this app makes. It cannot see anything else in your Drive.
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";

const drive = (() => {
  try { return { on: false, fileId: "", clientId: "", token: "", exp: 0, lastSaved: 0, ...JSON.parse(localStorage.getItem(DRIVE_KEY) || "{}") }; }
  catch { return { on: false, fileId: "", clientId: "", token: "", exp: 0, lastSaved: 0 }; }
})();
const driveStore = () => { try { localStorage.setItem(DRIVE_KEY, JSON.stringify(drive)); } catch {} };
const driveTokenOk = () => drive.token && Date.now() < drive.exp - 60000;

function loadGoogleScript() {
  if (window.google?.accounts?.oauth2) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const sc = document.createElement("script");
    sc.src = "https://accounts.google.com/gsi/client";
    sc.onload = resolve;
    sc.onerror = () => reject(new Error("Could not load Google sign-in"));
    document.head.appendChild(sc);
  });
}

// Google gives a browser app a 1-hour key. Getting a new one needs a click.
async function driveSignIn() {
  if (driveTokenOk()) return;
  let clientId = GOOGLE_CLIENT_ID || drive.clientId;
  if (!clientId) {
    clientId = (prompt("Paste your Google OAuth Client ID.\n(See GOOGLE-SETUP.md in the project for the steps.)") || "").trim();
    if (!clientId) throw new Error("No Client ID");
    drive.clientId = clientId; driveStore();
  }
  await loadGoogleScript();
  await new Promise((resolve, reject) => {
    google.accounts.oauth2.initTokenClient({
      client_id: clientId,
      scope: DRIVE_SCOPE,
      callback: (r) => {
        if (r.error) return reject(new Error(r.error_description || r.error));
        drive.token = r.access_token;
        drive.exp = Date.now() + Number(r.expires_in || 3600) * 1000;
        driveStore(); resolve();
      },
      error_callback: () => reject(new Error("Sign-in was closed")),
    }).requestAccessToken({ prompt: "" });
  });
}

async function gfetch(url, opts = {}) {
  const res = await fetch(url, { ...opts, headers: { Authorization: `Bearer ${drive.token}`, ...(opts.headers || {}) } });
  if (res.status === 401) { drive.token = ""; driveStore(); throw new Error("Google sign-in expired. Open the menu and tap Google Drive."); }
  if (!res.ok) {
    let msg = `Google Drive error ${res.status}`;
    try { msg = (await res.json()).error?.message || msg; } catch {}
    const e = new Error(msg); e.status = res.status; throw e;
  }
  return res;
}

async function driveFindFile() {
  if (drive.fileId) {
    try {
      const f = await (await gfetch(`${DRIVE_API}/files/${drive.fileId}?fields=id,trashed`)).json();
      if (!f.trashed) return f.id;
    } catch (e) { if (e.status !== 404) throw e; }
  }
  const q = encodeURIComponent(`name='${DRIVE_FILE}' and trashed=false`);
  const found = await (await gfetch(`${DRIVE_API}/files?q=${q}&fields=files(id)&pageSize=1`)).json();
  drive.fileId = found.files?.[0]?.id || "";
  driveStore();
  return drive.fileId;
}

const drivePayload = () => JSON.stringify({ type: "sharp-axe-drive", version: 1, savedAt: state.savedAt, state });

async function driveWrite() {
  const id = await driveFindFile();
  if (id) {
    await gfetch(`${DRIVE_UPLOAD}/files/${id}?uploadType=media`, {
      method: "PATCH", headers: { "Content-Type": "application/json" }, body: drivePayload(),
    });
  } else {
    const fq = encodeURIComponent(`name='${DRIVE_FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
    let folderId = (await (await gfetch(`${DRIVE_API}/files?q=${fq}&fields=files(id)&pageSize=1`)).json()).files?.[0]?.id;
    if (!folderId) {
      folderId = (await (await gfetch(`${DRIVE_API}/files?fields=id`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: DRIVE_FOLDER, mimeType: "application/vnd.google-apps.folder" }),
      })).json()).id;
    }
    const boundary = "sharpaxe" + Date.now();
    const meta = { name: DRIVE_FILE, parents: [folderId], mimeType: "application/json" };
    const body = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n` +
                 `--${boundary}\r\nContent-Type: application/json\r\n\r\n${drivePayload()}\r\n--${boundary}--`;
    drive.fileId = (await (await gfetch(`${DRIVE_UPLOAD}/files?uploadType=multipart&fields=id`, {
      method: "POST", headers: { "Content-Type": `multipart/related; boundary=${boundary}` }, body,
    })).json()).id;
  }
  drive.lastSaved = Date.now();
  driveStore();
}

// If Drive has a newer copy (saved on another device), offer to load it.
async function driveCheckNewer() {
  const id = await driveFindFile();
  if (!id) return false;
  const remote = await (await gfetch(`${DRIVE_API}/files/${id}?alt=media`)).json();
  if (!remote?.state || !(remote.savedAt > (state.savedAt || 0))) return false;
  const when = new Date(remote.savedAt).toLocaleString();
  if (!confirm(`Google Drive has a newer copy (saved ${when}).\n\nOK = Load it (replaces what is on this device)\nCancel = Keep this device's copy`)) return false;
  state = hydrate(remote.state);
  _savedSig = stateSig();
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
  render();
  toast("Loaded your data from Google Drive");
  return true;
}

async function driveConnect() {
  try {
    await driveSignIn();
    drive.on = true; driveStore();
    const loaded = await driveCheckNewer();
    if (!loaded) await driveWrite();
    toast(loaded ? "Google Drive is on" : "Saved to Google Drive");
  } catch (e) {
    toast(e.message || "Google Drive did not work", "error");
  }
  renderDriveMenu();
}

let _driveTimer = null;
function driveAutoSave() {
  if (!drive.on || !driveTokenOk()) return;
  clearTimeout(_driveTimer);
  _driveTimer = setTimeout(() => driveWrite().catch(e => toast(e.message, "error")).finally(renderDriveMenu), 3000);
}

function renderDriveMenu() {
  const sub = $("#driveSub"), off = $("#miDriveOff");
  if (!sub) return;
  off.hidden = !drive.on;
  if (!drive.on) sub.textContent = "Save your data to Drive";
  else if (!driveTokenOk()) sub.textContent = "Tap to sign in again and sync";
  else sub.textContent = drive.lastSaved ? `On · saved ${new Date(drive.lastSaved).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}` : "On";
}

/* ─── MENU WIRING ───────────────────────────────────────────── */
const menuBtn = $("#menuBtn");
const menuDropdown = $("#menuDropdown");
function closeMenu() {
  menuDropdown.classList.remove("open");
  menuBtn.classList.remove("open");
  menuBtn.setAttribute("aria-expanded", "false");
}
function openMenu() {
  renderDriveMenu();
  menuDropdown.classList.add("open");
  menuBtn.classList.add("open");
  menuBtn.setAttribute("aria-expanded", "true");
}
menuBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  menuDropdown.classList.contains("open") ? closeMenu() : openMenu();
});
document.addEventListener("click", (e) => {
  if (!menuDropdown.contains(e.target) && e.target !== menuBtn) closeMenu();
  if (jar.menu && !jar.menu.contains(e.target) && e.target !== jar.canvas) closeJarMenu();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    closeMenu();
    closeJarMenu();
    if (_pickId) { _pickId = null; render(); }
    if (_linkFrom) { _linkFrom = null; render(); }
  }
});

$("#miImport").addEventListener("click", () => { closeMenu(); importTodos(); });
$("#miExport").addEventListener("click", () => { closeMenu(); exportTodos(); });
$("#miSaveAll").addEventListener("click", () => { closeMenu(); downloadFullSession(); });
$("#fileInput").addEventListener("change", handleFileImport);
$("#miDrive").addEventListener("click", () => { closeMenu(); driveConnect(); });
$("#miGarden").addEventListener("click", () => { closeMenu(); openGarden(); });
$("#miDriveOff").addEventListener("click", () => {
  closeMenu();
  drive.on = false; drive.token = ""; driveStore();
  toast("Google Drive is off. Your Drive file stays.");
});
$("#brand").addEventListener("click", openHome);
$("#brand").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openHome(); } });

/* ─── KICKOFF ───────────────────────────────────────────────── */
_savedSig = stateSig();
render(true);
window.addEventListener("beforeunload", saveState);

// Keep countdowns fresh, and redraw the list now and then so order and
// "time passed" notes follow the clock (not while you are typing).
setInterval(() => {
  updateCountdowns();
  const a = document.activeElement;
  const typing = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
  if (!typing && !_openFor && (_view === "home" || PHASES[state.phase].type === "triage")) render();
}, 60000);

if (drive.on && driveTokenOk()) driveCheckNewer().catch(() => {});
</script>
