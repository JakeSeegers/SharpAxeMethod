<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Sharp Axe Method - single-file app
   ============================================================ */

const STORAGE_KEY = "sharp-axe-state-v2";
const OLD_STORAGE_KEY = "sharp-axe-state-v1";

/* ─── PHASE DEFINITIONS ─────────────────────────────────────── */
const PHASES = [
  {
    id: "physical",
    title: "Prepare Your Space",
    subtitle: "Clear the space around you",
    type: "checklist",
    items: [
      "Clean the kitchen, the desk, and the workspace",
      "Clean your digital environment",
      "Close social media",
      "Put phone away",
    ],
  },
  {
    id: "mental",
    title: "Prepare Your Mind",
    subtitle: "Settle your mind before you begin",
    type: "checklist",
    items: [
      { text: "Box breathing: follow the square for a few rounds", extra: "breathing" },
      "Name five things you can hear, smell, touch, and taste",
      { text: "Brain dump: write whatever is on your mind", extra: "braindump" },
    ],
  },
  {
    id: "list",
    title: "List Your To-Dos",
    subtitle: "Write down every task. Do not sort yet. You will sort them in the next step.",
    type: "input-list",
  },
  {
    id: "sort",
    title: "Sort Your To-Dos",
    subtitle: "Put each task in a box, so you switch between kinds of work less",
    type: "matrix",
  },
  {
    id: "schedule",
    title: "Schedule",
    subtitle: "Give each task a real time, then put it on your calendar",
    type: "schedule",
    rules: [
      ["Under 3 minutes?", "Do it now. Do not schedule it."],
      ["Block off first", "the times you cannot use."],
      ["Double", "every time estimate."],
      ["Most important first,", "even if you do not want to do it."],
      ["Be very specific.", "Plan for an average day, not your best day."],
      ["One task at a time.", "Expect the plan to change."],
    ],
  },
  {
    id: "communicate",
    title: "Communicate",
    subtitle: "Tell people what to expect from you",
    type: "communicate",
    tips: [
      ["Add a day.", "Give a date one day later than you think."],
      ["Be honest.", "If people rely on you, tell them you are overwhelmed."],
      ["Keep it short.", "What, when, and what you need from them."],
    ],
  },
  {
    id: "triage",
    title: "Triage",
    subtitle: "One task at a time, in order of priority. Start small and keep moving.",
    type: "triage",
  },
  {
    id: "reflect",
    title: "Reflect",
    subtitle: "Questions to ask after you are overwhelmed",
    type: "reflect",
    questions: [
      "Did you say yes to too many things?",
      "Did you use work as a vice?",
      "Did you have ridiculous expectations?",
      "Were you avoiding something or procrastinating?",
    ],
    tip: "Being pushed to your limits sucks, but it can be an amazing teacher. Plus it's better than the alternative: not being pushed at all.",
  },
];

const QUADRANTS = [
  { id: "q1",    label: "Do First",       sub: "Urgent + Important",           color: "var(--q1)" },
  { id: "q2",    label: "Schedule",       sub: "Important, not urgent",        color: "var(--q2)" },
  { id: "quick", label: "Under 3 Min",    sub: "Small things. Just do them.",  color: "var(--quick)" },
  { id: "q4",    label: "Eliminate",      sub: "Not urgent + Not important",   color: "var(--q4)" },
];
const QUADRANT_IDS = QUADRANTS.map(q => q.id);
const qInfo = (id) => QUADRANTS.find(q => q.id === id);

/* ─── STATE ─────────────────────────────────────────────────── */
const defaultState = () => ({
  phase: 0,
  checklistItems: {
    physical: [false, false, false, false],
    mental:   [false, false, false],
  },
  mentalDump: "",
  tasks: [],
  scheduleNotes: "",
  triageOrder: [],
  reflectAnswers: {},
  reflectNotes: "",
});

let state = loadState();

function normalizeTask(t) {
  return {
    id: t.id || uid(),
    text: String(t.text || "").trim(),
    quadrant: QUADRANT_IDS.includes(t.quadrant) ? t.quadrant : null,
    done: !!t.done,
    scheduledTime: typeof t.scheduledTime === "string" ? t.scheduledTime : "",
    date: typeof t.date === "string" ? t.date : "",
    duration: Number(t.duration) || 30,
    steps: Array.isArray(t.steps)
      ? t.steps.filter(s => s && typeof s.text === "string").map(s => ({ id: s.id || uid(), text: s.text, done: !!s.done }))
      : [],
  };
}

function loadState() {
  try {
    let raw = localStorage.getItem(STORAGE_KEY);
    let fromV1 = false;
    if (!raw) { raw = localStorage.getItem(OLD_STORAGE_KEY); fromV1 = !!raw; }
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const d = defaultState();
    const s = {
      ...d, ...parsed,
      checklistItems: { ...d.checklistItems, ...(parsed.checklistItems || {}) },
      tasks: (parsed.tasks || []).map(normalizeTask),
      triageOrder: Array.isArray(parsed.triageOrder) ? parsed.triageOrder : [],
    };
    if (fromV1) {
      // v1 had 7 phases: "Just Do It" (5) and "Reflect" (6) moved one step later.
      s.phase = parsed.phase >= 5 ? parsed.phase + 1 : (parsed.phase || 0);
    }
    s.phase = Math.max(0, Math.min(PHASES.length - 1, Number(s.phase) || 0));
    return s;
  } catch { return defaultState(); }
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
}

/* ─── UTILS ─────────────────────────────────────────────────── */
const $  = (sel, root = document) => root.querySelector(sel);
let _uidSeq = 0;
const uid = () => Date.now() * 100 + (_uidSeq++ % 100);
const plural = (n, word) => `${n} ${word}${n !== 1 ? "s" : ""}`;
const reduceMotion = () => window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") node.className = v;
    else if (k === "html") node.innerHTML = v;
    else if (k === "text") node.textContent = v;
    else if (k === "value") node.value = v;
    else if (k.startsWith("on") && typeof v === "function") {
      node.addEventListener(k.slice(2).toLowerCase(), v);
    } else if (k === "style" && typeof v === "object") {
      for (const [prop, val] of Object.entries(v)) {
        if (prop.startsWith("--")) node.style.setProperty(prop, val);
        else node.style[prop] = val;
      }
    } else {
      node.setAttribute(k, v === true ? "" : v);
    }
  }
  for (const c of [].concat(children)) {
    if (c == null || c === false) continue;
    node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return node;
}

const SVG = {
  check: `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20,6 9,17 4,12"/></svg>`,
  plus:  `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
  trash: `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polyline points="3,6 5,6 21,6"/><path d="M19,6l-1,14H6L5,6"/><path d="M10,11v6"/><path d="M14,11v6"/><path d="M9,6V4h6v2"/></svg>`,
  x:     `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>`,
  bolt:  `<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg>`,
  up:    `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18,15 12,9 6,15"/></svg>`,
  down:  `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6,9 12,15 18,9"/></svg>`,
  top:   `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="4" x2="19" y2="4"/><polyline points="18,15 12,9 6,15"/><line x1="12" y1="9" x2="12" y2="21"/></svg>`,
  cal:   `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="12" y1="14" x2="12" y2="18"/><line x1="10" y1="16" x2="14" y2="16"/></svg>`,
  copy:  `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`,
  dice:  `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>`,
  refresh: `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23,4 23,10 17,10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>`,
  save: `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17,21 17,13 7,13 7,21"/><polyline points="7,3 7,8 15,8"/></svg>`,
};

function badgeFor(task) {
  const q = qInfo(task.quadrant);
  return q
    ? el("span", { class: "badge", style: { "--c": q.color }, text: q.label })
    : el("span", { class: "badge", text: "Not sorted" });
}

function todayISO() {
  const d = new Date();
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function whenText(task) {
  const parts = [];
  if (task.date) {
    const d = new Date(task.date + "T00:00");
    parts.push(d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }));
  }
  if (task.scheduledTime) parts.push(task.scheduledTime);
  return parts.join(" @ ");
}

/* ─── TOAST ─────────────────────────────────────────────────── */
let _toastTimer = null;
function toast(msg, kind = "success") {
  const t = $("#toast");
  t.textContent = msg;
  t.className = "toast show" + (kind === "error" ? " error" : "");
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ─── CONFETTI ──────────────────────────────────────────────── */
function celebrate(fromEl) {
  if (reduceMotion()) return;
  const r = fromEl?.getBoundingClientRect?.() || { left: innerWidth / 2, top: innerHeight / 2, width: 0, height: 0 };
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const colors = ["#e2550f", "#2b8a3e", "#1c7ed6", "#7048e8", "#f59f00", "#e03131"];
  for (let i = 0; i < 22; i++) {
    const a = Math.random() * Math.PI * 2;
    const dist = 60 + Math.random() * 90;
    const p = el("span", { class: "confetti" });
    p.style.left = cx + "px";
    p.style.top = cy + "px";
    p.style.background = colors[i % colors.length];
    p.style.setProperty("--dx", Math.cos(a) * dist + "px");
    p.style.setProperty("--dy", Math.sin(a) * dist - 40 + "px");
    p.style.setProperty("--r", (Math.random() * 540 - 270) + "deg");
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 950);
  }
}

/* ─── HEADER PIPS ───────────────────────────────────────────── */
function renderPips() {
  const pipsEl = $("#pips");
  pipsEl.innerHTML = "";
  PHASES.forEach((p, i) => {
    const cls = i < state.phase ? "done" : i === state.phase ? "current" : "";
    pipsEl.appendChild(el("button", {
      class: `pip ${cls}`,
      type: "button",
      title: `${i + 1}. ${p.title}`,
      "aria-label": `Go to step ${i + 1}: ${p.title}`,
      onclick: () => goTo(i),
    }));
  });
}

/* ─── PHASE HEADER + TIP ────────────────────────────────────── */
function phaseHeader(p) {
  return el("div", { class: "phase-header" }, [
    el("div", { class: "phase-num", text: `Step ${state.phase + 1} of ${PHASES.length}` }),
    el("h1", { class: "phase-title", text: p.title }),
    el("p", { class: "phase-sub", text: p.subtitle }),
  ]);
}

function tipBlock(text) {
  return text ? el("div", { class: "tip", text: `"${text}"` }) : null;
}

/* ─── SHARED: ADD-TASK INPUT ────────────────────────────────── */
function addTask(text, quadrant = null) {
  const clean = String(text || "").trim();
  if (!clean) return null;
  const task = normalizeTask({ text: clean, quadrant });
  state.tasks.push(task);
  return task;
}

function taskInput(id, placeholder, onAdd) {
  const submit = () => {
    const input = $(`#${id}`);
    const text = (input?.value || "").trim();
    if (!text) return;
    onAdd(text);
    saveState(); render();
    setTimeout(() => $(`#${id}`)?.focus(), 0);
  };
  return el("div", { class: "input-row" }, [
    el("input", {
      type: "text", id, placeholder,
      onkeydown: (e) => { if (e.key === "Enter") submit(); },
    }),
    el("button", { class: "btn btn-primary btn-icon", "aria-label": "Add", onclick: submit, html: SVG.plus }),
  ]);
}

/* ─── PHASE: CHECKLIST ──────────────────────────────────────── */
function renderChecklist(p) {
  const items = state.checklistItems[p.id] || p.items.map(() => false);
  state.checklistItems[p.id] = items;

  const list = el("div", { class: "checklist" });
  p.items.forEach((item, i) => {
    const label = typeof item === "string" ? item : item.text;
    const checked = !!items[i];
    list.appendChild(el("button", {
      class: `check-card ${checked ? "checked" : ""}`,
      type: "button",
      onclick: () => { items[i] = !items[i]; saveState(); render(); },
    }, [
      el("span", { class: "check-circle", html: checked ? SVG.check : "" }),
      el("span", { class: "check-text", text: label }),
    ]));
    if (item.extra === "breathing") list.appendChild(breathingPanel());
    if (item.extra === "braindump") list.appendChild(mentalDumpPanel());
  });

  const done = items.filter(Boolean).length;
  list.appendChild(el("div", { class: "check-counter", text: `${done} / ${items.length} done` }));

  return el("div", {}, [phaseHeader(p), list]);
}

/* ─── BOX BREATHING ─────────────────────────────────────────── */
// Runs on its own clock and finds its elements by id each frame, so a
// re-render (for example ticking a checklist card) does not stop it.
const BREATH_SIDE_MS = 4000;
const BREATH_STEPS = [
  { name: "Breathe in",  help: "Slowly through your nose." },
  { name: "Hold",        help: "Keep the air in. Stay relaxed." },
  { name: "Breathe out", help: "Slowly through your mouth." },
  { name: "Hold",        help: "Stay empty. Stay relaxed." },
];
const breath = { running: false, start: 0, raf: 0 };
// Square corners: bottom-left, top-left, top-right, bottom-right.
const BOX = { x0: 20, y0: 20, x1: 160, y1: 160 };
const BOX_CORNERS = [[BOX.x0, BOX.y1], [BOX.x0, BOX.y0], [BOX.x1, BOX.y0], [BOX.x1, BOX.y1]];

function breathingPanel() {
  const sides = BOX_CORNERS.map((c, i) => {
    const n = BOX_CORNERS[(i + 1) % 4];
    return `<line id="breathSide${i}" class="breath-side" x1="${c[0]}" y1="${c[1]}" x2="${n[0]}" y2="${n[1]}"/>`;
  }).join("");
  const svg = `<svg viewBox="0 0 180 180" aria-hidden="true">
    <rect id="breathFill" class="breath-fill" x="20" y="20" width="140" height="140" rx="6"/>
    <rect class="breath-track" x="20" y="20" width="140" height="140" rx="6"/>
    ${sides}
    <text id="breathCount" class="breath-count" x="90" y="104" text-anchor="middle"></text>
    <circle id="breathDot" class="breath-dot" cx="20" cy="160" r="9"/>
  </svg>`;
  const panel = el("div", { class: "extra-panel" }, [
    el("div", { class: "breath" }, [
      el("div", { html: svg }),
      el("div", { class: "breath-body" }, [
        el("div", { class: "breath-step", id: "breathStep", text: "Ready?" }),
        el("div", { class: "breath-help", id: "breathHelp", text: "Follow the dot around the square. 4 seconds per side." }),
        el("button", {
          class: `btn ${breath.running ? "" : "btn-dark"}`,
          id: "breathBtn",
          type: "button",
          text: breath.running ? "Stop" : "Start breathing",
          onclick: () => breath.running ? stopBreathing() : startBreathing(),
        }),
        el("div", { class: "breath-cycles", id: "breathCycles", text: "" }),
      ]),
    ]),
  ]);
  if (breath.running) requestAnimationFrame(breathFrame);
  else setTimeout(drawBreathIdle, 0);
  return panel;
}

function startBreathing() {
  breath.running = true;
  breath.start = performance.now();
  const btn = $("#breathBtn");
  if (btn) { btn.textContent = "Stop"; btn.classList.remove("btn-dark"); }
  cancelAnimationFrame(breath.raf);
  breath.raf = requestAnimationFrame(breathFrame);
}

function stopBreathing() {
  const rounds = Math.floor((performance.now() - breath.start) / (BREATH_SIDE_MS * 4));
  breath.running = false;
  cancelAnimationFrame(breath.raf);
  const btn = $("#breathBtn");
  if (btn) { btn.textContent = "Start breathing"; btn.classList.add("btn-dark"); }
  drawBreathIdle();
  if (rounds >= 3) {
    const items = state.checklistItems.mental;
    if (items && !items[0]) { items[0] = true; saveState(); render(); toast(`Nice. ${plural(rounds, "round")} of box breathing.`); }
  }
}

function drawBreathIdle() {
  const dot = $("#breathDot"), fill = $("#breathFill");
  if (!dot) return;
  dot.setAttribute("cx", BOX.x0); dot.setAttribute("cy", BOX.y1);
  setBreathFill(fill, 0.35);
  $("#breathCount").textContent = "";
  for (let i = 0; i < 4; i++) $(`#breathSide${i}`)?.classList.remove("on");
  $("#breathStep").textContent = "Ready?";
  $("#breathHelp").textContent = "Follow the dot around the square. 4 seconds per side.";
  $("#breathCycles").textContent = "";
}

function setBreathFill(fill, scale) {
  if (!fill) return;
  const size = 140 * scale;
  const off = 20 + (140 - size) / 2;
  fill.setAttribute("x", off); fill.setAttribute("y", off);
  fill.setAttribute("width", size); fill.setAttribute("height", size);
}

function breathFrame(now) {
  if (!breath.running) return;
  breath.raf = requestAnimationFrame(breathFrame);
  const dot = $("#breathDot");
  if (!dot) return; // left the phase; keep the clock going
  const elapsed = now - breath.start;
  const side = Math.floor(elapsed / BREATH_SIDE_MS) % 4;
  const t = (elapsed % BREATH_SIDE_MS) / BREATH_SIDE_MS;
  const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const a = BOX_CORNERS[side], b = BOX_CORNERS[(side + 1) % 4];
  dot.setAttribute("cx", a[0] + (b[0] - a[0]) * t);
  dot.setAttribute("cy", a[1] + (b[1] - a[1]) * t);
  const MIN = 0.35;
  const scale = side === 0 ? MIN + (1 - MIN) * ease
              : side === 1 ? 1
              : side === 2 ? 1 - (1 - MIN) * ease
              : MIN;
  setBreathFill($("#breathFill"), scale);
  for (let i = 0; i < 4; i++) $(`#breathSide${i}`)?.classList.toggle("on", i === side);
  $("#breathCount").textContent = String(4 - Math.floor(t * 4));
  $("#breathStep").textContent = BREATH_STEPS[side].name;
  $("#breathHelp").textContent = BREATH_STEPS[side].help;
  const rounds = Math.floor(elapsed / (BREATH_SIDE_MS * 4));
  $("#breathCycles").textContent = rounds > 0 ? `${plural(rounds, "round")} done. 3 or 4 rounds is a good start.` : "Round 1";
}

/* ─── MENTAL BRAIN DUMP ─────────────────────────────────────── */
function mentalDumpPanel() {
  return el("div", { class: "extra-panel" }, [
    el("div", { class: "hint", text: "Type anything that is in your head. No rules, no order. Get it out so it stops taking up space." }),
    el("textarea", {
      id: "mentalDump",
      placeholder: "I keep thinking about...",
      style: { minHeight: "160px" },
      value: state.mentalDump || "",
      oninput: (e) => { state.mentalDump = e.target.value; saveState(); },
    }),
    el("div", { class: "row-actions" }, [
      el("button", {
        class: "btn btn-sm",
        type: "button",
        text: "Add each line to my to-do list",
        onclick: () => {
          const existing = new Set(state.tasks.map(t => t.text.toLowerCase()));
          const lines = (state.mentalDump || "").split("\n").map(l => l.replace(/^[-*•\d.)\s]+/, "").trim()).filter(Boolean);
          let added = 0;
          lines.forEach(l => { if (!existing.has(l.toLowerCase())) { addTask(l); existing.add(l.toLowerCase()); added++; } });
          saveState();
          toast(added ? `Added ${plural(added, "to-do")}. You will see them in the next step.` : "Nothing new to add");
        },
      }),
    ]),
  ]);
}

/* ─── PHASE: LIST TO-DOS ────────────────────────────────────── */
let _addCategory = "todo";

function taskRow(task, i) {
  const isQuick = task.quadrant === "quick";
  return el("div", { class: `task-row ${isQuick ? "quick" : ""}` }, [
    el("span", { class: "task-index", text: String(i + 1) }),
    el("input", {
      type: "text",
      class: "task-text",
      value: task.text,
      "aria-label": "Task",
      oninput: (e) => { task.text = e.target.value; saveState(); },
    }),
    el("button", {
      class: `icon-btn ${isQuick ? "on" : ""}`,
      type: "button",
      title: isQuick ? "Move to regular to-dos" : "Mark as under 3 minutes",
      "aria-label": isQuick ? "Move to regular to-dos" : "Mark as under 3 minutes",
      html: SVG.bolt,
      onclick: () => { task.quadrant = isQuick ? null : "quick"; saveState(); render(); },
    }),
    el("button", {
      class: "icon-btn danger",
      type: "button",
      "aria-label": "Remove",
      html: SVG.trash,
      onclick: () => { state.tasks = state.tasks.filter(t => t.id !== task.id); saveState(); render(); },
    }),
  ]);
}

function renderListPhase(p) {
  const wrap = el("div", {}, [phaseHeader(p)]);

  wrap.appendChild(el("div", { class: "seg", role: "tablist" }, [
    el("button", {
      class: _addCategory === "todo" ? "active" : "",
      type: "button",
      text: "To-do",
      onclick: () => { _addCategory = "todo"; render(); $("#list-input")?.focus(); },
    }),
    el("button", {
      class: `quick ${_addCategory === "quick" ? "active" : ""}`,
      type: "button",
      html: `${SVG.bolt}<span>Under 3 minutes</span>`,
      onclick: () => { _addCategory = "quick"; render(); $("#list-input")?.focus(); },
    }),
  ]));
  wrap.appendChild(taskInput(
    "list-input",
    _addCategory === "quick" ? "A small thing (under 3 minutes)..." : "Write a task and press Enter...",
    (text) => addTask(text, _addCategory === "quick" ? "quick" : null),
  ));

  const regular = state.tasks.filter(t => t.quadrant !== "quick");
  const quick = state.tasks.filter(t => t.quadrant === "quick");

  if (state.tasks.length === 0) {
    wrap.appendChild(el("div", { class: "empty", text: "Start typing. Get everything out of your head." }));
  } else {
    const regWrap = el("div", { class: "section" }, [
      el("span", { class: "section-label", text: `To-dos (${regular.length})` }),
    ]);
    const regList = el("div", { class: "task-list" });
    regular.forEach((t, i) => regList.appendChild(taskRow(t, i)));
    if (!regular.length) regList.appendChild(el("div", { class: "empty small", text: "None yet" }));
    regWrap.appendChild(regList);

    const quickWrap = el("div", { class: "section" }, [
      el("span", { class: "section-label", text: `Under 3 minutes (${quick.length})` }),
      el("div", { class: "hint", text: "Small tasks you can finish in less than 3 minutes. You will knock these out fast. No need to schedule them." }),
    ]);
    const quickList = el("div", { class: "task-list" });
    quick.forEach((t, i) => quickList.appendChild(taskRow(t, i)));
    if (!quick.length) quickList.appendChild(el("div", { class: "empty small", text: "Tap the lightning icon on a task to move it here" }));
    quickWrap.appendChild(quickList);

    wrap.appendChild(regWrap);
    wrap.appendChild(quickWrap);
    wrap.appendChild(el("div", { class: "check-counter", style: { marginTop: "10px" }, text: `${plural(state.tasks.length, "task")} captured` }));
  }
  setTimeout(() => { if (!document.activeElement || document.activeElement === document.body) $("#list-input")?.focus(); }, 0);
  return wrap;
}

/* ─── PHASE: SORT (MATRIX) ──────────────────────────────────── */
let _dragId = null;
let _pickId = null; // tap a task, then tap a box (works on touch screens)

function assignTask(id, quadrant) {
  const task = state.tasks.find(t => t.id === id);
  if (task) task.quadrant = quadrant;
  _pickId = null;
  saveState(); render();
}

function draggable(task, extra) {
  return {
    draggable: "true",
    ondragstart: (e) => { _dragId = task.id; e.dataTransfer?.setData("text/plain", String(task.id)); },
    ondragend: () => { _dragId = null; },
    onclick: (e) => {
      if (e.target.closest(".icon-btn")) return;
      e.stopPropagation();
      _pickId = _pickId === task.id ? null : task.id;
      render();
    },
    ...extra,
  };
}

function renderMatrix(p) {
  const wrap = el("div", {}, [phaseHeader(p)]);

  wrap.appendChild(taskInput("sort-input", "Thought of another to-do? Add it here...", (text) => addTask(text)));

  if (state.tasks.length === 0) {
    wrap.appendChild(el("div", { class: "empty", text: "No to-dos yet. Add one above, or go back a step." }));
    return wrap;
  }

  wrap.appendChild(el("div", { class: "hint", text: "Drag a task into a box. Or tap a task, then tap a box." }));

  const unassigned = state.tasks.filter(t => !t.quadrant);
  if (unassigned.length > 0) {
    const u = el("div", { class: "unassigned-wrap" }, [
      el("span", { class: "section-label", text: `Not sorted yet (${unassigned.length})` }),
    ]);
    const list = el("div", { class: "chip-list" });
    unassigned.forEach(task => {
      list.appendChild(el("div", draggable(task, {
        class: `chip ${_pickId === task.id ? "picked" : ""}`,
        text: task.text,
      })));
    });
    u.appendChild(list);
    wrap.appendChild(u);
  }

  const matrix = el("div", { class: "matrix" });
  QUADRANTS.forEach(q => {
    const qTasks = state.tasks.filter(t => t.quadrant === q.id);
    const quadrant = el("div", {
      class: `quadrant ${q.id} ${_pickId ? "target" : ""}`,
      ondragover: (e) => { e.preventDefault(); quadrant.classList.add("drag-over"); },
      ondragleave: () => quadrant.classList.remove("drag-over"),
      ondrop: (e) => {
        e.preventDefault();
        const id = Number(e.dataTransfer?.getData("text/plain") || _dragId);
        assignTask(id, q.id);
      },
      onclick: () => { if (_pickId) assignTask(_pickId, q.id); },
    }, [
      el("div", { class: "q-label", text: q.label }),
      el("div", { class: "q-sub",   text: q.sub }),
    ]);
    const tlist = el("div", { class: "q-tasks" });
    qTasks.forEach(task => {
      tlist.appendChild(el("div", draggable(task, {
        class: `q-task ${_pickId === task.id ? "picked" : ""}`,
      }), [
        el("span", { class: "q-task-text", text: task.text }),
        el("button", {
          class: "icon-btn",
          type: "button",
          "aria-label": "Take out of this box",
          title: "Take out of this box",
          html: SVG.x,
          onclick: (e) => { e.stopPropagation(); assignTask(task.id, null); },
        }),
      ]));
    });
    if (qTasks.length === 0) tlist.appendChild(el("div", { class: "q-empty", text: "Drop tasks here" }));
    quadrant.appendChild(tlist);
    matrix.appendChild(quadrant);
  });
  wrap.appendChild(matrix);

  wrap.appendChild(el("div", { class: "key-question" }, [
    el("div", { class: "key-question-label", text: "Key question" }),
    el("div", { class: "key-question-text",
      html: `What <em>one thing</em>, if done, would make everything else on this list easier or not needed?` }),
  ]));

  return wrap;
}

/* ─── PRIORITY ORDER ────────────────────────────────────────── */
const PRIORITY_RANK = { q1: 0, quick: 1, q2: 2 };
function priorityCompare(a, b) {
  const ra = PRIORITY_RANK[a.quadrant] ?? 3, rb = PRIORITY_RANK[b.quadrant] ?? 3;
  if (ra !== rb) return ra - rb;
  const wa = (a.date || "9999") + (a.scheduledTime || "99:99");
  const wb = (b.date || "9999") + (b.scheduledTime || "99:99");
  if (wa !== wb) return wa < wb ? -1 : 1;
  return state.tasks.indexOf(a) - state.tasks.indexOf(b);
}

// Tasks you schedule: everything except "Eliminate" and the under-3-minute ones.
function schedulableTasks() {
  return state.tasks.filter(t => t.quadrant !== "q4" && t.quadrant !== "quick").slice().sort(priorityCompare);
}

/* ─── PHASE: SCHEDULE ───────────────────────────────────────── */
function gcalUrl(task) {
  const date = task.date || todayISO();
  const compact = s => s.replace(/[-:]/g, "");
  let dates;
  if (task.scheduledTime) {
    const start = new Date(`${date}T${task.scheduledTime}`);
    const end = new Date(start.getTime() + (task.duration || 30) * 60000);
    const fmt = d => {
      const pad = n => String(n).padStart(2, "0");
      return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
    };
    dates = `${fmt(start)}/${fmt(end)}`;
  } else {
    const next = new Date(date + "T00:00");
    next.setDate(next.getDate() + 1);
    const pad = n => String(n).padStart(2, "0");
    dates = `${compact(date)}/${next.getFullYear()}${pad(next.getMonth() + 1)}${pad(next.getDate())}`;
  }
  const details = ["Planned with the Sharp Axe Method."];
  if (task.steps?.length) details.push("", "Steps:", ...task.steps.map(s => `- ${s.text}`));
  const params = new URLSearchParams({ action: "TEMPLATE", text: task.text, dates, details: details.join("\n") });
  try { params.set("ctz", Intl.DateTimeFormat().resolvedOptions().timeZone); } catch {}
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}

const DURATIONS = [15, 30, 45, 60, 90, 120, 180, 240];
const durLabel = m => m < 60 ? `${m} min` : `${m / 60} hr${m > 60 ? "s" : ""}`;

function renderSchedule(p) {
  const wrap = el("div", {}, [phaseHeader(p)]);

  const rules = el("div", { class: "rules" });
  p.rules.forEach(([bold, rest], i) => {
    rules.appendChild(el("div", { class: "rule" }, [
      el("span", { class: "rule-num", text: String(i + 1) }),
      el("span", {}, [el("strong", { text: bold }), " " + rest]),
    ]));
  });
  wrap.appendChild(el("div", {}, [el("span", { class: "section-label", text: "Quick rules" }), rules]));

  const tasks = schedulableTasks();
  const tWrap = el("div", { class: "section" }, [
    el("span", { class: "section-label", text: "Your schedule (most important first)" }),
  ]);
  if (tasks.length === 0) {
    tWrap.appendChild(el("div", { class: "empty small", text: "Nothing to schedule. Sort some tasks into Do First or Schedule." }));
  }
  tasks.forEach((task, i) => {
    const gcal = el("a", {
      class: "btn btn-sm gcal-btn",
      href: gcalUrl(task),
      target: "_blank",
      rel: "noopener",
      title: "Opens Google Calendar with this task filled in",
      html: `${SVG.cal}<span>Add to Google Calendar</span>`,
    });
    const refresh = () => { saveState(); gcal.href = gcalUrl(task); };
    const durSel = el("select", {
      "aria-label": "How long",
      onchange: (e) => { task.duration = Number(e.target.value); refresh(); },
    }, DURATIONS.map(m => el("option", { value: String(m), text: durLabel(m) })));
    durSel.value = String(task.duration || 30);

    tWrap.appendChild(el("div", { class: "schedule-task" }, [
      el("div", { class: "schedule-task-top" }, [
        el("span", { class: "schedule-task-num", text: String(i + 1) }),
        el("div", { class: "schedule-task-text", text: task.text }),
        badgeFor(task),
      ]),
      el("div", { class: "schedule-controls" }, [
        el("input", {
          type: "date", "aria-label": "Date", value: task.date || "",
          oninput: (e) => { task.date = e.target.value; refresh(); },
        }),
        el("input", {
          type: "time", "aria-label": "Start time", value: task.scheduledTime || "",
          oninput: (e) => { task.scheduledTime = e.target.value; refresh(); },
        }),
        durSel,
        gcal,
      ]),
    ]));
  });
  if (tasks.length) {
    tWrap.appendChild(el("div", { class: "hint", style: { marginTop: "6px" }, text: "Tip: pick the length after you double your guess. No date means today. No time means an all-day event." }));
  }
  wrap.appendChild(tWrap);

  const quickCount = state.tasks.filter(t => t.quadrant === "quick" && !t.done).length;
  if (quickCount) {
    wrap.appendChild(el("div", { class: "note-line", text: `${plural(quickCount, "under-3-minute task")} not listed here. You will do those in Triage.` }));
  }
  return wrap;
}

/* ─── PHASE: COMMUNICATE ────────────────────────────────────── */
function renderCommunicate(p) {
  const wrap = el("div", {}, [phaseHeader(p)]);

  const rules = el("div", { class: "rules" });
  p.tips.forEach(([bold, rest], i) => {
    rules.appendChild(el("div", { class: "rule" }, [
      el("span", { class: "rule-num", text: String(i + 1) }),
      el("span", {}, [el("strong", { text: bold }), " " + rest]),
    ]));
  });
  wrap.appendChild(rules);

  const dated = schedulableTasks().filter(t => t.date || t.scheduledTime);
  if (dated.length) {
    const ref = el("div", { class: "ref-list" });
    dated.forEach(t => ref.appendChild(el("div", { class: "ref-row" }, [
      el("span", { text: t.text }),
      el("span", { class: "ref-when", text: whenText(t) }),
    ])));
    wrap.appendChild(el("div", { class: "section" }, [
      el("span", { class: "section-label", text: "Your dates (for reference)" }),
      ref,
    ]));
  }

  const ta = el("textarea", {
    id: "commNotes",
    style: { minHeight: "180px" },
    placeholder: "Who needs to hear from you? Draft your messages here...",
    value: state.scheduleNotes || "",
    oninput: (e) => { state.scheduleNotes = e.target.value; saveState(); },
  });
  wrap.appendChild(el("div", { class: "section" }, [
    el("span", { class: "section-label", text: "Messages" }),
    ta,
    el("div", { class: "row-actions" }, [
      el("button", {
        class: "btn btn-sm", type: "button", text: "Insert a template",
        onclick: () => {
          const tpl = "Hi [name], I am working on [task]. I can have it to you by [date + 1 day]. I'm a bit overloaded right now, so thank you for your patience.\n";
          state.scheduleNotes = (state.scheduleNotes ? state.scheduleNotes.replace(/\s*$/, "\n\n") : "") + tpl;
          ta.value = state.scheduleNotes; saveState(); ta.focus();
        },
      }),
      el("button", {
        class: "btn btn-sm", type: "button", html: `${SVG.copy}<span>Copy</span>`,
        onclick: async () => {
          try { await navigator.clipboard.writeText(state.scheduleNotes || ""); toast("Copied"); }
          catch { ta.select(); toast("Press Ctrl+C to copy", "error"); }
        },
      }),
    ]),
  ]));
  return wrap;
}

/* ─── PHASE: TRIAGE ─────────────────────────────────────────── */
// ADHD-friendly: one big "right now" task, a visual focus timer, tiny steps,
// "not now" without guilt, a "pick for me" button, short lists, and a small
// celebration for every finished task.
let _stepsOpenFor = null;
let _showAllUpNext = false;
let _showDone = false;

const PRAISE = [
  "Done! Nice work.", "One less thing. Keep going.", "That's momentum.",
  "Look at you go.", "Checked off. Take a breath.", "Boom. Next one.",
];

const timer = { total: 15 * 60, left: 15 * 60, running: false, endAt: 0, iv: 0 };

function triageList() {
  const remaining = state.tasks.filter(t => !t.done && t.quadrant !== "q4");
  const ids = new Set(remaining.map(t => t.id));
  const order = state.triageOrder.filter(id => ids.has(id));
  const seen = new Set(order);
  remaining.filter(t => !seen.has(t.id)).sort(priorityCompare).forEach(t => order.push(t.id));
  state.triageOrder = order;
  const byId = new Map(remaining.map(t => [t.id, t]));
  return order.map(id => byId.get(id));
}

function moveInOrder(id, toIndex) {
  const order = state.triageOrder.filter(x => x !== id);
  order.splice(Math.max(0, Math.min(order.length, toIndex)), 0, id);
  state.triageOrder = order;
  saveState(); render();
}

function completeTask(task, fromEl) {
  task.done = true;
  celebrate(fromEl);
  toast(PRAISE[Math.floor(Math.random() * PRAISE.length)]);
  if (_stepsOpenFor === task.id) _stepsOpenFor = null;
  resetTimer();
  saveState(); render();
}

function fmtTime(sec) {
  const s = Math.max(0, Math.ceil(sec));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

function timerTick() {
  if (timer.running) {
    timer.left = (timer.endAt - Date.now()) / 1000;
    if (timer.left <= 0) {
      timer.left = 0; timer.running = false; clearInterval(timer.iv);
      chime();
      toast("Time's up! Stand up, stretch, then keep going or take a break.");
    }
  }
  const text = $("#timerText"), ring = $("#timerRing"), btn = $("#timerToggle");
  if (!text) return;
  text.textContent = fmtTime(timer.left);
  const C = 2 * Math.PI * 52;
  ring.style.strokeDasharray = C;
  ring.style.strokeDashoffset = C * (1 - timer.left / timer.total);
  btn.textContent = timer.running ? "Pause" : (timer.left < timer.total && timer.left > 0 ? "Resume" : "Start");
}

function toggleTimer() {
  if (timer.running) {
    timer.running = false; clearInterval(timer.iv);
  } else {
    if (timer.left <= 0) timer.left = timer.total;
    timer.running = true;
    timer.endAt = Date.now() + timer.left * 1000;
    clearInterval(timer.iv);
    timer.iv = setInterval(timerTick, 250);
  }
  timerTick();
}

function resetTimer(minutes) {
  if (minutes) timer.total = minutes * 60;
  timer.running = false; clearInterval(timer.iv);
  timer.left = timer.total;
  timerTick();
}

function chime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [660, 880, 990].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = f; o.type = "sine";
      g.gain.setValueAtTime(0.0001, ctx.currentTime + i * 0.18);
      g.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + i * 0.18 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i * 0.18 + 0.5);
      o.connect(g).connect(ctx.destination);
      o.start(ctx.currentTime + i * 0.18); o.stop(ctx.currentTime + i * 0.18 + 0.55);
    });
  } catch {}
}

function timerBlock() {
  const svg = `<svg viewBox="0 0 120 120" aria-hidden="true">
    <circle class="timer-track" cx="60" cy="60" r="52"/>
    <circle id="timerRing" class="timer-ring" cx="60" cy="60" r="52"/>
    <text id="timerText" class="timer-text" x="60" y="69" text-anchor="middle"></text>
  </svg>`;
  const presets = el("div", { class: "timer-presets" }, [5, 15, 25].map(m => el("button", {
    type: "button",
    class: timer.total === m * 60 ? "active" : "",
    text: `${m}m`,
    title: `${m} minute focus`,
    onclick: () => { resetTimer(m); render(); },
  })));
  const block = el("div", { class: "timer" }, [
    el("div", { html: svg }),
    presets,
    el("div", { class: "timer-controls" }, [
      el("button", { class: "btn btn-sm btn-dark", id: "timerToggle", type: "button", text: "Start", onclick: toggleTimer }),
      el("button", { class: "btn btn-sm btn-ghost", type: "button", text: "Reset", onclick: () => resetTimer() }),
    ]),
  ]);
  setTimeout(timerTick, 0);
  return block;
}

function stepsBlock(task) {
  const steps = task.steps || (task.steps = []);
  const open = _stepsOpenFor === task.id || steps.length > 0;
  if (!open) return null;
  const nextIdx = steps.findIndex(s => !s.done);
  const list = el("div", { class: "steps" });
  steps.forEach((s, i) => {
    list.appendChild(el("div", { class: `step ${s.done ? "done" : ""} ${i === nextIdx ? "next" : ""}` }, [
      el("span", {
        class: "check-circle", role: "checkbox", "aria-checked": String(s.done), tabindex: "0",
        html: s.done ? SVG.check : "",
        onclick: () => { s.done = !s.done; saveState(); render(); },
        onkeydown: (e) => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); s.done = !s.done; saveState(); render(); } },
      }),
      el("span", { class: "step-text", text: (i === nextIdx ? "Next: " : "") + s.text }),
      el("button", {
        class: "icon-btn danger", type: "button", "aria-label": "Remove step", html: SVG.x,
        onclick: () => { task.steps = steps.filter(x => x.id !== s.id); saveState(); render(); },
      }),
    ]));
  });
  const inputId = "step-input";
  const add = () => {
    const v = ($(`#${inputId}`)?.value || "").trim();
    if (!v) return;
    steps.push({ id: uid(), text: v, done: false });
    saveState(); render();
    setTimeout(() => $(`#${inputId}`)?.focus(), 0);
  };
  return el("div", {}, [
    el("span", { class: "section-label", text: "Tiny steps" }),
    list,
    el("input", {
      type: "text", id: inputId, class: "step-input",
      placeholder: steps.length ? "Add another step..." : "What is the very first tiny step? (for example: open the file)",
      onkeydown: (e) => { if (e.key === "Enter") add(); },
    }),
  ]);
}

function renderTriage(p) {
  const wrap = el("div", {}, [phaseHeader(p)]);
  const active = state.tasks.filter(t => t.quadrant !== "q4");
  const total = active.length;
  const done  = active.filter(t => t.done).length;
  const pct   = total === 0 ? 0 : Math.round((done / total) * 100);
  const mood  = done === 0 ? "Pick one thing. Just start."
              : pct < 50 ? "Good start. Keep rolling."
              : pct < 100 ? "More than halfway. Nice."
              : "All done! Go to Reflect.";

  wrap.appendChild(el("div", { class: "progress-wrap" }, [
    el("div", { class: "progress-meta" }, [
      el("span", { text: mood }),
      el("strong", { text: `${done} / ${total} done` }),
    ]),
    el("div", { class: "progress-track" }, [
      el("div", { class: "progress-fill", style: { width: `${pct}%` } }),
    ]),
  ]));

  const list = triageList();

  if (total === 0) {
    wrap.appendChild(el("div", { class: "empty", text: "No tasks yet. Add one below, or go back to List Your To-Dos." }));
  } else if (list.length === 0) {
    wrap.appendChild(el("div", { class: "all-done" }, [
      el("div", { class: "all-done-title", text: "Everything is done." }),
      el("div", { class: "all-done-sub", text: "Take a real break. You earned it." }),
    ]));
  } else {
    const task = list[0];
    const meta = el("div", { class: "focus-meta" }, [badgeFor(task)]);
    const when = whenText(task);
    if (when) meta.appendChild(el("span", { class: "badge", text: when }));
    if (task.steps?.length) meta.appendChild(el("span", { class: "badge", text: `${task.steps.filter(s => s.done).length}/${task.steps.length} steps` }));

    const doneBtn = el("button", {
      class: "btn btn-good btn-lg", type: "button", html: `${SVG.check}<span>Done</span>`,
      onclick: (e) => completeTask(task, e.currentTarget),
    });

    wrap.appendChild(el("div", { class: "focus-card" }, [
      el("div", { class: "focus-label", text: "Right now" }),
      el("div", { class: "focus-text", text: task.text }),
      meta,
      el("div", { class: "focus-grid" }, [
        el("div", { class: "focus-steps" }, [
          stepsBlock(task) || el("div", { class: "hint", style: { margin: 0 }, text: "Feels too big? Break it into tiny steps. Not in the mood? Set a 5 minute timer and just begin." }),
        ]),
        timerBlock(),
      ]),
      el("div", { class: "focus-actions" }, [
        doneBtn,
        _stepsOpenFor === task.id || task.steps?.length ? null : el("button", {
          class: "btn", type: "button", text: "Break it down",
          onclick: () => { _stepsOpenFor = task.id; render(); setTimeout(() => $("#step-input")?.focus(), 0); },
        }),
        list.length > 1 ? el("button", {
          class: "btn btn-ghost", type: "button", text: "Not now",
          title: "Move to the end of the list",
          onclick: () => { moveInOrder(task.id, Infinity); toast("Moved to the end. That's okay."); },
        }) : null,
      ]),
    ]));

    // Stuck helpers
    const firstQuick = list.findIndex(t => t.quadrant === "quick");
    if (list.length > 1) {
      wrap.appendChild(el("div", { class: "stuck-row" }, [
        el("span", { text: "Stuck?" }),
        el("button", {
          class: "btn btn-sm", type: "button", html: `${SVG.dice}<span>Pick one for me</span>`,
          onclick: () => {
            const pool = list.slice(1, 6);
            const pick = pool[Math.floor(Math.random() * pool.length)];
            moveInOrder(pick.id, 0);
            toast("Try this one.");
          },
        }),
        firstQuick > 0 ? el("button", {
          class: "btn btn-sm", type: "button", html: `${SVG.bolt}<span>Start with a quick win</span>`,
          onclick: () => moveInOrder(list[firstQuick].id, 0),
        }) : null,
      ]));
    }

    // Up next (short by default, so the list does not overwhelm)
    const rest = list.slice(1);
    if (rest.length) {
      const LIMIT = 4;
      const shown = _showAllUpNext ? rest : rest.slice(0, LIMIT);
      const upWrap = el("div", { class: "section" }, [
        el("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "10px" } }, [
          el("span", { class: "section-label", style: { margin: 0 }, text: `Up next (${rest.length})` }),
          el("button", {
            class: "btn btn-sm btn-ghost", type: "button", text: "Sort by priority",
            title: "Do First, then quick wins, then scheduled tasks by time",
            onclick: () => { state.triageOrder = []; saveState(); render(); toast("Sorted by priority"); },
          }),
        ]),
      ]);
      const ul = el("div", { class: "task-list" });
      shown.forEach((t, i) => {
        const idx = i + 1;
        ul.appendChild(el("div", { class: "up-row" }, [
          el("span", { class: "up-num", text: String(idx + 1) }),
          el("span", {
            class: "check-circle", role: "checkbox", "aria-checked": "false", tabindex: "0",
            title: "Mark done",
            onclick: (e) => completeTask(t, e.currentTarget),
            onkeydown: (e) => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); completeTask(t, e.currentTarget); } },
          }),
          el("span", { class: "up-text", text: t.text }),
          badgeFor(t),
          el("div", { class: "up-tools" }, [
            el("button", { class: "icon-btn", type: "button", title: "Do this now", "aria-label": "Do this now", html: SVG.top, onclick: () => moveInOrder(t.id, 0) }),
            el("button", { class: "icon-btn", type: "button", title: "Move up", "aria-label": "Move up", html: SVG.up, onclick: () => moveInOrder(t.id, idx - 1) }),
            el("button", { class: "icon-btn", type: "button", title: "Move down", "aria-label": "Move down", html: SVG.down, onclick: () => moveInOrder(t.id, idx + 1) }),
          ]),
        ]));
      });
      upWrap.appendChild(ul);
      if (rest.length > LIMIT) {
        upWrap.appendChild(el("button", {
          class: "btn btn-sm btn-ghost", type: "button", style: { marginTop: "8px" },
          text: _showAllUpNext ? "Show less" : `Show ${rest.length - LIMIT} more`,
          onclick: () => { _showAllUpNext = !_showAllUpNext; render(); },
        }));
      }
      wrap.appendChild(upWrap);
    }
  }

  // Park a new thought without losing focus
  wrap.appendChild(el("div", { class: "section" }, [
    el("span", { class: "section-label", text: "New thing popped up?" }),
    taskInput("park-input", "Park it here so you can stay on task...", (text) => { addTask(text); toast("Parked. Back to it."); }),
  ]));

  // Done list (hidden by default)
  const doneTasks = active.filter(t => t.done);
  if (doneTasks.length) {
    const dWrap = el("div", { class: "section" }, [
      el("button", {
        class: "btn btn-sm btn-ghost", type: "button",
        text: `${_showDone ? "Hide" : "Show"} done (${doneTasks.length})`,
        onclick: () => { _showDone = !_showDone; render(); },
      }),
    ]);
    if (_showDone) {
      const dl = el("div", { class: "task-list", style: { marginTop: "8px" } });
      doneTasks.forEach(t => dl.appendChild(el("div", { class: "up-row done" }, [
        el("span", {
          class: "check-circle", role: "checkbox", "aria-checked": "true", tabindex: "0",
          title: "Not done after all", html: SVG.check,
          onclick: () => { t.done = false; saveState(); render(); },
        }),
        el("span", { class: "up-text", text: t.text }),
      ])));
      dWrap.appendChild(dl);
    }
    wrap.appendChild(dWrap);
  }

  const dropped = state.tasks.filter(t => t.quadrant === "q4").length;
  if (dropped) {
    wrap.appendChild(el("div", { class: "note-line", text: `${plural(dropped, "task")} in Eliminate. You chose to let ${dropped === 1 ? "it" : "them"} go.` }));
  }
  return wrap;
}

/* ─── PHASE: REFLECT ────────────────────────────────────────── */
function renderReflect(p) {
  const wrap = el("div", {}, [phaseHeader(p)]);
  const RATINGS = ["Not at all", "Somewhat", "Yes, definitely"];

  p.questions.forEach(q => {
    const card = el("div", { class: "question-card" }, [
      el("div", { class: "question-text", text: q }),
    ]);
    const row = el("div", { class: "rating-row" });
    RATINGS.forEach(r => {
      const active = state.reflectAnswers[q] === r;
      row.appendChild(el("button", {
        class: `rating-btn ${active ? "active" : ""}`,
        type: "button",
        onclick: () => { state.reflectAnswers[q] = r; saveState(); render(); },
        text: r,
      }));
    });
    card.appendChild(row);
    wrap.appendChild(card);
  });

  wrap.appendChild(el("div", { class: "section" }, [
    el("span", { class: "section-label", text: "Dig deeper: your notes" }),
    el("textarea", {
      placeholder: "Why did this happen? Ask why again...",
      value: state.reflectNotes || "",
      oninput: (e) => { state.reflectNotes = e.target.value; saveState(); },
    }),
  ]));

  const totalCount = state.tasks.length;
  const doneCount  = state.tasks.filter(t => t.done).length;
  const rate = totalCount > 0 ? `${Math.round((doneCount / totalCount) * 100)}%` : "-";

  wrap.appendChild(el("div", { class: "stats-banner" }, [
    el("div", { class: "stat" }, [
      el("div", { class: "stat-value", text: String(totalCount) }),
      el("div", { class: "stat-label", text: "Tasks captured" }),
    ]),
    el("div", { class: "stat" }, [
      el("div", { class: "stat-value", text: String(doneCount) }),
      el("div", { class: "stat-label", text: "Tasks completed" }),
    ]),
    el("div", { class: "stat" }, [
      el("div", { class: "stat-value", text: rate }),
      el("div", { class: "stat-label", text: "Completion rate" }),
    ]),
  ]));

  wrap.appendChild(el("div", { class: "save-card" }, [
    el("div", { class: "save-card-body" }, [
      el("div", { class: "save-card-title", text: "Save this session" }),
      el("div", { class: "save-card-sub",
        text: "Download a .txt with your tasks, schedule, messages, and reflection, so you still have it after you reset." }),
    ]),
    el("button", {
      class: "btn btn-primary",
      type: "button",
      onclick: () => downloadFullSession(),
      html: `${SVG.save}<span>Save Session</span>`,
    }),
  ]));

  return wrap;
}

/* ─── ROUTER ────────────────────────────────────────────────── */
function renderPhaseContent() {
  const p = PHASES[state.phase];
  switch (p.type) {
    case "checklist":   return renderChecklist(p);
    case "input-list":  return renderListPhase(p);
    case "matrix":      return renderMatrix(p);
    case "schedule":    return renderSchedule(p);
    case "communicate": return renderCommunicate(p);
    case "triage":      return renderTriage(p);
    case "reflect":     return renderReflect(p);
  }
}

function renderQuote() {
  const slot = $("#quoteSlot");
  slot.innerHTML = "";
  if (state.phase !== PHASES.length - 1) return;
  slot.appendChild(el("div", { class: "quote" }, [
    el("p", { text: `"The mind should not be kept continuously at the same pitch of concentration,` }),
    el("p", { text: `but given amusing diversions. Our minds must relax.` }),
    el("p", { text: `They will rise better, and keener after a rest."` }),
    el("p", { class: "quote-attr", text: "Seneca the Younger" }),
  ]));
}

const ARROW_SVG = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12,5 19,12 12,19"/></svg>`;

function goTo(i) {
  const next = Math.max(0, Math.min(PHASES.length - 1, i));
  if (next === state.phase) return;
  state.phase = next;
  _pickId = null;
  saveState(); render(true);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function render(animate = false) {
  renderPips();

  const content = $("#phaseContent");
  content.innerHTML = "";
  content.classList.remove("enter");
  if (animate) { void content.offsetWidth; content.classList.add("enter"); }
  content.appendChild(renderPhaseContent());

  const p = PHASES[state.phase];
  if (p.tip) content.appendChild(tipBlock(p.tip));

  const backBtn = $("#backBtn");
  const nextBtn = $("#nextBtn");
  const nextLabel = $("#nextLabel");

  backBtn.classList.toggle("nav-back-hidden", state.phase === 0);
  backBtn.onclick = () => goTo(state.phase - 1);

  const isLast = state.phase === PHASES.length - 1;
  if (isLast) {
    nextLabel.textContent = "New Session";
    nextBtn.classList.remove("btn-primary");
    nextBtn.classList.add("btn-dark");
    nextBtn.querySelector("svg").outerHTML = SVG.refresh;
    nextBtn.onclick = () => {
      if (confirm("Reset and start a new session? Your current session will be cleared from this browser. (Use Save Session first if you want a copy.)")) {
        state = defaultState();
        saveState(); render(true);
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    };
  } else {
    nextLabel.textContent = state.phase === 0 ? "Begin" : `Next: ${PHASES[state.phase + 1].title}`;
    nextBtn.classList.add("btn-primary");
    nextBtn.classList.remove("btn-dark");
    nextBtn.querySelector("svg").outerHTML = ARROW_SVG;
    nextBtn.onclick = () => goTo(state.phase + 1);
  }

  renderQuote();
}

/* ═══════════════════════════════════════════════════════════════
   IMPORT / EXPORT / SAVE
   ═══════════════════════════════════════════════════════════════ */

function downloadBlob(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function timestamp() {
  const d = new Date();
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
}

/* ---- EXPORT TODOS (just the task list, JSON for round-trip) ---- */
function exportTodos() {
  if (state.tasks.length === 0) {
    toast("No todos to export", "error");
    return;
  }
  const payload = {
    type: "sharp-axe-todos",
    version: 2,
    exportedAt: new Date().toISOString(),
    tasks: state.tasks.map(t => ({
      text: t.text,
      quadrant: t.quadrant,
      done: !!t.done,
      scheduledTime: t.scheduledTime || "",
      date: t.date || "",
      duration: t.duration || 30,
      steps: (t.steps || []).map(s => ({ text: s.text, done: !!s.done })),
    })),
  };
  downloadBlob(
    `sharp-axe-todos_${timestamp()}.json`,
    JSON.stringify(payload, null, 2),
    "application/json"
  );
  toast(`Exported ${plural(state.tasks.length, "todo")}`);
}

/* ---- IMPORT TODOS ---- */
function importTodos() {
  $("#fileInput").click();
}

async function handleFileImport(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    let incoming = [];
    if (Array.isArray(data)) {
      incoming = data;
    } else if (data && Array.isArray(data.tasks)) {
      incoming = data.tasks;
    } else {
      throw new Error("Unrecognized file format");
    }
    // "q3" (the old Delegate box) is no longer used: those tasks come in unsorted.
    const cleaned = incoming
      .filter(t => t && typeof t.text === "string" && t.text.trim())
      .map(t => normalizeTask({ ...t, id: null }));
    if (cleaned.length === 0) throw new Error("No tasks found in file");

    let mode = "append";
    if (state.tasks.length > 0) {
      const yes = confirm(
        `Import ${plural(cleaned.length, "todo")}?\n\n` +
        `OK  = Append to your existing ${plural(state.tasks.length, "todo")}\n` +
        `Cancel = Replace all existing todos`
      );
      mode = yes ? "append" : "replace";
    }
    if (mode === "replace") {
      state.tasks = cleaned;
      state.triageOrder = [];
    } else {
      state.tasks = state.tasks.concat(cleaned);
    }
    saveState(); render();
    toast(`Imported ${plural(cleaned.length, "todo")}`);
  } catch (err) {
    toast("Couldn't import: " + (err.message || "invalid file"), "error");
  } finally {
    e.target.value = "";
  }
}

/* ---- SAVE FULL SESSION (readable .txt with everything) ---- */
function downloadFullSession() {
  const lines = [];
  const now = new Date();
  const mark = t => (t.done ? "[x] " : "[ ] ");
  lines.push("==============================================");
  lines.push("           SHARP AXE METHOD: SESSION          ");
  lines.push("==============================================");
  lines.push("");
  lines.push("Saved: " + now.toLocaleString());
  lines.push("");

  ["physical", "mental"].forEach(id => {
    const phase = PHASES.find(p => p.id === id);
    const items = state.checklistItems[id] || [];
    lines.push("--- " + phase.title.toUpperCase() + " ---");
    phase.items.forEach((item, i) => {
      lines.push((items[i] ? "[x] " : "[ ] ") + (typeof item === "string" ? item : item.text));
    });
    lines.push("");
  });

  lines.push("--- BRAIN DUMP ---");
  lines.push((state.mentalDump || "").trim() || "(none)");
  lines.push("");

  lines.push("--- ALL TODOS ---");
  if (state.tasks.length === 0) {
    lines.push("(none captured)");
  } else {
    state.tasks.forEach((t, i) => lines.push(`${i + 1}. ${mark(t)}${t.text}`));
  }
  lines.push("");

  lines.push("--- SORTED ---");
  QUADRANTS.forEach(q => {
    const tasks = state.tasks.filter(t => t.quadrant === q.id);
    lines.push(`\n  ${q.label.toUpperCase()} (${q.sub})`);
    if (tasks.length === 0) lines.push("    (none)");
    else tasks.forEach(t => lines.push(`    - ${mark(t)}${t.text}`));
  });
  const unassigned = state.tasks.filter(t => !t.quadrant);
  if (unassigned.length) {
    lines.push("\n  NOT SORTED");
    unassigned.forEach(t => lines.push(`    - ${mark(t)}${t.text}`));
  }
  lines.push("");

  lines.push("--- SCHEDULE ---");
  const scheduled = schedulableTasks();
  if (scheduled.length === 0) {
    lines.push("(no scheduled tasks)");
  } else {
    scheduled.forEach((t, i) => {
      const q = qInfo(t.quadrant);
      const when = whenText(t);
      const tag  = q ? ` [${q.label}]` : "";
      lines.push(`${i + 1}. ${mark(t)}${t.text}${tag}${when ? ` @ ${when}` : ""} (${durLabel(t.duration || 30)})`);
      (t.steps || []).forEach(s => lines.push(`      ${s.done ? "[x]" : "[ ]"} ${s.text}`));
    });
  }
  lines.push("");

  lines.push("--- COMMUNICATE ---");
  lines.push((state.scheduleNotes || "").trim() || "(none)");
  lines.push("");

  const active = state.tasks.filter(t => t.quadrant !== "q4");
  const done = active.filter(t => t.done).length;
  const pct = active.length > 0 ? Math.round((done / active.length) * 100) : 0;
  lines.push("--- TRIAGE ---");
  lines.push(`Completed: ${done} / ${active.length} (${pct}%)`);
  lines.push("");

  lines.push("--- REFLECTION ---");
  const refPhase = PHASES.find(p => p.id === "reflect");
  refPhase.questions.forEach(q => {
    lines.push(`Q: ${q}`);
    lines.push(`A: ${state.reflectAnswers[q] || "(not answered)"}`);
    lines.push("");
  });

  lines.push("--- DIG DEEPER: YOUR NOTES ---");
  lines.push((state.reflectNotes || "").trim() || "(none)");
  lines.push("");

  lines.push("==============================================");
  lines.push(`"The mind should not be kept continuously at the same`);
  lines.push(`pitch of concentration, but given amusing diversions.`);
  lines.push(`Our minds must relax. They will rise better, and`);
  lines.push(`keener after a rest."  - Seneca the Younger`);

  downloadBlob(`sharp-axe-session_${timestamp()}.txt`, lines.join("\n"), "text/plain;charset=utf-8");
  toast("Session saved");
}

/* ─── MENU WIRING ───────────────────────────────────────────── */
const menuBtn = $("#menuBtn");
const menuDropdown = $("#menuDropdown");
function closeMenu() {
  menuDropdown.classList.remove("open");
  menuBtn.classList.remove("open");
  menuBtn.setAttribute("aria-expanded", "false");
}
function openMenu() {
  menuDropdown.classList.add("open");
  menuBtn.classList.add("open");
  menuBtn.setAttribute("aria-expanded", "true");
}
menuBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  menuDropdown.classList.contains("open") ? closeMenu() : openMenu();
});
document.addEventListener("click", (e) => {
  if (!menuDropdown.contains(e.target) && e.target !== menuBtn) closeMenu();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    closeMenu();
    if (_pickId) { _pickId = null; render(); }
  }
});

$("#miImport").addEventListener("click", () => { closeMenu(); importTodos(); });
$("#miExport").addEventListener("click", () => { closeMenu(); exportTodos(); });
$("#miSaveAll").addEventListener("click", () => { closeMenu(); downloadFullSession(); });
$("#fileInput").addEventListener("change", handleFileImport);

/* ─── KICKOFF ───────────────────────────────────────────────── */
render(true);
window.addEventListener("beforeunload", saveState);
</script>
